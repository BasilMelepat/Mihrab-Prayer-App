/* ---- Rawatib ---- */
rw_1:XM(TL3("The sunnah prayers","റവാത്തിബ് സുന്നത്തുകൾ","السنن الرواتب"),{pose:"info",
  lines:[L1("رَكْعَتَا الْفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا","Rak\u2019atal-fajri khayrun minad-dunyaa wa maa feehaa","ഫജ്റിന്റെ രണ്ട് റക്അത്ത് ഇഹലോകത്തേക്കാളും അതിലുള്ളതിനേക്കാളും ഉത്തമമാണ്.","The two rak\u2019ahs of Fajr are better than the world and everything in it.")],
  b:TL3("The rawatib are the sunnah rak\u2019ahs prayed before and after the five daily prayers, each as two rak\u2019ahs. The Prophet \uFDFA never left the Fajr sunnah, so it is the most important of them.",
        "അഞ്ച് നേരത്തെ നമസ്കാരങ്ങൾക്ക് മുമ്പും ശേഷവും നമസ്കരിക്കുന്ന സുന്നത്തുകളാണ് റവാത്തിബ്; ഓരോന്നും രണ്ട് റക്അത്ത് വീതം. നബി \uFDFA സുബ്ഹിയുടെ സുന്നത്ത് ഒരിക്കലും ഉപേക്ഷിച്ചില്ല, അതിനാൽ അവയിൽ ഏറ്റവും പ്രധാനം അതാണ്.",
        "الرواتب هي السنن التي تُصلّى قبل الصلوات الخمس وبعدها، وكل منها ركعتان. ولم يترك النبي \uFDFA سنة الفجر، فهي أهمها.")}),
rw_2:XM(TL3("The twelve confirmed rak\u2019ahs","സ്ഥിരീകരിച്ച പന്ത്രണ്ട് റക്അത്തുകൾ","الركعات الاثنتا عشرة المؤكدة"),{pose:"info",
  b:TL3("Two before Fajr, four before Dhuhr, two after Dhuhr, two after Maghrib and two after Isha. The Prophet \uFDFA said that whoever prays twelve rak'ahs a day has a house built for them in Paradise (Muslim).\n\nOther voluntary prayers are also recommended, such as four before Asr.",
        "സുബ്ഹിക്ക് മുമ്പ് രണ്ട്, ളുഹ്റിന് മുമ്പ് നാല്, ളുഹ്റിന് ശേഷം രണ്ട്, മഗ്‌രിബിന് ശേഷം രണ്ട്, ഇശായ്ക്ക് ശേഷം രണ്ട്. ഒരു ദിവസം പന്ത്രണ്ട് റക്അത്ത് നമസ്കരിക്കുന്നവർക്ക് സ്വർഗത്തിൽ ഒരു വീട് പണിയപ്പെടുമെന്ന് നബി ﷺ പറഞ്ഞു (മുസ്‌ലിം).\n\nമറ്റ് ഐച്ഛിക നമസ്കാരങ്ങളും ശുപാർശ ചെയ്യപ്പെടുന്നു, അസ്റിന് മുമ്പ് നാല് പോലുള്ളവ.",
        "ركعتان قبل الفجر، وأربع قبل الظهر، وركعتان بعد الظهر، وركعتان بعد المغرب، وركعتان بعد العشاء. وقد قال النبي ﷺ: من صلّى اثنتي عشرة ركعة في اليوم بُني له بيت في الجنة (مسلم).\n\nويُستحب غيرها من النوافل كأربع قبل العصر.")}),
rw_3:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ الصُّبْحِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatas-subhi rak\u2019ataini mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, സുബ്ഹിയുടെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the two rak\u2019ahs of the Fajr sunnah, facing the Qibla, for the sake of Allah."),
         L1("أُصَلِّي سُنَّةَ الظُّهْرِ رَكْعَتَيْنِ قَبْلِيَّةً مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatadh-dhuhri rak\u2019ataini qabliyyatan mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ളുഹ്റിന് മുമ്പുള്ള രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","The two rak\u2019ahs before Dhuhr."),
         L1("أُصَلِّي سُنَّةَ الظُّهْرِ رَكْعَتَيْنِ بَعْدِيَّةً مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatadh-dhuhri rak\u2019ataini ba\u2019diyyatan mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ളുഹ്റിന് ശേഷമുള്ള രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","The two rak\u2019ahs after Dhuhr."),
         L1("أُصَلِّي سُنَّةَ الْمَغْرِبِ رَكْعَتَيْنِ بَعْدِيَّةً مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatal-maghribi rak\u2019ataini ba\u2019diyyatan mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, മഗ്‌രിബിന് ശേഷമുള്ള രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","The two rak\u2019ahs after Maghrib."),
         L1("أُصَلِّي سُنَّةَ الْعِشَاءِ رَكْعَتَيْنِ بَعْدِيَّةً مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatal-ishaa\u2019i rak\u2019ataini ba\u2019diyyatan mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ഇശായ്ക്ക് ശേഷമുള്ള രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","The two rak\u2019ahs after Isha.")],
  nt:TL3("Say the intention in your heart. The five lines are Fajr, before Dhuhr, after Dhuhr, after Maghrib and after Isha.","നിയ്യത്ത് ഹൃദയത്തിൽ ചെയ്യുക. അഞ്ച് വരികൾ: സുബ്ഹി, ളുഹ്റിന് മുമ്പ്, ളുഹ്റിന് ശേഷം, മഗ്‌രിബിന് ശേഷം, ഇശായ്ക്ക് ശേഷം.","انوِ بقلبك. الأسطر الخمسة: الفجر، قبل الظهر، بعد الظهر، بعد المغرب، بعد العشاء.")}),
sur_rw:XM(TL3("A surah","സൂറത്ത്","سورة"),{pose:"info",
  b:TL3("Recite a surah after Al-Fatiha. In the Fajr sunnah, the sunnah is Surah Al-Kafirun in the first rak\u2019ah and Surah Al-Ikhlas in the second. In the others, any surah will do.",
        "ഫാതിഹക്ക് ശേഷം ഒരു സൂറത്ത് ഓതുക. സുബ്ഹിയുടെ സുന്നത്തിൽ ഒന്നാം റക്അത്തിൽ സൂറത്തുൽ കാഫിറൂനും രണ്ടാമത്തേതിൽ സൂറത്തുൽ ഇഖ്ലാസും ഓതുന്നത് സുന്നത്താണ്. മറ്റുള്ളവയിൽ ഏത് സൂറത്തും ഓതാം.",
        "اقرأ سورة بعد الفاتحة. وفي سنة الفجر السنة قراءة الكافرون في الأولى والإخلاص في الثانية. وفي غيرها تجزئ أي سورة.")}),
/* ---- Witr ---- */
wt_info:XM(TL3("About witr","വിത്റിനെക്കുറിച്ച്","عن الوتر"),{pose:"info",
  lines:[L1("اجْعَلُوا آخِرَ صَلَاتِكُمْ بِاللَّيْلِ وِتْرًا","Ij\u2019aloo aakhira salaatikum billayli witraa","രാത്രി നമസ്കാരത്തിലെ അവസാനത്തേത് വിത്റാക്കുക.","Make witr the last of your night prayers.")],
  b:TL3("Witr is a strongly recommended sunnah with an odd number of rak\u2019ahs, from one to eleven; three is common. Its time is from after Isha until Fajr. The qunut is not limited to Ramadan.",
        "വിത്ർ ശക്തമായ സുന്നത്താണ്; ഒറ്റസംഖ്യ റക്അത്തുകളാണ്, ഒന്ന് മുതൽ പതിനൊന്ന് വരെ; മൂന്ന് സാധാരണമാണ്. ഇശായ്ക്ക് ശേഷം മുതൽ സുബ്ഹി വരെയാണ് അതിന്റെ സമയം.",
        "الوتر سنة مؤكدة عدد ركعاتها فردي من واحدة إلى إحدى عشرة، وأشهرها ثلاث. ووقتها من بعد العشاء إلى الفجر."),
  nt:TL3("Three rak\u2019ahs are shown here: two with a salam, then one.","ഇവിടെ മൂന്ന് റക്അത്ത് കാണിച്ചിരിക്കുന്നു: സലാമോടെ രണ്ട്, പിന്നെ ഒന്ന്.","هنا ثلاث ركعات: ركعتان بسلام ثم ركعة.")}),
wt_niy2:XM(TL3("Intention (first two rak\u2019ahs)","നിയ്യത്ത് (ആദ്യ രണ്ട് റക്അത്ത്)","النية (الركعتان الأوليان)"),{
  lines:[L1("أُصَلِّي سُنَّةَ الْوِتْرِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatal-witri rak\u2019ataini mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, വിത്റിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the witr sunnah, facing the Qibla, for the sake of Allah.")]}),
sur_wt:XM(TL3("A surah","സൂറത്ത്","سورة"),{pose:"info",
  b:TL3("The sunnah is Surah Al-A\u2019la in the first rak\u2019ah and Surah Al-Kafirun in the second.","ഒന്നാം റക്അത്തിൽ സൂറത്തുൽ അഅ്‌ലയും രണ്ടാമത്തേതിൽ സൂറത്തുൽ കാഫിറൂനും ഓതുന്നത് സുന്നത്താണ്.","السنة قراءة الأعلى في الأولى والكافرون في الثانية.")}),
wt_niy1:XM(TL3("Intention (single rak\u2019ah)","നിയ്യത്ത് (ഒരു റക്അത്ത്)","النية (الركعة الواحدة)"),{
  lines:[L1("أُصَلِّي سُنَّةَ الْوِتْرِ رَكْعَةً مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatal-witri rak\u2019atan mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, വിത്റിന്റെ ഒരു റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray one rak\u2019ah of the witr sunnah, facing the Qibla, for the sake of Allah.")],
  b:TL3("After the salam, stand up for the single rak\u2019ah of witr.","സലാമിന് ശേഷം, വിത്റിന്റെ ഒറ്റ റക്അത്തിനായി എഴുന്നേൽക്കുക.","بعد السلام قم للركعة الواحدة من الوتر.")}),
sur_wt3:XM(TL3("A surah","സൂറത്ത്","سورة"),{pose:"info",
  b:TL3("The sunnah is Surah Al-Ikhlas, then Surah Al-Falaq and Surah An-Nas.","സൂറത്തുൽ ഇഖ്ലാസും, തുടർന്ന് സൂറത്തുൽ ഫലഖും സൂറത്തുന്നാസും ഓതുന്നത് സുന്നത്താണ്.","السنة قراءة الإخلاص ثم الفلق والناس.")}),
wt_qunut:XM(TL3("Qunut (second half of Ramadan)","ഖുനൂത്ത് (റമദാനിന്റെ രണ്ടാം പകുതി)","القنوت (النصف الثاني من رمضان)"),{
  lines:[L1("اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، وَلَا يَعِزُّ مَنْ عَادَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ",
     "Allaahummah-dinee feeman hadayt, wa aafinee feeman aafayt, wa tawallanee feeman tawallayt, wa baarik lee feemaa a\u2019tayt, wa qinee sharra maa qadhayt, fa-innaka taqdee wa laa yuqdaa alayk, wa innahu laa yadhillu man waalayt, wa laa ya\u2019izzu man aadayt, tabaarakta rabbanaa wa ta\u2019aalayt",
     "അല്ലാഹുവേ, നീ നേർവഴിയിലാക്കിയവരിൽ എന്നെയും ഉൾപ്പെടുത്തി നേർവഴിയിലാക്കേണമേ; നീ സൗഖ്യം നൽകിയവരിൽ എനിക്കും സൗഖ്യം നൽകേണമേ; നീ ഏറ്റെടുത്തവരിൽ എന്നെയും ഏറ്റെടുക്കേണമേ; നീ നൽകിയതിൽ എനിക്ക് ബറകത്ത് നൽകേണമേ; നീ വിധിച്ച തിന്മയിൽ നിന്ന് എന്നെ കാക്കേണമേ. തീർച്ചയായും നീ വിധിക്കുന്നു, നിനക്കെതിരെ വിധിക്കപ്പെടുകയില്ല. നീ സഹായിച്ചവൻ അപമാനിതനാവില്ല, നീ ശത്രുവാക്കിയവൻ പ്രതാപിയാവുകയുമില്ല. ഞങ്ങളുടെ രക്ഷിതാവേ, നീ അനുഗ്രഹപൂർണനും അത്യുന്നതനുമാകുന്നു.",
     "O Allah, guide me among those You have guided, grant me well-being among those You have granted well-being, take me into Your care among those You have taken into Your care, bless me in what You have given, and protect me from the evil You have decreed. You decree and none decrees over You. He whom You support is never humiliated, and he whom You oppose is never honoured. Blessed are You, our Lord, and exalted.")],
  nt:TL3("Qunut in witr is reported from the Prophet \uFDFA without a time limit, so it may be said at any time of year, and only sometimes. It may be recited before or after the bowing of the last rak\u2019ah.","ശാഫിഈ മദ്ഹബിൽ വിത്റിലെ ഖുനൂത്ത് റമദാനിന്റെ രണ്ടാം പകുതിയിൽ, അവസാന റക്അത്തിലെ റുകൂഇൽ നിന്ന് ഉയർന്ന ശേഷം ഓതുന്നു. കൈകൾ ഉയർത്തുക; ജമാഅത്ത് ആമീൻ പറയും.","في المذهب الشافعي يُقرأ قنوت الوتر بعد الرفع من ركوع الركعة الأخيرة في النصف الثاني من رمضان. ارفع يديك، والمأمومون يقولون آمين.")}),
wt_after:XM(TL3("After witr","വിത്റിന് ശേഷം","بعد الوتر"),{pose:"info",rep:3,
  lines:[L1("سُبْحَانَ الْمَلِكِ الْقُدُّوسِ","Subhaanal-malikil-quddoos","പരമാധികാരിയും പരിശുദ്ധനുമായ അല്ലാഹു പരിശുദ്ധൻ.","Glory be to the Sovereign, the Most Holy.")],
  nt:TL3("Say it three times, raising your voice on the third.","മൂന്ന് തവണ ചൊല്ലുക, മൂന്നാമത്തേതിൽ ശബ്ദം ഉയർത്തുക.","قلها ثلاث مرات، وارفع صوتك في الثالثة.")}),
/* ---- Taraweeh ---- */
tw_info:XM(TL3("About Taraweeh","തറാവീഹിനെക്കുറിച്ച്","عن التراويح"),{pose:"info",
  b:TL3("Taraweeh is the Ramadan night prayer (qiyam), prayed after Isha. The Prophet ﷺ prayed eleven rak’ahs at night in Ramadan and outside it, including Witr (Bukhari and Muslim). So Taraweeh is eight rak’ahs in pairs, with a salam after every two, followed by three of Witr. More is permitted. It is best prayed in congregation.",
        "റമദാൻ രാത്രികളിൽ ഇശായ്ക്ക് ശേഷം നമസ്കരിക്കുന്ന നമസ്കാരമാണ് തറാവീഹ് (ഖിയാം). നബി ﷺ റമദാനിലും അല്ലാത്ത കാലത്തും വിത്ർ ഉൾപ്പെടെ രാത്രിയിൽ പതിനൊന്ന് റക്അത്ത് നമസ്കരിച്ചു (ബുഖാരി, മുസ്‌ലിം). അതിനാൽ തറാവീഹ് എട്ട് റക്അത്താണ്, ഓരോ രണ്ടിനും സലാം വീട്ടി ജോഡികളായി; അതിന് ശേഷം മൂന്ന് റക്അത്ത് വിത്ർ. കൂടുതൽ നമസ്കരിക്കാനും അനുവാദമുണ്ട്. ജമാഅത്തായി നമസ്കരിക്കുന്നതാണ് ഉത്തമം.",
        "التراويح صلاة ليالي رمضان (القيام) بعد العشاء. وقد صلّى النبي ﷺ إحدى عشرة ركعة بالليل في رمضان وغيره بما فيها الوتر (البخاري ومسلم). فالتراويح ثماني ركعات مثنى مثنى، يُسلَّم من كل ركعتين، ثم ثلاث ركعات وتر. ويجوز الزيادة. والأفضل أداؤها جماعة.")}),
tw_niy:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ التَّرَاوِيحِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatat-taraaweehi rak\u2019ataini mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, തറാവീഹിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Taraweeh sunnah, facing the Qibla, for the sake of Allah.")]}),
tw_rep:XM(TL3("Repeat, then rest","ആവർത്തിക്കുക, പിന്നെ വിശ്രമം","كرّر ثم استرح"),{pose:"info",
  lines:[L1("سُبْحَانَ ذِي الْمُلْكِ وَالْمَلَكُوتِ، سُبْحَانَ ذِي الْعِزَّةِ وَالْعَظَمَةِ وَالْهَيْبَةِ وَالْقُدْرَةِ وَالْكِبْرِيَاءِ وَالْجَبَرُوتِ، سُبْحَانَ الْمَلِكِ الْحَيِّ الَّذِي لَا يَنَامُ وَلَا يَمُوتُ، سُبُّوحٌ قُدُّوسٌ رَبُّنَا وَرَبُّ الْمَلَائِكَةِ وَالرُّوحِ",
     "Subhaana dhil-mulki wal-malakoot, subhaana dhil-izzati wal-azamati wal-haybati wal-qudrati wal-kibriyaa\u2019i wal-jabaroot, subhaanal-malikil-hayyil-ladhee laa yanaamu wa laa yamoot, subboohun quddoosun rabbunaa wa rabbul-malaa\u2019ikati war-rooh",
     "അധികാരത്തിന്റെയും ആധിപത്യത്തിന്റെയും ഉടമ പരിശുദ്ധൻ; പ്രതാപം, മഹത്വം, ഗാംഭീര്യം, കഴിവ്, മഹിമ, ശക്തി എന്നിവയുടെ ഉടമ പരിശുദ്ധൻ; ഉറങ്ങുകയോ മരിക്കുകയോ ചെയ്യാത്ത ജീവനുള്ള രാജാവ് പരിശുദ്ധൻ; ഞങ്ങളുടെ രക്ഷിതാവും മലക്കുകളുടെയും റൂഹിന്റെയും രക്ഷിതാവുമായവൻ അത്യന്തം പരിശുദ്ധൻ, ഏറ്റവും വിശുദ്ധൻ.",
     "Glory be to the Owner of dominion and sovereignty. Glory be to the Owner of might, greatness, awe, power, pride and majesty. Glory be to the Living King who neither sleeps nor dies. Most Holy, Most Pure, our Lord and Lord of the angels and the Spirit.")],
  b:TL3("Repeat these two rak’ahs four times in all, eight rak’ahs. After every four rak’ahs, sit briefly and say the tasbih below, then continue. Finish with three rak’ahs of Witr, which makes eleven in all; see the Witr guide.",
        "ഈ രണ്ട് റക്അത്ത് ആകെ നാല് തവണ ആവർത്തിക്കുക, ആകെ എട്ട് റക്അത്ത്. ഓരോ നാല് റക്അത്തിനും ശേഷം അൽപം ഇരുന്ന് താഴെയുള്ള തസ്ബീഹ് ചൊല്ലിയ ശേഷം തുടരുക. മൂന്ന് റക്അത്ത് വിത്റോടെ അവസാനിപ്പിക്കുക, അങ്ങനെ ആകെ പതിനൊന്ന്; വിത്ർ ഗൈഡ് കാണുക.",
        "كرّر هاتين الركعتين أربع مرات في المجموع، أي ثماني ركعات. وبعد كل أربع ركعات اجلس قليلًا وقل التسبيح التالي ثم تابع. واختم بثلاث ركعات وتر فيكتمل العدد إحدى عشرة؛ راجع دليل الوتر."),
  nt:TL3("This tasbih is a long-standing custom, not a narrated text.","ഈ തസ്ബീഹ് പണ്ടുമുതലുള്ള ആചാരമാണ്, ഉദ്ധരിക്കപ്പെട്ട വചനമല്ല.","هذا التسبيح عادة قديمة وليس نصًّا مرويًّا.")}),
/* ---- Tahajjud ---- */
td_info:XM(TL3("About Tahajjud","തഹജ്ജുദിനെക്കുറിച്ച്","عن التهجد"),{pose:"info",
  b:TL3("Tahajjud is a voluntary night prayer, prayed after you have slept. The best time is the last third of the night. Pray it in pairs of two rak\u2019ahs; eight is common, and you may pray fewer or more.",
        "ഉറങ്ങിയ ശേഷം നമസ്കരിക്കുന്ന ഐച്ഛികമായ രാത്രി നമസ്കാരമാണ് തഹജ്ജുദ്. രാത്രിയുടെ അവസാന മൂന്നിലൊന്നാണ് ഏറ്റവും ഉത്തമ സമയം. രണ്ട് റക്അത്തിന്റെ ജോഡികളായി നമസ്കരിക്കുക; എട്ട് റക്അത്ത് സാധാരണമാണ്, കുറച്ചോ കൂടുതലോ നമസ്കരിക്കാം.",
        "التهجد صلاة نافلة بالليل بعد النوم. وأفضل وقتها الثلث الأخير من الليل. تُصلّى مثنى مثنى، وثمانٍ شائعة، ويجوز أقل أو أكثر.")}),
td_niy:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ التَّهَجُّدِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatat-tahajjudi rak\u2019ataini mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, തഹജ്ജുദിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Tahajjud sunnah, facing the Qibla, for the sake of Allah.")]}),
td_dua:XM(TL3("Dua after Tahajjud","തഹജ്ജുദിന് ശേഷമുള്ള ദുആ","الدعاء بعد التهجد"),{pose:"info",
  lines:[L1("رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","Rabbanaa aatinaa fid-dunyaa hasanatan wa fil-aakhirati hasanatan wa qinaa adhaaban-naar","ഞങ്ങളുടെ രക്ഷിതാവേ, ഇഹലോകത്തും നന്മ നൽകേണമേ, പരലോകത്തും നന്മ നൽകേണമേ, നരകശിക്ഷയിൽ നിന്ന് ഞങ്ങളെ കാക്കേണമേ.","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.")],
  b:TL3("Spend time in dua and istighfar. The last third of the night is a special time for supplication.","ദുആയിലും ഇസ്തിഗ്ഫാറിലും സമയം ചെലവഴിക്കുക. രാത്രിയുടെ അവസാന മൂന്നിലൊന്ന് പ്രാർഥനയ്ക്ക് പ്രത്യേക സമയമാണ്.","اقضِ وقتًا في الدعاء والاستغفار. والثلث الأخير من الليل وقت خاص للدعاء.")}),
/* ---- Duha ---- */
dh_info:XM(TL3("About Duha","ദുഹായെക്കുറിച്ച്","عن الضحى"),{pose:"info",
  b:TL3("Duha is a voluntary morning prayer, from shortly after sunrise until the sun is about to reach its highest point. Two rak\u2019ahs is the minimum and eight is best; pray them in pairs.",
        "രാവിലെ, സൂര്യോദയത്തിന് അൽപം കഴിഞ്ഞ് മുതൽ സൂര്യൻ ഏറ്റവും ഉയരത്തിലെത്താറാകുന്നതുവരെ നമസ്കരിക്കുന്ന ഐച്ഛിക നമസ്കാരമാണ് ദുഹാ. കുറഞ്ഞത് രണ്ട് റക്അത്ത്, എട്ട് റക്അത്ത് ഏറ്റവും ഉത്തമം; ജോഡികളായി നമസ്കരിക്കുക.",
        "الضحى صلاة نافلة في الصباح، من بعد الشروق بقليل إلى قبيل استواء الشمس. أقلها ركعتان وأفضلها ثمانٍ، وتُصلّى مثنى مثنى.")}),
dh_niy:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ الضُّحَى رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatad-duhaa rak\u2019ataini mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ദുഹായുടെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Duha sunnah, facing the Qibla, for the sake of Allah.")]}),
sur_duha:XM(TL3("A surah","സൂറത്ത്","سورة"),{pose:"info",
  b:TL3("Recite any surah after Al-Fatiha.","ഫാതിഹക്ക് ശേഷം ഒരു സൂറത്ത് ഓതുക. ഒന്നാം റക്അത്തിൽ സൂറത്തുശ്ശംസും രണ്ടാമത്തേതിൽ സൂറത്തുദ്ദുഹായും ഓതുന്നത് സുന്നത്താണ്.","اقرأ سورة بعد الفاتحة. والسنة قراءة الشمس في الأولى والضحى في الثانية.")}),
/* ---- Awwabin ---- */
aw_info:XM(TL3("About Awwabin","അവ്വാബീനെക്കുറിച്ച്","عن الأوابين"),{pose:"info",
  b:TL3("Awwabin is a voluntary prayer between Maghrib and Isha. Six rak\u2019ahs after the Maghrib sunnah is common, prayed in pairs. The word means those who often return to Allah.",
        "മഗ്‌രിബിനും ഇശായ്ക്കും ഇടയിൽ നമസ്കരിക്കുന്ന ഐച്ഛിക നമസ്കാരമാണ് അവ്വാബീൻ. മഗ്‌രിബിന്റെ സുന്നത്തിന് ശേഷം ആറ് റക്അത്ത് സാധാരണമാണ്, ജോഡികളായി. അല്ലാഹുവിലേക്ക് ഏറെ മടങ്ങുന്നവർ എന്നാണ് ഈ വാക്കിന്റെ അർഥം.",
        "الأوابين صلاة نافلة بين المغرب والعشاء. وست ركعات بعد سنة المغرب شائعة، تُصلّى مثنى مثنى. والأوّاب هو الكثير الرجوع إلى الله.")}),
aw_niy:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ الْأَوَّابِينَ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatal-awwaabeena rak\u2019ataini mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, അവ്വാബീന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Awwabin sunnah, facing the Qibla, for the sake of Allah.")]}),
aw_rep:XM(TL3("Repeat for six rak\u2019ahs","ആറ് റക്അത്തിനായി ആവർത്തിക്കുക","كرّر لتكمل ست ركعات"),{pose:"info",
  b:TL3("Repeat these two rak\u2019ahs three times in all, with a salam after each pair.","ഈ രണ്ട് റക്അത്ത് ആകെ മൂന്ന് തവണ ആവർത്തിക്കുക, ഓരോ ജോഡിക്കും ശേഷം സലാം വീട്ടുക.","كرّر هاتين الركعتين ثلاث مرات في المجموع، مع السلام بعد كل ركعتين.")}),
/* ---- Ishraq ---- */
ish_info:XM(TL3("About Ishraq","ഇശ്റാഖിനെക്കുറിച്ച്","عن الإشراق"),{pose:"info",
  lines:[L1("مَنْ صَلَّى الْفَجْرَ فِي جَمَاعَةٍ ثُمَّ قَعَدَ يَذْكُرُ اللَّهَ حَتَّى تَطْلُعَ الشَّمْسُ ثُمَّ صَلَّى رَكْعَتَيْنِ كَانَتْ لَهُ كَأَجْرِ حَجَّةٍ وَعُمْرَةٍ تَامَّةٍ تَامَّةٍ تَامَّةٍ","Man sallal-fajra fee jamaa\u2019atin thumma qa\u2019ada yadhkurullaaha hattaa tatlu\u2019ash-shamsu thumma sallaa rak\u2019ataini kaanat lahu ka-ajri hajjatin wa umratin taammatin taammatin taammah","സുബ്ഹി ജമാഅത്തായി നമസ്കരിച്ച ശേഷം സൂര്യൻ ഉദിക്കുന്നതുവരെ അല്ലാഹുവിനെ സ്മരിച്ചിരുന്ന്, പിന്നെ രണ്ട് റക്അത്ത് നമസ്കരിക്കുന്നവന് പൂർണമായ ഹജ്ജിന്റെയും ഉംറയുടെയും പ്രതിഫലം ലഭിക്കും; പൂർണം, പൂർണം, പൂർണം.","Whoever prays Fajr in congregation, then sits remembering Allah until the sun rises, then prays two rak\u2019ahs, will have the reward of a complete Hajj and Umrah, complete, complete, complete.")],
  b:TL3("Ishraq is two rak\u2019ahs prayed about fifteen minutes after sunrise. It is the early part of Duha.","സൂര്യോദയത്തിന് ഏകദേശം പതിനഞ്ച് മിനിറ്റിന് ശേഷം നമസ്കരിക്കുന്ന രണ്ട് റക്അത്താണ് ഇശ്റാഖ്. ഇത് ദുഹായുടെ ആദ്യ ഭാഗമാണ്.","الإشراق ركعتان تُصلّيان بعد الشروق بنحو ربع ساعة، وهو أول وقت الضحى.")}),
ish_niy:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ الْإِشْرَاقِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ لِلَّهِ تَعَالَى","Usallee sunnatal-ishraaqi rak\u2019ataini mustaqbilal-qiblati lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ഇശ്റാഖിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Ishraq sunnah, facing the Qibla, for the sake of Allah.")]})

function nightWin(E,now){

  return now<E.today.fajr?{m:f([-1,"maghrib"]),i:f([-1,"isha"]),f:E.today.fajr}:{m:E.today.maghrib,i:E.today.isha,f:f([1,"fajr"])};
}

c3_ik1:XM(TL3("What is Istikhara?","എന്താണ് ഇസ്തിഖാറ?","ما هي الاستخارة؟"),{pose:"info",
  b:TL3("Istikhara is a two-rak\u2019ah voluntary prayer followed by a dua, asking Allah to guide you to what is best when you must choose between permissible options. It is not used for obligations or sins.\n\nAfterwards, consult trustworthy people, take the step that seems best and rely on Allah. No dream or special sign is required.",
        "ഇസ്തിഖാറ എന്നത് രണ്ട് റക്അത്ത് ഐച്ഛിക നമസ്കാരവും തുടർന്നുള്ള ദുആയുമാണ്; അനുവദനീയമായ കാര്യങ്ങളിൽ ഒന്ന് തിരഞ്ഞെടുക്കേണ്ടി വരുമ്പോൾ ഏറ്റവും നല്ലത് ഏതെന്ന് അല്ലാഹുവോട് വഴി ചോദിക്കുന്നു. നിർബന്ധ കാര്യങ്ങൾക്കോ പാപങ്ങൾക്കോ ഇത് ഉപയോഗിക്കരുത്.\n\nഅതിന് ശേഷം വിശ്വസ്തരോട് കൂടിയാലോചിക്കുക, ഏറ്റവും നല്ലതെന്ന് തോന്നുന്ന ചുവടുവെക്കുക, അല്ലാഹുവിൽ ഭരമേൽപ്പിക്കുക. സ്വപ്നമോ പ്രത്യേക അടയാളമോ ആവശ്യമില്ല.",
        "الاستخارة صلاة ركعتين نافلة يتبعها دعاء، تطلب فيه من الله أن يهديك إلى الخير عند الاختيار بين أمرين مباحين. ولا تُستعمل في الواجبات ولا المعاصي.\n\nثم استشر أهل الثقة، وأقدم على ما يظهر لك أنه الأفضل، وتوكّل على الله. ولا يُشترط رؤيا أو علامة.")}),

  lines:[L1("أُصَلِّي سُنَّةَ الِاسْتِخَارَةِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee sunnatal-istikhaarati rak\u2019ataini mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ഇസ്തിഖാറയുടെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Istikhara sunnah, facing the Qibla, for the sake of Allah.")]}),

  b:TL3("Recite any surah after Al-Fatiha.","ഒന്നാം റക്അത്തിൽ സൂറത്തുൽ കാഫിറൂനും രണ്ടാമത്തേതിൽ സൂറത്തുൽ ഇഖ്ലാസും ഓതുക. ഇത് സുന്നത്താണ്, നിർബന്ധമല്ല.","اقرأ الكافرون في الأولى والإخلاص في الثانية، وهذا مستحب وليس واجبًا.")}),
c3_ik4:XM(TL3("The dua of Istikhara","ഇസ്തിഖാറയുടെ ദുആ","دعاء الاستخارة"),{pose:"sit",
  lines:[L1("اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ",
     "Allaahumma innee astakheeruka bi\u2019ilmika, wa astaqdiruka biqudratika, wa as\u2019aluka min fadlikal-azeem, fa-innaka taqdiru wa laa aqdir, wa ta\u2019lamu wa laa a\u2019lam, wa anta allaamul-ghuyoob",
     "അല്ലാഹുവേ, നിന്റെ അറിവ് കൊണ്ട് ഞാൻ നിന്നോട് നന്മ തേടുന്നു; നിന്റെ കഴിവ് കൊണ്ട് ഞാൻ ശക്തി തേടുന്നു; നിന്റെ മഹത്തായ അനുഗ്രഹത്തിൽ നിന്ന് ഞാൻ ചോദിക്കുന്നു. നീ കഴിവുള്ളവൻ, ഞാൻ കഴിവില്ലാത്തവൻ; നീ അറിയുന്നു, ഞാൻ അറിയുന്നില്ല; നീ അദൃശ്യകാര്യങ്ങൾ അറിയുന്നവനാണ്.",
     "O Allah, I seek Your guidance by Your knowledge, and I seek ability by Your power, and I ask You of Your great bounty. You are able and I am not; You know and I do not; and You are the Knower of the unseen."),
   L1("اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثُمَّ بَارِكْ لِي فِيهِ",
     "Allaahumma in kunta ta\u2019lamu anna haadhal-amra khayrun lee fee deenee wa ma\u2019aashee wa aaqibati amree, fa-qdurhu lee wa yassirhu lee thumma baarik lee feeh",
     "അല്ലാഹുവേ, ഈ കാര്യം എന്റെ മതത്തിലും ജീവിതത്തിലും കാര്യങ്ങളുടെ പര്യവസാനത്തിലും എനിക്ക് നല്ലതാണെന്ന് നീ അറിയുന്നുവെങ്കിൽ, അത് എനിക്ക് വിധിക്കേണമേ, എളുപ്പമാക്കിത്തരേണമേ, അതിൽ എനിക്ക് അനുഗ്രഹം ചൊരിയേണമേ.",
     "O Allah, if You know that this matter is good for me in my religion, my livelihood and the outcome of my affairs, then decree it for me, make it easy for me, and bless me in it."),
   L1("وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِي بِهِ",
     "Wa in kunta ta\u2019lamu anna haadhal-amra sharrun lee fee deenee wa ma\u2019aashee wa aaqibati amree, fasrifhu annee wasrifnee anh, waqdur liyal-khayra haythu kaana thumma ardinee bih",
     "ഈ കാര്യം എന്റെ മതത്തിലും ജീവിതത്തിലും കാര്യങ്ങളുടെ പര്യവസാനത്തിലും എനിക്ക് ദോഷമാണെന്ന് നീ അറിയുന്നുവെങ്കിൽ, അതിനെ എന്നിൽ നിന്ന് അകറ്റേണമേ, എന്നെ അതിൽ നിന്നും അകറ്റേണമേ; നന്മ എവിടെയായിരുന്നാലും അത് എനിക്ക് വിധിക്കേണമേ, പിന്നെ അതിൽ എന്നെ തൃപ്തനാക്കേണമേ.",
     "And if You know that this matter is bad for me in my religion, my livelihood and the outcome of my affairs, then turn it away from me and turn me away from it, and decree for me the good wherever it may be, and make me content with it.")],
  nt:TL3("After the salam, praise Allah and send blessings on the Prophet, then say this dua. When you say \u201cthis matter\u201d, mention your need by name.","സലാമിന് ശേഷം അല്ലാഹുവിനെ സ്തുതിക്കുകയും നബിയുടെ മേൽ സ്വലാത്ത് ചൊല്ലുകയും ചെയ്ത ശേഷം ഈ ദുആ ചൊല്ലുക. \u201cഈ കാര്യം\u201d എന്ന് പറയുമ്പോൾ നിങ്ങളുടെ ആവശ്യം പേര് പറഞ്ഞ് സൂചിപ്പിക്കുക.","بعد السلام احمد الله وصلِّ على النبي ثم قل هذا الدعاء. وعند قولك «هذا الأمر» سمِّ حاجتك.")}),

c3_hj1:XM(TL3("What is Salat al-Hajah?","എന്താണ് ഹാജത്ത് നമസ്കാരം?","ما هي صلاة الحاجة؟"),{pose:"info",
  b:TL3("Salat al-Hajah is a voluntary two-rak\u2019ah prayer when you need something from Allah, followed by dua. The report about its exact wording has a weak chain, but many scholars allow it as a voluntary prayer and dua. Make your wudu well first.",
        "ഹാജത്ത് നമസ്കാരം, അല്ലാഹുവിനോട് ഒരു ആവശ്യം ഉണ്ടാകുമ്പോൾ നമസ്കരിക്കുന്ന രണ്ട് റക്അത്ത് ഐച്ഛിക നമസ്കാരവും തുടർന്നുള്ള ദുആയുമാണ്. ഇതിന്റെ വാചകത്തെക്കുറിച്ചുള്ള റിപ്പോർട്ടിന്റെ പരമ്പര ദുർബലമാണെങ്കിലും പല പണ്ഡിതരും ഇത് ഐച്ഛിക നമസ്കാരമായും ദുആയായും അനുവദിക്കുന്നു. ആദ്യം വുദൂഅ് നന്നായി ചെയ്യുക.",
        "صلاة الحاجة ركعتان نافلة تُصلّى عند الحاجة إلى شيء من الله، يتبعها دعاء. والحديث الوارد في صيغتها ضعيف الإسناد، لكن كثيرًا من العلماء يجيزها نافلةً ودعاءً. أحسن وضوءك أولًا.")}),
c3_hj2:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ الْحَاجَةِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee sunnatal-haajati rak\u2019ataini mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ഹാജത്തിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Hajah sunnah, facing the Qibla, for the sake of Allah.")]}),
c3_hj3:XM(TL3("The dua","ദുആ","الدعاء"),{pose:"sit",
  lines:[L1("لَا إِلَهَ إِلَّا اللَّهُ الْحَلِيمُ الْكَرِيمُ، سُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ الْعَظِيمِ، الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، أَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ وَعَزَائِمَ مَغْفِرَتِكَ، وَالْغَنِيمَةَ مِنْ كُلِّ بِرٍّ، وَالسَّلَامَةَ مِنْ كُلِّ إِثْمٍ، لَا تَدَعْ لِي ذَنْبًا إِلَّا غَفَرْتَهُ، وَلَا هَمًّا إِلَّا فَرَّجْتَهُ، وَلَا حَاجَةً هِيَ لَكَ رِضًا إِلَّا قَضَيْتَهَا يَا أَرْحَمَ الرَّاحِمِينَ",
     "Laa ilaaha illallaahul-haleemul-kareem, subhaanallaahi rabbil-arshil-azeem, alhamdu lillaahi rabbil-aalameen, as\u2019aluka moojibaati rahmatika wa azaa\u2019ima maghfiratik, wal-ghaneemata min kulli birr, was-salaamata min kulli ithm, laa tada\u2019 lee dhanban illaa ghafartah, wa laa hamman illaa farrajtah, wa laa haajatan hiya laka ridan illaa qadaytahaa yaa arhamar-raahimeen",
     "അല്ലാഹുവല്ലാതെ ആരാധനയ്ക്ക് അർഹനില്ല, അവൻ സഹനശീലനും ഉദാരനുമാണ്. മഹത്തായ സിംഹാസനത്തിന്റെ രക്ഷിതാവായ അല്ലാഹു പരിശുദ്ധൻ. ലോകരുടെ രക്ഷിതാവായ അല്ലാഹുവിന് സർവസ്തുതിയും. നിന്റെ കാരുണ്യം ഉറപ്പാക്കുന്നതും നിന്റെ പാപമോചനം ഉറപ്പിക്കുന്നതും ഞാൻ നിന്നോട് ചോദിക്കുന്നു; എല്ലാ നന്മയിലും നിന്ന് ഒരു ഓഹരിയും എല്ലാ പാപത്തിൽ നിന്നും സുരക്ഷയും. എന്റെ ഒരു പാപവും പൊറുക്കാതെ വിടരുതേ, ഒരു ദുഃഖവും നീക്കാതെ വിടരുതേ, നിനക്ക് തൃപ്തികരമായ ഒരാവശ്യവും നിറവേറ്റാതെ വിടരുതേ, കരുണാവാന്മാരിൽ ഏറ്റവും കരുണയുള്ളവനേ.",
     "There is no god but Allah, the Forbearing, the Generous. Glory be to Allah, Lord of the Mighty Throne. All praise is for Allah, Lord of the worlds. I ask You for what brings Your mercy and ensures Your forgiveness, for a share of every good and safety from every sin. Leave no sin of mine unforgiven, no worry unrelieved, and no need that pleases You unfulfilled, O Most Merciful of the merciful.")],
  nt:TL3("Then ask for your need in your own words.","പിന്നെ നിങ്ങളുടെ ആവശ്യം സ്വന്തം വാക്കുകളിൽ ചോദിക്കുക.","ثم اسأل حاجتك بكلماتك.")}),
/* ---- Salat al-Tawbah ---- */
c3_tb1:XM(TL3("Repentance","പശ്ചാത്താപം","التوبة"),{pose:"info",
  b:TL3("Abu Bakr (may Allah be pleased with him) reported that a person who sins, makes wudu well, prays two rak\u2019ahs and asks Allah\u2019s forgiveness is forgiven. True repentance has conditions: stop the sin, feel regret, resolve not to return to it, and give back anyone\u2019s rights if it involved them.",
        "ഒരാൾ പാപം ചെയ്ത ശേഷം നല്ല രീതിയിൽ വുദൂഅ് ചെയ്ത്, രണ്ട് റക്അത്ത് നമസ്കരിച്ച്, അല്ലാഹുവോട് പാപമോചനം തേടിയാൽ അല്ലാഹു അവന് പൊറുത്തുകൊടുക്കും എന്ന് അബൂബക്ർ (റ) റിപ്പോർട്ട് ചെയ്തിട്ടുണ്ട്. യഥാർഥ തൗബക്ക് നിബന്ധനകളുണ്ട്: പാപം ഉപേക്ഷിക്കുക, ഖേദിക്കുക, മടങ്ങിപ്പോകില്ലെന്ന് ഉറപ്പിക്കുക, മറ്റൊരാളുടെ അവകാശം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിൽ അത് മടക്കി നൽകുക.",
        "روى أبو بكر رضي الله عنه أن من أذنب ذنبًا ثم توضأ فأحسن الوضوء ثم صلى ركعتين ثم استغفر الله غفر الله له. وللتوبة الصادقة شروط: الإقلاع عن الذنب، والندم، والعزم على عدم العودة، ورد الحقوق إلى أصحابها إن كان فيه حق لآدمي.")}),
c3_tb2:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ التَّوْبَةِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee sunnatat-tawbati rak\u2019ataini mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, തൗബയുടെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the Tawbah sunnah, facing the Qibla, for the sake of Allah.")]}),
c3_tb3:XM(TL3("Seeking forgiveness","പാപമോചനം തേടൽ","الاستغفار"),{pose:"sit",
  lines:[L1("اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",
     "Allaahumma anta rabbee laa ilaaha illaa anta, khalaqtanee wa ana abduka, wa ana alaa ahdika wa wa\u2019dika mastata\u2019t, a\u2019oodhu bika min sharri maa sana\u2019t, aboo\u2019u laka bini\u2019matika alayya, wa aboo\u2019u laka bidhanbee faghfir lee fa-innahu laa yaghfirudh-dhunooba illaa ant",
     "അല്ലാഹുവേ, നീയാണ് എന്റെ രക്ഷിതാവ്; നീയല്ലാതെ ആരാധനയ്ക്ക് അർഹനില്ല. നീ എന്നെ സൃഷ്ടിച്ചു, ഞാൻ നിന്റെ ദാസനാണ്; എനിക്ക് കഴിയുന്നത്ര നിന്റെ കരാറിലും വാഗ്ദാനത്തിലും ഞാൻ നിലകൊള്ളുന്നു. ഞാൻ ചെയ്തതിന്റെ തിന്മയിൽ നിന്ന് ഞാൻ നിന്നോട് ശരണം തേടുന്നു. എന്റെ മേലുള്ള നിന്റെ അനുഗ്രഹം ഞാൻ സമ്മതിക്കുന്നു, എന്റെ പാപവും ഞാൻ സമ്മതിക്കുന്നു; അതിനാൽ എനിക്ക് പൊറുത്തുതരേണമേ; നീയല്ലാതെ പാപങ്ങൾ പൊറുക്കുന്നവനില്ല.",
     "O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You."),
   L1("أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيَّ الْقَيُّومَ وَأَتُوبُ إِلَيْهِ",
     "Astaghfirullaahal-azeemal-ladhee laa ilaaha illaa huwal-hayyal-qayyoomu wa atoobu ilayh",
     "ഏകനായ അല്ലാഹുവോട്\u2014അവനല്ലാതെ ആരാധനയ്ക്ക് അർഹനില്ല, എന്നും ജീവിക്കുന്നവനും എല്ലാറ്റിനെയും നിലനിർത്തുന്നവനുമായ മഹാനായ അല്ലാഹുവോട്\u2014ഞാൻ പാപമോചനം തേടുന്നു, അവനിലേക്ക് പശ്ചാത്തപിച്ച് മടങ്ങുന്നു.",
     "I seek forgiveness from Allah the Mighty, besides whom there is no god, the Ever-Living, the Sustainer, and I turn to Him in repentance.")]}),
/* ---- Sujud al-Shukr ---- */
c3_sh1:XM(TL3("Gratitude to Allah","അല്ലാഹുവോടുള്ള നന്ദി","شكر الله"),{pose:"info",
  b:TL3("When Allah gives you good news or removes a hardship, it is sunnah to prostrate in thanks. Face the Qibla if you can, prostrate once and thank Allah. No set words, takbir or salam are reported for it.",
        "അല്ലാഹു നിങ്ങൾക്ക് സന്തോഷവാർത്ത നൽകുമ്പോഴോ ഒരു പ്രയാസം നീക്കുമ്പോഴോ നന്ദിസൂചകമായി സുജൂദ് ചെയ്യുന്നത് സുന്നത്താണ്. വുദൂഇൽ ഖിബ്ലക്ക് അഭിമുഖമായി \u201cഅല്ലാഹു അക്ബർ\u201d പറഞ്ഞ് ഒരു സുജൂദ് ചെയ്യുക, തക്ബീറോടെ ഉയർന്ന് സലാം വീട്ടുക. താൽപര്യമുണ്ടെങ്കിൽ നന്ദിയുടെ രണ്ട് റക്അത്തും നമസ്കരിക്കാം.",
        "إذا رزقك الله خبرًا سارًّا أو كشف عنك كربًا فيُسنّ سجود الشكر. كن على طهارة، واستقبل القبلة، وكبّر، واسجد سجدة واحدة، ثم ارفع مكبّرًا وسلّم. ولك أن تصلي ركعتين شكرًا إن شئت.")}),
c3_sh2:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أَسْجُدُ لِلَّهِ سُجُودَ الشُّكْرِ","Asjudu lillaahi sujoodash-shukr","അല്ലാഹുവിനു വേണ്ടി നന്ദിയുടെ സുജൂദ് ഞാൻ ചെയ്യുന്നു.","I prostrate to Allah in gratitude.")]}),
c3_sh3:XM(TL3("The prostration","സുജൂദ്","السجدة"),{pose:"sujood",
  lines:BASE.sujud.lines.concat([L1("الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ","Alhamdu lillaahil-ladhee bini\u2019matihi tatimmus-saalihaat","ഏതൊരുവന്റെ അനുഗ്രഹത്താൽ സൽകർമങ്ങൾ പൂർത്തിയാകുന്നുവോ ആ അല്ലാഹുവിന് സ്തുതി.","Praise be to Allah, by whose favour good deeds are completed.")]),
  nt:TL3("Go down in prostration and praise Allah, then rise.","താഴുമ്പോഴും ഉയരുമ്പോഴും \u201cഅല്ലാഹു അക്ബർ\u201d പറയുക, പിന്നെ സലാം വീട്ടുക.","كبّر عند الهبوط وعند الرفع، ثم سلّم.")}),
/* ---- Tahiyyat al-Masjid ---- */
c3_tm1:XM(TL3("Entering the mosque","പള്ളിയിൽ പ്രവേശിക്കുമ്പോൾ","دخول المسجد"),{pose:"info",
  lines:[L1("بِسْمِ اللَّهِ وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","Bismillaah, was-salaatu was-salaamu alaa rasoolillaah, allaahummaf-tah lee abwaaba rahmatik","അല്ലാഹുവിന്റെ നാമത്തിൽ; അല്ലാഹുവിന്റെ ദൂതരുടെ മേൽ സ്വലാത്തും സലാമും ഉണ്ടാകട്ടെ. അല്ലാഹുവേ, നിന്റെ കാരുണ്യത്തിന്റെ വാതിലുകൾ എനിക്ക് തുറന്നുതരേണമേ.","In the name of Allah, and blessings and peace be upon the Messenger of Allah. O Allah, open the doors of Your mercy for me.")],
  b:TL3("Enter with your right foot and say the dua below. Before you sit, pray two rak\u2019ahs. It is a confirmed sunnah, and any obligatory or sunnah prayer you pray on entering also counts for it. If you enter while the imam is giving the Friday khutbah, pray two short rak\u2019ahs, then listen.",
        "വലതു കാൽ വെച്ച് പ്രവേശിച്ച് താഴെയുള്ള ദുആ ചൊല്ലുക. ഇരിക്കുന്നതിന് മുമ്പ് രണ്ട് റക്അത്ത് നമസ്കരിക്കുക. ഇത് ശക്തമായ സുന്നത്താണ്; പ്രവേശിച്ച ഉടൻ നമസ്കരിക്കുന്ന ഏതൊരു ഫർളോ സുന്നത്തോ ഇതിനും മതിയാകും. ഇമാം വെള്ളിയാഴ്ച ഖുത്ബ നടത്തുമ്പോഴാണ് പ്രവേശിക്കുന്നതെങ്കിൽ രണ്ട് ചെറിയ റക്അത്ത് നമസ്കരിച്ച ശേഷം ശ്രദ്ധിച്ച് കേൾക്കുക.",
        "ادخل برجلك اليمنى وقل الدعاء الآتي. وقبل أن تجلس صلِّ ركعتين، وهي سنة مؤكدة، وتُجزئ عنها أي فريضة أو سنة تصليها عند الدخول. وإن دخلت والإمام يخطب الجمعة فصلِّ ركعتين خفيفتين ثم أنصت.")}),
c3_tm2:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ تَحِيَّةِ الْمَسْجِدِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee sunnata tahiyyatil-masjidi rak\u2019ataini mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, പള്ളിയിലെ തഹിയ്യത്തിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the two rak\u2019ahs of the greeting of the mosque, facing the Qibla, for the sake of Allah.")]}),
/* ---- Sunnah of wudu ---- */
c3_tu1:XM(TL3("After wudu","വുദൂഇന് ശേഷം","بعد الوضوء"),{pose:"info",
  lines:[L1("أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ","Ash-hadu an laa ilaaha illallaahu wahdahu laa shareeka lah, wa ash-hadu anna muhammadan abduhu wa rasooluh, allaahummaj-alnee minat-tawwaabeena waj-alnee minal-mutatahhireen","അല്ലാഹുവല്ലാതെ ആരാധനയ്ക്ക് അർഹനില്ലെന്നും, അവൻ ഏകനും പങ്കുകാരില്ലാത്തവനുമാണെന്നും, മുഹമ്മദ് നബി അവന്റെ ദാസനും ദൂതനുമാണെന്നും ഞാൻ സാക്ഷ്യം വഹിക്കുന്നു. അല്ലാഹുവേ, എന്നെ പശ്ചാത്തപിക്കുന്നവരിലും ശുദ്ധി പാലിക്കുന്നവരിലും ഉൾപ്പെടുത്തേണമേ.","I bear witness that there is no god but Allah alone, without partner, and that Muhammad is His servant and messenger. O Allah, make me among those who repent and among those who purify themselves.")],
  b:TL3("After finishing wudu, say the dua below and pray two rak\u2019ahs. Bilal (may Allah be pleased with him) prayed two rak\u2019ahs after every wudu, and the Prophet \uFDFA gave him glad tidings for it.",
        "വുദൂഅ് കഴിഞ്ഞ്, വെള്ളം ഉണങ്ങുന്നതിന് മുമ്പ്, താഴെയുള്ള ദുആ ചൊല്ലി രണ്ട് റക്അത്ത് നമസ്കരിക്കുക. ബിലാൽ (റ) ഓരോ വുദൂഇന് ശേഷവും രണ്ട് റക്അത്ത് നമസ്കരിക്കാറുണ്ടായിരുന്നു; അതിന്റെ പേരിൽ നബി ﷺ അദ്ദേഹത്തിന് സുവിശേഷം നൽകി.",
        "بعد الفراغ من الوضوء وقبل أن يجف الماء قل الدعاء الآتي وصلِّ ركعتين. كان بلال رضي الله عنه يصلي ركعتين بعد كل وضوء، وبشّره النبي ﷺ بذلك.")}),
c3_tu2:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ الْوُضُوءِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee sunnatal-wudoo\u2019i rak\u2019ataini mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, വുദൂഇന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the two rak\u2019ahs of the sunnah of wudu, facing the Qibla, for the sake of Allah.")]}),
/* ---- Eclipse (Kusuf) ---- */
c3_ks1:XM(TL3("When the sun or moon is eclipsed","സൂര്യനോ ചന്ദ്രനോ ഗ്രഹണം ബാധിക്കുമ്പോൾ","عند كسوف الشمس أو خسوف القمر"),{pose:"info",
  b:TL3("Pray two rak\u2019ahs, ideally in congregation, until the eclipse clears. There is no adhan or iqamah; the call is \u201cAs-salaatu jaami\u2019ah\u201d. While it lasts, make dua, give charity, remember Allah and seek His forgiveness.\n\nEach rak\u2019ah has two standings and two bowings, with a long recitation, bowing and prostration.",
        "ഗ്രഹണം തെളിയുന്നതുവരെ, കഴിയുമെങ്കിൽ ജമാഅത്തായി, രണ്ട് റക്അത്ത് നമസ്കരിക്കുക. ബാങ്കും ഇഖാമത്തും ഇല്ല; \u201cഅസ്സ്വലാത്തു ജാമിഅ\u201d എന്ന് വിളിക്കും. അത് നീണ്ടുനിൽക്കുമ്പോൾ ദുആ ചെയ്യുക, ദാനം ചെയ്യുക, അല്ലാഹുവിനെ ഓർക്കുക, പാപമോചനം തേടുക.\n\nഓരോ റക്അത്തിലും രണ്ട് നിൽപ്പും രണ്ട് റുകൂഉം ഉണ്ട്; ദീർഘമായ പാരായണവും റുകൂഉം സുജൂദുമാണ്.",
        "صلِّ ركعتين، والأفضل جماعة، حتى ينجلي الكسوف. ولا أذان ولا إقامة، ويُنادى: «الصلاة جامعة». وأثناءه ادعُ وتصدّق واذكر الله واستغفره.\n\nفي كل ركعة قيامان وركوعان، مع إطالة القراءة والركوع والسجود.")}),
c3_ks2:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ كُسُوفِ الشَّمْسِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee sunnata kusoofish-shamsi rak\u2019ataini mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, സൂര്യഗ്രഹണത്തിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray two rak\u2019ahs of the sunnah of the solar eclipse, facing the Qibla, for the sake of Allah."),
         L1("أُصَلِّي سُنَّةَ خُسُوفِ الْقَمَرِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee sunnata khusoofil-qamari rak\u2019ataini mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ചന്ദ്രഗ്രഹണത്തിന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","The same for the lunar eclipse.")],
  nt:TL3("Use the first line for the sun and the second for the moon.","സൂര്യന് ആദ്യ വരിയും ചന്ദ്രന് രണ്ടാമത്തേതും ഉപയോഗിക്കുക.","الأول للشمس والثاني للقمر.")}),
c3_ks3:XM(TL3("A long surah","ദീർഘമായ സൂറത്ത്","سورة طويلة"),{pose:"info",
  b:TL3("After Al-Fatiha, recite a long surah, about the length of Surah Al-Baqarah. Then bow for a long time, saying the tasbih many times.",
        "ഫാതിഹക്ക് ശേഷം സൂറത്തുൽ ബഖറയുടെ നീളമുള്ള ഒരു ദീർഘ സൂറത്ത് ഓതുക. പിന്നെ തസ്ബീഹ് ധാരാളം ചൊല്ലി ദീർഘമായി റുകൂഅ് ചെയ്യുക.",
        "بعد الفاتحة اقرأ سورة طويلة بقدر سورة البقرة. ثم اركع ركوعًا طويلًا مكثرًا من التسبيح.")}),
c3_ks4:XM(TL3("Stand again","വീണ്ടും നിൽക്കുക","القيام الثاني"),{pose:"info",
  b:TL3("After rising from the first bowing, do not prostrate yet. Recite Al-Fatiha again and a shorter surah.",
        "ആദ്യ റുകൂഇൽ നിന്ന് ഉയർന്ന ശേഷം ഇപ്പോൾ സുജൂദ് ചെയ്യരുത്. വീണ്ടും ഫാതിഹ ഓതി, ഏകദേശം 200 ആയത്തുകളുടെ നീളമുള്ള ചെറിയ ഒരു സൂറത്ത് ഓതുക.",
        "بعد الرفع من الركوع الأول لا تسجد بعد. اقرأ الفاتحة مرة أخرى وسورة أقصر بنحو مئتي آية.")}),
c3_ks5:XM(TL3("Second bowing","രണ്ടാം റുകൂഅ്","الركوع الثاني"),{pose:"ruku",
  lines:BASE.ruku.lines,
  nt:TL3("Bow for a shorter time than the first bowing. After rising, go down to prostrate, and make the prostration long, about as long as the bowing.","ആദ്യ റുകൂഇനേക്കാൾ കുറഞ്ഞ സമയം റുകൂഅ് ചെയ്യുക. ഉയർന്ന ശേഷം സുജൂദിലേക്ക് പോകുക; സുജൂദ് റുകൂഇന്റെ അത്രയും ദീർഘമാക്കുക.","اركع أقصر من الركوع الأول. وبعد الرفع اهوِ إلى السجود وأطِل فيه بقدر الركوع.")}),
c3_ks6:XM(TL3("The second rak\u2019ah","രണ്ടാം റക്അത്ത്","الركعة الثانية"),{pose:"info",
  b:TL3("Repeat the same, a little shorter: after Al-Fatiha recite a surah and bow, rise, then recite Al-Fatiha and a shorter surah, bow again, rise and prostrate twice.",
        "അതേപോലെ അൽപം ചെറുതായി ആവർത്തിക്കുക: ഫാതിഹക്ക് ശേഷം ഏകദേശം 150 ആയത്തുള്ള സൂറത്ത് ഓതി റുകൂഅ് ചെയ്യുക, ഉയരുക, പിന്നെ ഫാതിഹയും ഏകദേശം 100 ആയത്തുള്ള സൂറത്തും ഓതി വീണ്ടും റുകൂഅ് ചെയ്യുക, ഉയർന്ന് രണ്ട് സുജൂദ് ചെയ്യുക.",
        "كرّر مثل ذلك أخفّ قليلًا: بعد الفاتحة اقرأ سورة بنحو مئة وخمسين آية واركع، ثم ارفع، ثم اقرأ الفاتحة وسورة بنحو مئة آية واركع ثانية، ثم ارفع واسجد سجدتين.")}),
c3_ks7:XM(TL3("The khutbah","ഖുത്ബ","الخطبة"),{pose:"info",
  b:TL3("After the prayer the imam gives two sermons, reminding people to repent, give charity and remember Allah. Listen and make dua until the eclipse has ended.",
        "നമസ്കാരത്തിന് ശേഷം ഇമാം രണ്ട് ഖുത്ബകൾ നടത്തും; പശ്ചാത്തപിക്കാനും ദാനം ചെയ്യാനും അല്ലാഹുവിനെ ഓർക്കാനും ഓർമിപ്പിക്കും. ഗ്രഹണം അവസാനിക്കുന്നതുവരെ ശ്രദ്ധിച്ച് കേൾക്കുകയും ദുആ ചെയ്യുകയും ചെയ്യുക.",
        "بعد الصلاة يخطب الإمام خطبتين يذكّر فيهما بالتوبة والصدقة وذكر الله. أنصت وادعُ حتى ينتهي الكسوف.")}),
/* ---- Rain prayer (Istisqa) ---- */
c3_is1:XM(TL3("Asking Allah for rain","മഴക്കായി അല്ലാഹുവോട് ചോദിക്കൽ","طلب السقيا"),{pose:"info",
  b:TL3("Istisqa is prayed when rain is needed. The imam calls people to repent and give charity. Then they go out to open ground humbly, in plain clothes. A simple dua for rain, even without the prayer, is also sunnah.",
        "മഴ ആവശ്യമായി വരുമ്പോഴാണ് ഇസ്തിസ്ഖാഅ് നമസ്കരിക്കുന്നത്. പശ്ചാത്തപിക്കാനും ദാനം ചെയ്യാനും മൂന്ന് ദിവസം നോമ്പെടുക്കാനും ഇമാം ജനങ്ങളെ ആഹ്വാനം ചെയ്യും. പിന്നെ അവർ വിനയത്തോടെ, ലളിതമായ വസ്ത്രം ധരിച്ച്, കുട്ടികളോടും വൃദ്ധരോടും ഒപ്പം തുറന്ന സ്ഥലത്തേക്ക് പോകും. നമസ്കാരമില്ലാതെ മഴക്കായി ലളിതമായ ദുആ ചെയ്യുന്നതും സുന്നത്താണ്.",
        "تُصلّى الاستسقاء عند الحاجة إلى المطر. ويدعو الإمام الناس إلى التوبة والصدقة وصيام ثلاثة أيام. ثم يخرجون إلى الصحراء متواضعين في ثياب بذلة ومعهم الصبيان والشيوخ. ويُسنّ أيضًا الدعاء بالسقيا دون صلاة.")}),
c3_is2:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي سُنَّةَ الِاسْتِسْقَاءِ رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ مَأْمُومًا لِلَّهِ تَعَالَى","Usallee sunnatal-istisqaa\u2019i rak\u2019ataini mustaqbilal-qiblati ma\u2019moomam lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, ഇമാമിനെ പിൻപറ്റി, അല്ലാഹുവിനു വേണ്ടി, ഇസ്തിസ്ഖാഇന്റെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the two rak\u2019ahs of the rain prayer behind the imam, facing the Qibla, for the sake of Allah.")],
  nt:TL3("It is prayed like the Eid prayer, with seven extra takbirs in the first rak\u2019ah and five in the second.","ഇത് ഈദ് നമസ്കാരം പോലെയാണ്: ഒന്നാം റക്അത്തിൽ ഏഴും രണ്ടാമത്തേതിൽ അഞ്ചും അധിക തക്ബീറുകൾ.","تُصلّى كصلاة العيد، بسبع تكبيرات زائدة في الأولى وخمس في الثانية.")}),
c3_is3:XM(TL3("The khutbah and dua","ഖുത്ബയും ദുആയും","الخطبة والدعاء"),{pose:"sit",
  lines:[L1("اللَّهُمَّ اسْقِنَا غَيْثًا مُغِيثًا هَنِيئًا مَرِيئًا مَرِيعًا غَدَقًا عَاجِلًا غَيْرَ آجِلٍ","Allaahummas-qinaa ghaythan mugheethan haneee\u2019an mareee\u2019an maree\u2019an ghadaqan aajilan ghayra aajil","അല്ലാഹുവേ, ഞങ്ങൾക്ക് ആശ്വാസം നൽകുന്ന, സുഖപ്രദവും പോഷകസമൃദ്ധവുമായ, സമൃദ്ധമായ, വൈകാതെ ഉടനെ ലഭിക്കുന്ന മഴ നൽകേണമേ.","O Allah, give us rain that relieves, wholesome and fertile, abundant, soon and not delayed."),
         L1("أَسْتَغْفِرُ اللَّهَ","Astaghfirullaah","ഞാൻ അല്ലാഹുവോട് പാപമോചനം തേടുന്നു.","I seek Allah\u2019s forgiveness.")],
  b:TL3("After the prayer the imam gives two sermons. He raises his hands in dua and turns his cloak over. Everyone makes dua with him.",
        "നമസ്കാരത്തിന് ശേഷം ഇമാം രണ്ട് ഖുത്ബകൾ നടത്തും; ഒന്നാമത്തേത് ഒമ്പത് തവണയും രണ്ടാമത്തേത് ഏഴ് തവണയും ഇസ്തിഗ്ഫാർ കൊണ്ട് തുടങ്ങും. അദ്ദേഹം കൈകൾ ഉയർത്തി ദുആ ചെയ്യുകയും മേലങ്കി മറിച്ചിടുകയും ചെയ്യും. എല്ലാവരും അദ്ദേഹത്തോടൊപ്പം ദുആ ചെയ്യും.",

    sum:{when:TL3("When you forget or doubt something in prayer","നമസ്കാരത്തിൽ മറക്കുകയോ സംശയിക്കുകയോ ചെയ്യുമ്പോൾ","عند السهو أو الشك في الصلاة"),rak:TL3("Two prostrations before the salam","സലാമിന് മുമ്പ് രണ്ട് സുജൂദ്","سجدتان قبل السلام"),rule:TL3("Sunnah","സുന്നത്ത്","سنة")},

});
Object.assign(XC,{
c5_g1:XM(TL3("When it is required","എപ്പോൾ നിർബന്ധം","متى يجب"),{pose:"info",
  b:TL3("Ghusl is obligatory after sexual intercourse or emission, at the end of menstruation, and after postnatal bleeding. Ghusl on Fridays and Eids is sunnah.","ലൈംഗികബന്ധത്തിനോ സ്ഖലനത്തിനോ ശേഷവും, ആർത്തവം അവസാനിച്ചാലും, പ്രസവരക്തം നിലച്ചാലും കുളി നിർബന്ധമാണ്. വെള്ളിയാഴ്ചയും ഈദിനും കുളിക്കുന്നത് സുന്നത്താണ്.","يجب الغسل بعد الجماع أو خروج المني، وعند انقطاع الحيض، وبعد انقطاع دم النفاس. ويُسنّ الغسل للجمعة والعيدين.")}),
c5_g2:XM(TL3("How to do it","എങ്ങനെ ചെയ്യണം","كيفيته"),{pose:"info",
  b:TL3("Intend in your heart, wash away any impurity and make wudu. Pour water over your head three times, then over the right side, then the left, so water reaches the whole body including the hair roots. The intention and washing the whole body are obligatory.","ഹൃദയത്തിൽ നിയ്യത്ത് ചെയ്യുക; അശുദ്ധി ഉണ്ടെങ്കിൽ കഴുകി വുദൂഅ് എടുക്കുക. തലയിൽ മൂന്നു തവണ വെള്ളമൊഴിക്കുക, പിന്നെ വലതുഭാഗത്തും ഇടതുഭാഗത്തും. മുടിയുടെ വേരുകൾ ഉൾപ്പെടെ ശരീരം മുഴുവൻ വെള്ളം എത്തണം. നിയ്യത്തും ശരീരം മുഴുവൻ കഴുകലും നിർബന്ധമാണ്.","انوِ بقلبك، وأزل النجاسة وتوضأ. اسكب الماء على رأسك ثلاثًا، ثم على شقك الأيمن ثم الأيسر، حتى يعم الماء جميع البدن مع أصول الشعر. والنية وتعميم البدن بالماء فرضان.")}),
c5_t1:XM(TL3("When it is allowed","എപ്പോൾ അനുവദനീയം","متى يجوز"),{pose:"info",
  b:TL3("Use tayammum when there is no water after searching, or when using water would harm you, such as in illness. The prayer time must have started.","തിരഞ്ഞിട്ടും വെള്ളം കിട്ടാത്തപ്പോൾ, അല്ലെങ്കിൽ രോഗം പോലെ വെള്ളം ഉപയോഗിക്കുന്നത് ഹാനികരമാകുമ്പോൾ തയമ്മും ചെയ്യാം. നമസ്കാരസമയം ആരംഭിച്ചിരിക്കണം.","يجوز التيمم عند عدم وجود الماء بعد طلبه، أو عند الضرر باستعماله كالمرض. ويشترط دخول وقت الصلاة.")}),
c5_t2:XM(TL3("How to do it","എങ്ങനെ ചെയ്യണം","كيفيته"),{pose:"info",
  b:TL3("Intend in your heart and say Bismillah. Strike clean dust or earth with both palms and wipe your whole face. Strike again and wipe both arms up to the elbows. Make a new tayammum for each obligatory prayer.","ഹൃദയത്തിൽ നിയ്യത്ത് ചെയ്ത് ബിസ്മില്ലാഹ് ചൊല്ലുക. ശുദ്ധമായ മണ്ണിൽ രണ്ട് കൈപ്പത്തിയും അടിച്ച് മുഖം മുഴുവൻ തടവുക. വീണ്ടും അടിച്ച് കൈമുട്ട് വരെ രണ്ട് കൈകളും തടവുക. ഓരോ ഫർള് നമസ്കാരത്തിനും പുതിയ തയമ്മും വേണം.","انوِ بقلبك وسمِّ الله، واضرب بكفيك على تراب طاهر وامسح وجهك كله، ثم اضرب ضربة ثانية وامسح يديك إلى المرفقين. ولكل فريضة تيمم جديد.")}),
c5_m1:XM(TL3("Conditions and time","നിബന്ധനകളും സമയവും","الشروط والمدة"),{pose:"info",
  b:TL3("You may wipe over leather socks or thick socks worn after complete wudu that cover the ankles and are strong enough to walk in. The time is one day and night, or three days and nights when travelling, from your first wudu-break after putting them on.","പൂർണ വുദൂഇന് ശേഷം ധരിച്ച, കണങ്കാൽ മൂടുന്ന, നടക്കാൻ കരുത്തുള്ള തുകൽ മോസുകളുടെയോ കട്ടിയുള്ള സോക്സുകളുടെയോ മുകളിൽ തടവാം. ധരിച്ച ശേഷം ആദ്യം വുദൂഅ് മുറിഞ്ഞതു മുതൽ നാട്ടിൽ ഒരു രാപ്പകലും യാത്രയിൽ മൂന്ന് രാപ്പകലുമാണ് സമയം.","يجوز المسح على الخفين أو الجوربين الثخينين إذا لُبسا بعد وضوء كامل، وسترا الكعبين، وأمكن المشي فيهما. ومدته يوم وليلة للمقيم وثلاثة أيام بلياليها للمسافر، من أول حدث بعد اللبس.")}),
c5_m2:XM(TL3("How to wipe","എങ്ങനെ തടവണം","كيفية المسح"),{pose:"info",
  b:TL3("Wipe the top of each sock with wet fingers, right then left; a little is enough. The permission ends when you take them off, the time runs out, or ghusl becomes obligatory. Then wash your feet.","നനഞ്ഞ വിരലുകൾ കൊണ്ട് ഓരോ സോക്സിന്റെയും മുകൾഭാഗം തടവുക, വലതു കാൽ ആദ്യം; അല്പം തടവിയാൽ മതി. അവ ഊരിയാൽ, സമയം തീർന്നാൽ, അല്ലെങ്കിൽ കുളി നിർബന്ധമായാൽ ഈ അനുവാദം അവസാനിക്കും; പിന്നെ പാദങ്ങൾ കഴുകണം.","امسح أعلى كل خف بأصابع مبلولة، اليمنى ثم اليسرى، ويكفي أقل المسح. وينتهي المسح بخلع الخفين أو انقضاء المدة أو وجوب الغسل، فحينئذ تغسل قدميك.")}),
c5_b1:XM(TL3("What breaks wudu","വുദൂഅ് മുറിക്കുന്നത്","نواقض الوضوء"),{pose:"info",
  b:TL3("Anything leaving the front or back passage, sleep when not seated firmly, loss of mind, touching your private part with the inside of the hand, and skin touching skin with a non-mahram of the opposite sex.","മുൻഭാഗത്തോ പിൻഭാഗത്തോ കൂടി എന്തെങ്കിലും പുറത്തുവരുക, ഇരിപ്പ് ഉറപ്പിക്കാതെയുള്ള ഉറക്കം, ബോധം നഷ്ടപ്പെടുക, ഗുഹ്യഭാഗത്ത് കൈപ്പത്തിയുടെ ഉൾഭാഗം കൊണ്ട് തൊടുക, അന്യസ്ത്രീ/അന്യപുരുഷന്റെ ചർമം ചർമത്തിൽ തൊടുക എന്നിവ വുദൂഅ് മുറിക്കും.","ينتقض الوضوء بخروج شيء من القبل أو الدبر، والنوم غير الممكّن مقعده، وزوال العقل، ومس الفرج بباطن الكف، ولمس بشرة الأجنبي من الجنس الآخر.")}),
c5_b2:XM(TL3("What breaks prayer","നമസ്കാരം മുറിക്കുന്നത്","مبطلات الصلاة"),{pose:"info",
  b:TL3("Speaking on purpose, eating or drinking, three big movements in a row, turning away from the Qibla, uncovering the awrah, breaking wudu, laughing aloud, or intending to stop.","മനഃപൂർവം സംസാരിക്കുക, തിന്നുകയോ കുടിക്കുകയോ ചെയ്യുക, തുടർച്ചയായി മൂന്ന് വലിയ ചലനങ്ങൾ, ഖിബ്ലയിൽ നിന്ന് തിരിയുക, ഔറത്ത് വെളിവാകുക, വുദൂഅ് മുറിയുക, ഉറക്കെ ചിരിക്കുക, നമസ്കാരം നിർത്താൻ കരുതുക എന്നിവ നമസ്കാരം ബാത്വിലാക്കും.","يبطل الصلاة الكلام عمدًا، والأكل والشرب، وثلاث حركات كبيرة متوالية، والانحراف عن القبلة، وانكشاف العورة، والحدث، والضحك بصوت، ونية قطعها.")}),
c5_q1:XM(TL3("Missed prayers","വിട്ടുപോയ നമസ്കാരങ്ങൾ","الصلوات الفائتة"),{pose:"info",
  b:TL3("If you sleep through a prayer or forget it, pray it as soon as you remember; there is no sin. If you missed it without an excuse, you sinned and must make it up at once with repentance.","ഉറങ്ങിപ്പോയതോ മറന്നതോ ആയ നമസ്കാരം ഓർമ വന്ന ഉടൻ നമസ്കരിക്കുക; കുറ്റമില്ല. കാരണമില്ലാതെ ഒഴിവാക്കിയെങ്കിൽ കുറ്റമുണ്ട്; പശ്ചാത്തപിച്ച് ഉടൻ ഖദാഅ് വീട്ടണം.","من نام عن صلاة أو نسيها فليصلّها إذا ذكرها ولا إثم عليه. ومن تركها بلا عذر أثم ووجب عليه قضاؤها فورًا مع التوبة.")}),
c5_q2:XM(TL3("How to make it up","എങ്ങനെ ഖദാഅ് വീട്ടണം","كيفية القضاء"),{pose:"info",
  b:TL3("Intend the specific prayer as qada, for example the missed Fajr, and pray it as usual. If you missed several, pray them in order, starting with the earliest.","നിയ്യത്തിൽ ഖദാഅ് ആണെന്ന് ഉൾപ്പെടുത്തുക, ഉദാഹരണം: വിട്ടുപോയ സുബ്ഹ്. പതിവുപോലെ നമസ്കരിക്കുക. പലതും വിട്ടുപോയെങ്കിൽ ആദ്യം വിട്ടതിൽ നിന്ന് ക്രമത്തിൽ നമസ്കരിക്കുക.","انوِ الصلاة المعيّنة قضاءً كالفجر الفائتة وصلِّها كما تصلي. وإن فاتتك صلوات فصلّها مرتبة من الأولى فالتي تليها.")}),
c5_i1:XM(TL3("When you cannot stand","നിൽക്കാൻ കഴിയാത്തപ്പോൾ","عند العجز عن القيام"),{pose:"info",
  b:TL3("Pray standing if you can. If not, pray sitting; if not, lying on your right side facing the Qibla (or on your back with feet toward it). If you cannot move, pray with your eyes, then your heart. The prayer is not dropped while your mind is present.","കഴിയുമെങ്കിൽ നിന്ന് നമസ്കരിക്കുക. കഴിയില്ലെങ്കിൽ ഇരുന്ന്; അതിനും കഴിയില്ലെങ്കിൽ ഖിബ്ലക്ക് അഭിമുഖമായി വലതുവശം ചരിഞ്ഞ് (അല്ലെങ്കിൽ മലർന്ന് കാലുകൾ ഖിബ്ലയിലേക്ക് ആക്കി). അനങ്ങാൻ കഴിയില്ലെങ്കിൽ കണ്ണുകൊണ്ട്, പിന്നെ ഹൃദയം കൊണ്ട്. ബോധമുള്ളിടത്തോളം നമസ്കാരം ഒഴിവാകില്ല.","صلِّ قائمًا فإن عجزت فقاعدًا، فإن عجزت فعلى جنبك الأيمن مستقبل القبلة أو مستلقيًا ورجلاك إليها. فإن عجزت عن الحركة فأومئ بعينيك ثم بقلبك. ولا تسقط الصلاة ما دام عقلك ثابتًا.")}),
c5_i2:XM(TL3("Bowing and prostrating","റുകൂഉം സുജൂദും","الركوع والسجود"),{pose:"info",
  b:TL3("Sitting on a chair or the floor is fine. Bow by leaning forward and prostrate by leaning further, lower than the bow. Make wudu or tayammum if you can, and pray in time.","കസേരയിലോ നിലത്തോ ഇരുന്ന് നമസ്കരിക്കാം. റുകൂഇന് മുന്നോട്ട് കുനിയുക; സുജൂദിന് അതിലും കൂടുതൽ കുനിയുക. കഴിയുമെങ്കിൽ വുദൂഅ് അല്ലെങ്കിൽ തയമ്മും ചെയ്ത് സമയത്ത് നമസ്കരിക്കുക.","يجوز الجلوس على كرسي أو على الأرض. اركع بالانحناء واسجد بانحناء أكثر منه. وتوضأ أو تيمم إن أمكن، وصلِّ في وقتها.")}),
c5_a1:XM(TL3("Adhan and iqamah","ബാങ്കും ഇഖാമത്തും","الأذان والإقامة"),{pose:"info",
  b:TL3("The adhan calls people to each obligatory prayer; the iqamah announces that it is about to begin. The Fajr adhan adds “As-salaatu khayrun minan-nawm” after the second “Hayya ‘alal-falaah”.","ഓരോ ഫർള് നമസ്കാരത്തിനും ആളുകളെ വിളിക്കുന്നതാണ് ബാങ്ക്; നമസ്കാരം ആരംഭിക്കാറായി എന്ന് അറിയിക്കുന്നതാണ് ഇഖാമത്ത്. സുബ്ഹ് ബാങ്കിൽ രണ്ടാമത്തെ “ഹയ്യ അലൽ ഫലാഹ്” ശേഷം “അസ്സ്വലാതു ഖൈറും മിനന്നൗം” കൂടി ചൊല്ലും.","الأذان دعوة إلى كل فريضة، والإقامة إعلان بقرب قيامها. ويُزاد في أذان الفجر بعد الحيعلتين الثانيتين «الصلاة خير من النوم».")}),
c5_a2:XM(TL3("Replying and the dua","മറുപടിയും ദുആയും","الإجابة والدعاء"),{pose:"info",
  lines:[L1("اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ","Allaahumma rabba haadhihid-da’watit-taammah, was-salaatil-qaa’imah, aati muhammadanil-waseelata wal-fadeelah, wab’ath-hu maqaamam mahmoodanil-ladhee wa’adtah","അല്ലാഹുവേ, ഈ പൂർണമായ വിളിയുടെയും നിലനിൽക്കുന്ന നമസ്കാരത്തിന്റെയും നാഥാ, മുഹമ്മദ് നബിക്ക് വസീലയും ഫദീലയും നൽകേണമേ; നീ വാഗ്ദാനം ചെയ്ത പ്രശംസനീയ സ്ഥാനത്ത് അദ്ദേഹത്തെ ഉയർത്തേണമേ.","O Allah, Lord of this perfect call and established prayer, grant Muhammad the wasilah and the favour, and raise him to the praised station You promised.")],

function buildSteps(p){
  const n=RAK[p],out=[],add=(k,r,x)=>out.push(Object.assign({k,r},x||{}));
  for(let r=1;r<=n;r++){
    if(r===1){add("niyyah",1);add("takbir",1);add("iftitah",1)}
    add("fatiha",r);add("ameen",r);if(r<=2)add("surah",r);
    add("ruku",r);add("itidal",r);add("sujud1",r);add("sit",r);add("sujud2",r);
    if(r===2&&n>2)add("tashahhud",r,{first:true});
    if(r===n){add("tashahhud",r);add("salawat",r);add("refuge",r);add("salam",r)}
  }
  return out;
}

function chime(){
  if(S.sound!=="chime")return;

    actx=actx||new (window.AudioContext||window.webkitAudioContext)();

    [[659.25,0],[880,.28],[1318.5,.56]].forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.value=f;

      o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+1.7);
    });
  }catch(e){}
}

let heroP=0,moonOn=false,scrollTick=false,skyLayers=null;
function onHomeScroll(){if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{scrollTick=false;heroScroll()})}
function heroScroll(){
  const sc=$("#s-today"),h=$(".hero-pin");if(!sc||!h)return;
  const st=sc.scrollTop;
  if(!skyLayers)skyLayers=[[$(".sk-stars"),.03]].concat([...document.querySelectorAll("#skybg .cl-layer")].map(e=>[e,+e.dataset.f]));
  skyLayers.forEach(([el,f])=>{if(el)el.style.transform=`translate3d(0,${(-st*f).toFixed(1)}px,0)`});   /* gentle parallax: far layers barely move */
  const p=Math.max(0,Math.min(1,st/Math.max(160,h.offsetHeight+20)));   /* 1 = the cards have reached the top of the countdown block */
  if(Math.abs(p-heroP)<.004)return;heroP=p;
  const f=Math.max(0,Math.min(1,(p-.35)/.6)),o=1-f*f*(3-2*f);                      /* mild blur first, then it fades out completely once covered */
  h.style.filter=p>.01?`blur(${(Math.min(1,p/.7)*4).toFixed(1)}px)`:"none";
  h.style.opacity=o.toFixed(3);
  h.style.transform=p>.01?`translate3d(0,${(-p*h.offsetHeight*.2).toFixed(1)}px,0) scale(${(1-p*.04).toFixed(4)})`:"none";
  h.style.pointerEvents=o<.15?"none":"";
}
/* tapping today in the month calendar: scroll up to today's prayers and light the card up so the user updates them there */
function focusPrayerCard(){
  const sc=$("#s-today"),l=$(".list");if(!sc||!l)return;
  const top=Math.max(0,sc.scrollTop+l.getBoundingClientRect().top-sc.getBoundingClientRect().top-16);
  sc.scrollTo({top,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  l.classList.remove("hl");void l.offsetWidth;l.classList.add("hl");
  toast(tx("Update today\u2019s prayers here"));

}
/* a rare shooting star, only while the moon is out and the home screen is showing */
function shootingStar(){
  const bg=$("#skybg");
  if(!bg||bg.style.display==="none"||curTab!=="today"||document.hidden||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  if(!moonOn)return;
  const el=document.createElement("i"),w=bg.clientWidth,a=16+Math.random()*20,right=Math.random()<.5;
  el.className="shoot";
  el.style.cssText=`left:${(w*(.15+Math.random()*.7)).toFixed(0)}px;top:${(36+Math.random()*190).toFixed(0)}px;width:${(40+Math.random()*40).toFixed(0)}px;--ang:${right?a:180-a}deg;--dx:${(150+Math.random()*110).toFixed(0)}px`;
  bg.appendChild(el);el.addEventListener("animationend",()=>el.remove());
}

  const t=night?"night":"day",h=document.documentElement;
  if(h.dataset.theme!==t){h.dataset.theme=t;const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=night?"#0A1022":"#EEF1F6"}
}
/* ---------- refresh + tick ---------- */
let lastSig="";

function tick(force){
  const now=Date.now(),fri=applyFriday(now),E=getEvents(now),sig=E.next.ms+"|"+E.Dd+"|"+E.L.name+"|"+fri;
  applyTheme(E,now);
  if(force||sig!==lastSig){lastSig=sig;renderToday(E,now);renderWidgets(E,now);renderReminders(E);updateQibla();if(force){renderSettings();renderTracker()}}
  const rem=E.next.ms-now,p=Math.min(1,Math.max(0,(now-E.prev.ms)/(E.next.ms-E.prev.ms)));
  $$(".b-cd").forEach(el=>el.innerHTML=hmsU(rem));

  $$(".b-bar").forEach(el=>el.style.width=(p*100)+"%");
  $$(".b-bar2").forEach(el=>{el.style.width=(p*100)+"%";el.style.background=urgency(rem)});
  $$(".b-cdh").forEach(el=>el.innerHTML=cdHTML(rem));
  $$("[data-arch]").forEach(svg=>setArch(svg,p));
  updateSky(E,now,p);updateSkyIn(E,now);updateWHome(E,now);updateWClock(E,now);

/* ---------- profile, prayer log, streaks ---------- */
const BIT={fajr:1,dhuhr:2,asr:4,maghrib:8,isha:16},FULL=31;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.500 4.500L19 7.500"/></svg>';

const dkey=n=>{const g=gparts(n);return g.y+"-"+String(g.m+1).padStart(2,"0")+"-"+String(g.d).padStart(2,"0")};
/* Each day: S.trk[date][prayer] = {s:"o"|"l"|"m"|"x", j?:1, f?:1}  (on time, late, missed, excused) */
const trkDay=n=>S.trk[dkey(n)]||{};
const isRest=n=>(S.restA!=null&&n>=S.restA)||S.restR.some(r=>n>=r[0]&&n<=r[1]);
const maskOf=n=>{const d=trkDay(n);return P.reduce((a,k)=>a+((d[k]&&(d[k].s==="o"||d[k].s==="l"))?BIT[k]:0),0)};
function dayState(n){
  if(isRest(n))return "rest";
  const d=trkDay(n);let pr=0,ex=0;
  P.forEach(k=>{const r=d[k];if(r&&r.s==="x")ex++;else if(r&&(r.s==="o"||r.s==="l"))pr++});
  if(ex===5)return "rest";
  return (pr+ex===5&&pr>0)?"full":"part";
}
const isFull=n=>dayState(n)==="full";
const cnt=m=>P.reduce((a,k)=>a+((m&BIT[k])?1:0),0);
/* rest days neither add to nor break a streak; today only counts once it is complete */
const hasMiss=n=>P.some(k=>(trkDay(n)[k]||{}).s==="m"),hasLate=n=>P.some(k=>(trkDay(n)[k]||{}).s==="l");
function streakNow(today){let n=today,c=0;for(let g=0;g<4000;g++,n--){const st=dayState(n);if(st==="rest")continue;if(st==="full"){c++;continue}if(hasMiss(n))break}return c}
function bestStreak(){
  const keys=Object.keys(S.trk);if(!keys.length)return 0;
  const first=Math.min(...keys.map(k=>{const [y,m,d]=k.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5})),today=localDay();
  let best=0,run=0;
  for(let n=first;n<=today;n++){const st=dayState(n);if(st==="rest")continue;if(st==="full"){run++;if(run>best)best=run}else if(hasMiss(n))run=0}
  return best;
}
/* a prayer's window runs until the next prayer begins (Fajr until sunrise, Isha until the next Fajr) */
function windowEnd(E,k){const t=E.today;return k==="fajr"?t.sunrise:k==="dhuhr"?t.asr:k==="asr"?t.maghrib:k==="maghrib"?t.isha:((E.list.find(e=>e.o===1&&e.key==="fajr")||{}).ms||t.isha+6*3600e3)}
const autoStatus=(E,k,now)=>now<windowEnd(E,k)-30*60000?"o":"l";   /* on time until the last 30 minutes of the window */
const dayRec=()=>{const key=dkey(localDay());return S.trk[key]||(S.trk[key]={})};
const cleanDay=()=>{const key=dkey(localDay());if(S.trk[key]&&!Object.keys(S.trk[key]).length)delete S.trk[key]};
const isX=k=>(trkDay(localDay())[k]||{}).s==="x";   /* excused: not required today (e.g. rest days ended after its time) */
const statusLabel=k=>{const r=trkDay(localDay())[k];return r&&r.s==="x"?tx("Not required"):r&&(r.s==="o"||r.s==="l"||r.s==="m")?tx(r.s==="o"?"On time":r.s==="l"?"Late":"Missed")+(k==="dhuhr"&&r.ju?" \u00b7 "+tx("Jumu\u2019ah"):""):""};
function statsFor(period,now){
  const E=getEvents(now),today=localDay(),g=gparts(today);
  const start=period==="today"?today:period==="week"?today-g.w:period==="month"?Date.UTC(g.y,g.m,1)/864e5:Date.UTC(g.y,0,1)/864e5;
  const since=S.since==null?today:S.since;
  let o=0,l=0,m=0,j=0,f=0,ju=0,tracked=0;
  for(let n=Math.max(start,since);n<=today;n++){
    if(isRest(n))continue;
    if(!P.some(k=>trkDay(n)[k]))continue;                          /* a day with no marks at all is not counted */
    for(const k of P){
      const rec=trkDay(n)[k];let st;
      if(rec&&rec.s==="x")continue;
      if(rec)st=rec.s;
      else{
        if(n===today&&now<windowEnd(E,k))continue;                       /* still open or not started */
        if(n===today-1&&k==="isha"&&now<E.today.fajr)continue;           /* last night's Isha is open until Fajr */
        st="m";
      }
      tracked++;
      if(st==="o")o++;else if(st==="l")l++;else m++;
      if(rec&&st!=="m"){if(rec.j)j++;if(rec.f)f++;if(rec.ju&&k==="dhuhr")ju++}
    }
  }
  return {ju,o,l,m,j,f,tracked,prayed:o+l};
}
function migrateData(){
  if(Object.keys(S.log).length){
    for(const key in S.log){const mk=S.log[key],d=S.trk[key]||(S.trk[key]={});P.forEach(k=>{if((mk&BIT[k])&&!d[k])d[k]={s:"o"}})}

  }

}

function ringSVG(mask,n){

function streakHTML(now){

  $("#s-trk").innerHTML=`
  <header><button class="backb" data-act="tab" data-v="today">${ARR()} ${tx("Today")}</button><h1>${tx("Prayer tracker")}</h1><p class="sub">${tx("Your prayers, at a glance.")}</p></header>
  <div class="seg trk-seg" role="group" aria-label="${tx("Prayer tracker")}">${[["today","Today"],["week","Week"],["month","Month"],["year","Year"]].map(([k,t])=>`<button aria-pressed="${TK.p===k}" data-act="tper" data-v="${k}">${tx(t)}</button>`).join("")}</div>
  <div class="trk-main">
    <div class="donut">${donutSVG(st)}<div class="dc"><span>${tx("Overall")}</span><b class="num">${tot?Math.round(st.prayed/tot*100)+"%":"\u2013"}</b></div></div>
    <ul class="legend">${li("var(--gold)",tx("On time"),st.o)}${li("var(--st-late)",tx("Late"),st.l)}${li("var(--st-miss)",tx("Missed"),st.m)}<li class="sep"></li>${li("var(--goldhi)",tx("Jama\u2019ah"),st.j)}${li("var(--goldlo)",tx("First row"),st.f)}${fem?li("var(--mist)",tx("Attended Jumu\u2019ah"),st.ju):""}</ul>
  </div>
  ${tot?"":`<p class="fine" style="margin:14px 2px 0">${tx("No prayers tracked yet.")}</p>`}
  <div class="tbars">${bar(tx("Prayed with Jama\u2019ah"),st.j,"var(--goldhi)")}${bar(tx("Prayed in the first row"),st.f,"var(--goldlo)")}${fem?bar(tx("Attended Jumu\u2019ah"),st.ju,"var(--mist)"):""}${bar(tx("Prayed on time"),st.o,"var(--gold)")}${bar(tx("Prayed late"),st.l,"var(--st-late)")}${bar(tx("Missed prayers"),st.m,"var(--st-miss)")}</div>
  <p class="fine" style="margin:18px 2px 0">${tx("On time means prayed before the last 30 minutes of its time. Late means in the last 30 minutes or after its time ends.")} ${tx("Days with no marks aren\u2019t counted. Once you mark a prayer, the other prayers of that day whose time has passed count as missed.")}</p>
  ${fem?`<div class="card lc" style="margin-top:20px"><button class="opt" data-act="rest"><span>${tx("Rest days")}<small>${S.restA!=null?tx("On since {0}",gparts(S.restA).d+" "+GM[gparts(S.restA).m]):tx("Pause tracking and reminders")}</small></span>${CHEV}</button></div>`:""}`;
}

/* ---------- welcome / profile ---------- */
const WL=$("#welcome");let wst={name:"",g:null,edit:false};
function openWelcome(edit,keep){
  const pf=S.profile||{};
  if(!keep)wst={name:pf.name||"",g:pf.g||null,edit:!!edit};
  edit=wst.edit;
  WL.innerHTML=`<div class="wlc">
    <div class="chips" role="group" aria-label="${tx("Language")}">${Object.entries(LANGS).map(([k,l])=>`<button class="chip" aria-pressed="${k===LANG}" data-act="wlang" data-v="${k}">${l.name}</button>`).join("")}</div>
    <svg class="logo" viewBox="0 0 30 34" aria-hidden="true"><path d="M3 32V17C3 10 11 8 15 2C19 8 27 10 27 17V32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="21" r="2" fill="currentColor"/></svg>
    <h1 id="wtitle">${edit?tx("Your profile"):tx("Welcome to Mihrab")}</h1>
    
    <p class="lead">${edit?tx("Update how we address you."):tx("Tell us a little about you, so we can cheer you on with every prayer.")}</p>
    <div class="fld"><label for="wname">${tx("Your name")}</label><input id="wname" type="text" maxlength="24" autocomplete="given-name" placeholder="${tx("Enter your name")}" value="${esc(wst.name)}"></div>
    <div class="fld"><div class="lbl" id="wgl">${tx("Gender")}</div>
      <div class="gq" role="radiogroup" aria-labelledby="wgl">
        <button class="gbtn" role="radio" aria-checked="${wst.g==="m"}" data-act="wgender" data-v="m" ${edit&&restLock()?"disabled":""}><b>${tx("Male")}</b></button>
        <button class="gbtn" role="radio" aria-checked="${wst.g==="f"}" data-act="wgender" data-v="f"><b>${tx("Female")}</b></button>
      </div>${edit&&restLock()?`<p class="fine" style="margin:8px 2px 0">${tx("End rest days first to change this.")}</p>`:""}</div>
    <button class="btn gold go" id="wgo" data-act="wsave">${edit?tx("Save"):tx("Continue")}</button>
    ${edit?`<button class="skip" data-act="wcancel">${tx("Cancel")}</button>`:`<p class="fine" style="margin-top:16px">${tx("Stored only on this device.")}</p>`}
  </div>`;
  WL.classList.add("on");
  const inp=$("#wname",WL);
  inp.addEventListener("input",()=>{wst.name=inp.value;wCheck()});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&wOk())$("#wgo").click()});
  wCheck();if(!keep)setTimeout(()=>{try{inp.focus()}catch(e){}},80);
}
const restLock=()=>!!(S.profile&&S.profile.g==="f"&&S.restA!=null);   /* rest days on: the profile stays female until they are ended */
const wOk=()=>wst.name.trim().length>0&&!!wst.g;
function wCheck(){const b=$("#wgo");if(b)b.disabled=!wOk()}
function saveWelcome(){
  if(!wOk())return;
  if(restLock()&&wst.g!=="f"){toast(tx("End rest days first to change this."));return}
  S.profile={name:wst.name.trim().slice(0,24),g:wst.g};if(wst.g!=="f")S.restA=null;save();
  WL.classList.remove("on");refreshAll();
  toast(wst.edit?tx("Profile updated"):tx("Welcome, {0}",S.profile.name));
}

function labelScreens(){
  [["today","Today"],["cal","Calendar"],["guide","Prayer guide"],["qibla","Qibla"],["rem","Reminders"],["set","Settings"],["widgets","Widgets"],["trk","Prayer tracker"]].forEach(([id,k])=>{const e=$("#s-"+id);if(e)e.setAttribute("aria-label",tx(k))});
}
function buildTabs(){
  labelScreens();
$("#tabs").innerHTML='<button class="brand" data-act="about" aria-label="'+tx("About {0}",appn())+'"><svg viewBox="0 0 30 34" aria-hidden="true"><path d="M3 32V17C3 10 11 8 15 2C19 8 27 10 27 17V32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+TABS.map(([id,t],i)=>`<button class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${i===0}">${TABICON[id]}<span>${tx(t)}</span></button>`).join("");
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===(({qibla:"today",widgets:"set",trk:"today"})[curTab]||curTab)));
}
function applyLang(){
  const h=document.documentElement;h.lang=LANG;h.dir=LANGS[LANG].dir;setLists();
  buildTabs();renderGuide();buildQibla();renderCal();refreshAll();
}
function setLang(v){
  if(!LANGS[v])return;
  LANG=v;S.lang=v;S.glang=v==="ml"?"ml":"en";S.translit=(v==="en");save();applyLang();
}
/* ---------- installable web app: service worker, install, updates, offline ---------- */
const CAN_PWA="serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&window.top===window.self;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let deferredInstall=null,swReg=null,updReg=null,updating=false;
function installApp(){
  if(deferredInstall){const d=deferredInstall;deferredInstall=null;d.prompt();d.userChoice.finally(()=>renderSettings());return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const steps=ios?["Tap the Share button in Safari","Choose Add to Home Screen","Tap Add"]:["Open your browser menu","Choose Install app or Add to Home screen"];
  openSheet(`<h2>${tx("Install {0}",appn())}</h2><p class="sub" style="margin-bottom:6px">${tx("Add it to your home screen for full-screen use and offline access.")}</p>
    <ol class="inst">${steps.map((t,i)=>`<li><b>${i+1}</b><span>${tx(t)}</span></li>`).join("")}</ol>
    <button class="btn gold" style="width:100%" data-act="close">${tx("Done")}</button>`);
}
function showUpdate(reg){
  updReg=reg;
  $("#upd").innerHTML=`<span>${tx("A new version is ready.")}</span><button class="btn gold" style="padding:8px 16px;font-size:13.5px" data-act="applyupd">${tx("Refresh")}</button>`;
  $("#upd").classList.add("on");
}
if(CAN_PWA){
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;renderSettings()});
  window.addEventListener("appinstalled",()=>{deferredInstall=null;toast(tx("App installed"));renderSettings()});
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js?v="+APP.version).then(reg=>{
      swReg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg);
      reg.addEventListener("updatefound",()=>{const nw=reg.installing;if(nw)nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller)showUpdate(reg)})});
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(updating)location.reload()});
  window.addEventListener("offline",()=>toast(tx("You\u2019re offline. Everything still works.")));
  window.addEventListener("online",()=>toast(tx("Back online")));
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}

/* ---------- init ---------- */
migrateData();
initSkyBg();document.documentElement.classList.add("sky-on");
setLists();document.documentElement.lang=LANG;document.documentElement.dir=LANGS[LANG].dir;
buildTabs();
renderGuide();buildQibla();
document.documentElement.classList.add("no-anim");
tick(true);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove("no-anim")));
setInterval(()=>tick(false),1000);
if(!S.profile)openWelcome(false);
try{const q=new URLSearchParams(location.search).get("tab");if(q&&["today","cal","guide","rem","set","qibla","widgets","trk"].includes(q))setTab(q)}catch(e){}
})();
</script>
</body>
