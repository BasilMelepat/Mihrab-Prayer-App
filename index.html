  --ml:"Hanken Grotesk","Noto Sans Malayalam","Manjari","Kartika",sans-serif;

}

html.no-anim,html.no-anim *{transition:none!important}

/* ---- themes: midnight (default, also used inside device mock-ups) and dawn ---- */
:root,.dev{
  --midnight:#090D1B; --night:#0F1530; --dusk:#141B38; --dusk2:#1B2447;
  --gold:#E2BC78; --goldhi:#F3DDAA; --goldlo:#9B7B45;
  --ivory:#F0ECE2; --mist:#98A1BE; --mist2:#6B759A;
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.055);
  --on-gold:#2A1D05; --btn-a:#EBC884; --btn-b:#D1A55C;
  --bg-glow:rgba(9,13,27,0); --card-a:#151D3C; --card-b:#111831;
  --chip-bg:rgba(255,255,255,.07); --tabbar:rgba(19,26,53,.80); --sheet-bg:#0F1530; --toast-bg:#1B2447;
  --sw-off:#2A3563; --gold-a18:rgba(226,188,120,.18); --nxt-a:rgba(255,255,255,.085); --nxt-b:rgba(255,255,255,.045);
  --pose-bg:rgba(255,255,255,.04); --shade:rgba(3,6,16,.62);
  --arch-a:#22336B; --arch-b:#0D1630; --arch-prog:#F1DCA8; --arch-dot:#FFF3CF;
  --dial-a:#16244B; --dial-b:#0B1330; --st-late:#D9806E; --st-miss:#6B759A;
  --shadow-card:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.28),0 18px 38px -18px rgba(0,0,0,.72);
  --shadow-sm:0 8px 18px -8px rgba(0,0,0,.65);
  --shadow-sky:0 26px 52px -20px rgba(0,0,0,.8),0 4px 12px rgba(0,0,0,.25);
  --shadow-nav:0 18px 40px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);
  color-scheme:dark;
}
.dev{color:var(--ivory)}
html[data-theme="day"]{
  --midnight:#F3F5FA; --night:#F8F9FD; --dusk:#E8ECF5; --dusk2:#DEE4F0;
  --gold:#9A6C15; --goldhi:#7D5410; --goldlo:#B39254;
  --ivory:#141B34; --mist:#586383; --mist2:#7C86A5;
  --line:rgba(20,28,58,.10); --line-soft:rgba(20,28,58,.065);
  --on-gold:#FFF8E6; --btn-a:#B8862A; --btn-b:#946913;
  --bg-glow:rgba(243,245,250,0); --card-a:#FFFFFF; --card-b:#FFFFFF;
  --chip-bg:#EBEEF6; --tabbar:rgba(255,255,255,.84); --sheet-bg:#FFFFFF; --toast-bg:#FFFFFF;
  --sw-off:#CDD4E4; --gold-a18:rgba(154,108,21,.14); --nxt-a:rgba(40,60,130,.07); --nxt-b:rgba(40,60,130,.04);
  --pose-bg:#F3F5FA; --shade:rgba(20,28,58,.4);
  --arch-a:#FFF6DE; --arch-b:#F3D399; --arch-prog:#9A6C15; --arch-dot:#6E4A0C;
  --dial-a:#FFFFFF; --dial-b:#E3E9F3; --st-late:#B5513F; --st-miss:#8A93AD;
  --shadow-card:0 1px 2px rgba(22,32,66,.04),0 12px 32px -12px rgba(22,32,66,.16),0 32px 64px -32px rgba(22,32,66,.16);
  --shadow-sm:0 8px 18px -8px rgba(22,32,66,.24);
  --shadow-sky:0 24px 48px -18px rgba(44,76,150,.46),0 6px 16px -6px rgba(22,32,66,.14);
  --shadow-nav:0 18px 40px -14px rgba(22,32,66,.30),0 0 0 1px rgba(22,32,66,.045);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--midnight)}
body{margin:0;height:100%;background:var(--midnight);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--goldhi);outline-offset:2px;border-radius:8px}
.ml{font-family:var(--ml)}
.ar{font-family:var(--ar)}
.num{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum","tnum"}

/* stage + phone */
.stage{height:100%;display:grid;place-items:center;padding:16px}
.phone{--sb:52px;position:relative;width:390px;height:min(844px,calc(100dvh - 32px));min-height:600px;overflow:hidden;border-radius:46px;border:1px solid rgba(214,178,110,.3);box-shadow:0 0 0 8px #060a17,0 40px 90px rgba(0,0,0,.55);
  background:var(--midnight)}
.sbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:13px;font-weight:600;z-index:5;pointer-events:none}
.sbar svg{width:18px;height:18px;fill:var(--ivory)}
@media (max-width:520px){
  .stage{padding:0;display:block;position:fixed;inset:0;height:auto}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;border:0;box-shadow:none;--sb:calc(20px + env(safe-area-inset-top,0px))}
  .sbar{display:none}
}
.screen{position:absolute;inset:0 0 94px 0;overflow-y:auto;overflow-x:hidden;padding:var(--sb) 20px 32px;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}

/* tabs */
.tabs{position:absolute;left:14px;right:14px;bottom:14px;height:66px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbar);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:0;border-radius:28px;box-shadow:var(--shadow-nav);z-index:4}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mist2);position:relative}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--gold)}
.tab[aria-selected=true]::before{content:"";position:absolute;inset:7px 4px;background:var(--gold-a18);border-radius:22px;z-index:-1}

/* type */
h1{font-family:var(--display);font-size:36px;line-height:1.05;margin:0;letter-spacing:.2px}
h2{font-family:var(--display);font-size:26px;line-height:1.15;margin:0}
.sub{color:var(--mist);font-size:14px;margin:4px 0 0}
.fine{color:var(--mist2);font-size:12px;line-height:1.55}

/* today header */
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.greg{color:var(--mist);font-size:13.5px;margin-top:4px}
.loc{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 11px 7px 9px;font-size:13px;color:var(--goldhi);background:var(--card-a);box-shadow:var(--shadow-sm);white-space:nowrap}
.loc svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero arch */

/* prayer list */
.list{margin-top:16px;padding:8px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(180deg,var(--card-a),var(--card-b));border-radius:28px;box-shadow:var(--shadow-card);transition:box-shadow 1.6s cubic-bezier(.4,0,.2,1)}
.row{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:10px;padding:11px 14px 11px 10px;border-radius:20px}
.row .dt{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mist2)}
.row .nm b{font-weight:500;font-size:16px;display:block;line-height:1.2}
.row .nm span{font-family:var(--ml);font-size:12px;color:var(--mist)}
.row .a{font-family:var(--ar);font-size:20px;color:var(--goldlo)}
.row time{font-family:var(--display);font-size:22px;min-width:76px;text-align:end}
.row.past .nm,.row.past .a,.row.past time{opacity:.6}
.row.past .dt{background:var(--goldlo);border-color:var(--goldlo)}
.row.cur .dt{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-a18)}
.row.nxt{background:linear-gradient(90deg,var(--nxt-a),var(--nxt-b))}
.row.nxt .dt{border-color:var(--gold)}
.row.nxt .a,.row.nxt time{color:var(--goldhi)}
.row.sun{opacity:.75}
.row.sun .dt{border-style:dashed}

/* chips / buttons */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--mist);white-space:nowrap;background:var(--chip-bg)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.chip small{opacity:.75;margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px}
.btn.gold{background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--on-gold)}
.btn.ghost{border:0;color:var(--goldhi);background:var(--chip-bg)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* cards */
.card{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:0;border-radius:26px;padding:16px;box-shadow:var(--shadow-card);transition:box-shadow 1.6s cubic-bezier(.4,0,.2,1)}
.sec{margin-top:22px}
.sec>h3{margin:0 0 10px;font-family:var(--display);font-size:21px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.setrow+.setrow{border-top:1px solid var(--line-soft)}
.setrow .t b{display:block;font-weight:500;font-size:15.5px}
.setrow .t span{font-size:12.5px;color:var(--mist)}
.sw{flex:none;width:48px;height:28px;border-radius:99px;background:var(--sw-off);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:left .2s,background .2s}
.sw[aria-checked=true]{background:var(--gold)}
.sw[aria-checked=true]::after{left:23px;background:var(--on-gold)}

/* guide */
.pbar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--goldlo),var(--goldhi));border-radius:3px;transition:width .35s}
.reader{margin-top:16px;padding:18px 18px 22px}
.rmeta{display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--gold)}
.rmeta button{color:var(--mist);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.thead{display:flex;gap:14px;align-items:center}
.pose{flex:none;width:84px;height:92px;border:1px solid var(--line);border-radius:42px 42px 14px 14px;display:grid;place-items:center;background:var(--pose-bg)}
.pose svg{width:68px;height:60px;fill:none;stroke:var(--gold);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.thead .t2{color:var(--mist);font-size:13.5px;margin-top:3px}
.lines{margin-top:18px;display:flex;flex-direction:column;gap:18px}
.ln{text-align:center}
.ln .ar{direction:rtl;font-size:24px;line-height:2;color:var(--goldhi)}
.ln .tr{font-style:italic;color:var(--mist);font-size:14px;line-height:1.55;margin-top:2px}
.ln .mn{margin-top:6px;font-size:15.5px;line-height:1.75;color:var(--ivory)}
.ln .mn.ml{font-size:15px;line-height:1.9}
.rep{display:inline-block;margin-top:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--goldhi)}
.note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--mist);line-height:1.6}
.gnav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.gnav .cnt{color:var(--mist);font-size:13px}
.gopts{margin-top:18px}
.seg{display:inline-flex;border:0;border-radius:999px;padding:3px;background:var(--chip-bg)}
.seg button{padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--mist)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--on-gold);font-weight:600}

/* qibla */
.qwrap{position:relative;width:min(100%,318px);aspect-ratio:1;margin:22px auto 0;touch-action:none;cursor:grab;user-select:none}
.qwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.qwrap .glow{opacity:0;transition:opacity .3s}
.qwrap.al .glow{opacity:1}
.qwrap.al .rim{stroke:var(--goldhi)}
.qc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.qc .deg{font-family:var(--display);font-size:50px;line-height:1}
.qc .dir{color:var(--mist);font-size:13px;margin-top:6px}
.qinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.qinfo .card{padding:14px}
.qinfo b{display:block;font-family:var(--display);font-size:26px}
.qinfo span{font-size:12.5px;color:var(--mist)}
.qstatus{text-align:center;margin-top:16px;min-height:24px;font-size:14px;color:var(--mist)}
.qstatus.al{color:var(--goldhi)}

/* lock preview + widgets */
.lock{border-radius:28px;padding:22px 16px 16px;background:linear-gradient(170deg,#25386F 0%,#0F1830 70%);border:1px solid var(--line);text-align:center}
.lock .lt{font-family:var(--display);font-size:62px;line-height:1}
.lock .ld{font-size:13px;color:var(--mist);margin:2px 0 18px}
.ntf{display:flex;gap:11px;text-align:start;background:rgba(10,16,34,.72);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 14px;backdrop-filter:blur(8px)}
.ntf+.ntf{margin-top:8px;opacity:.7;transform:scale(.97)}
.ntf .ic{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#16244B,#0A1022);border:1px solid var(--line);display:grid;place-items:center}
.ntf .ic svg{width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ntf .hd{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mist)}
.ntf b{display:block;font-weight:600;font-size:14.5px;margin-top:1px}
.ntf p{margin:1px 0 0;font-size:13px;color:var(--mist)}
.wall{border-radius:30px;padding:20px 16px 16px;background:radial-gradient(90% 50% at 70% 0%,#3A4F94 0%,rgba(58,79,148,0) 70%),linear-gradient(180deg,#14204A,#0B1228);border:1px solid var(--line)}
.wall .wt{font-family:var(--display);font-size:54px;line-height:1;text-align:center}
.wall .wd{text-align:center;color:var(--mist);font-size:13px;margin:2px 0 16px}
.wg{background:rgba(10,16,34,.74);border:1px solid rgba(214,178,110,.28);border-radius:26px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w22{aspect-ratio:1;padding:14px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.w22 .arch{width:44px;height:50px;overflow:visible}
.w22 .an{position:absolute;right:14px;top:10px;font-family:var(--ar);font-size:28px;color:var(--goldhi);line-height:1.4}
.w22 .tm{font-family:var(--display);font-size:30px;line-height:1}
.w22 .in{font-size:12px;color:var(--mist);margin-top:3px}
.wcap{font-size:12px;color:var(--mist2);text-align:center;margin-top:7px}
.w42{margin-top:12px;padding:14px 14px 12px}
.w42 .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w42 .top b{font-family:var(--display);font-size:19px}
.w42 .top span{font-size:11.5px;color:var(--mist)}
.w42 .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.w42 .c{text-align:center;padding:7px 0 6px;border-radius:14px}
.w42 .c i{display:block;font-style:normal;font-size:11.5px;color:var(--mist)}
.w42 .c b{display:block;font-family:var(--display);font-size:16.5px;font-weight:600;margin-top:1px}
.w42 .c.n{background:var(--gold)}
.w42 .c.n i,.w42 .c.n b{color:var(--on-gold)}
.w42 .c.p{opacity:.45}
.mbar{height:3px;border-radius:3px;background:rgba(214,178,110,.18);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--gold)}
.dock{display:flex;justify-content:space-around;margin-top:18px}
.dock i{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}

/* sheet + banner + toast */
.shade{position:absolute;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;overflow-y:auto;background:var(--sheet-bg);box-shadow:0 -24px 60px -24px rgba(8,14,40,.45);border-radius:30px 30px 0 0;padding:10px 20px 28px;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:9}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--mist2);opacity:.5;margin:0 auto 14px}
.sheet h2{margin-bottom:6px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 4px;text-align:start;border-top:1px solid var(--line-soft);font-size:15.5px}
.opt small{display:block;color:var(--mist);font-size:12.5px}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mist2)}
.opt[aria-checked=true] .rd{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 0 45%,transparent 50%)}
.banner{position:absolute;left:12px;right:12px;top:calc(var(--sb) - 10px);z-index:12;transform:translateY(-160%);transition:transform .45s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.banner.on{transform:none;pointer-events:auto}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--toast-bg);border:0;box-shadow:var(--shadow-sm);color:var(--ivory);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s;z-index:13;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}



/* ---- about ---- */
.verlink{display:inline-block;margin-top:10px;color:var(--goldhi);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.about{text-align:center}
.about .logo{display:block;width:58px;height:66px;color:var(--gold);margin:8px auto 12px}
.about h2{font-size:36px}
.about .mlname{font-family:var(--ml);color:var(--mist);font-size:14px;margin-top:2px}
.vpill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--goldhi);margin-top:12px}
.about h3{font-family:var(--display);font-size:21px;text-align:start;margin:26px 0 4px}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid var(--line-soft);text-align:start;font-size:14.5px}
.crow span{color:var(--mist);font-size:13px;text-align:end}
.crow.todo span{color:var(--goldhi)}
.about .priv{margin-top:22px;text-align:start;font-size:13.5px;line-height:1.6;color:var(--mist)}
.about .copy{margin-top:20px}
button.brand{background:none;border:0;padding:0;cursor:pointer}


/* ---- manual adjustment ---- */
.adjb{font-style:normal;color:var(--goldhi);margin-inline-start:6px;font-size:11.5px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.arow .t b{display:block;font-weight:500;font-size:15.5px}
.arow .t span{display:block;font-size:12.5px;color:var(--mist);margin-top:1px}
.arow .t span em{font-style:normal;color:var(--goldhi)}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:50%;border:0;background:var(--chip-bg);color:var(--goldhi);font-size:22px;line-height:1;display:grid;place-items:center}
.stp button[disabled]{opacity:.3;pointer-events:none}
.stp b{min-width:98px;text-align:center;font-weight:500;font-size:14px}
.stp b.z{color:var(--mist)}


/* ---- calendar ---- */
.datebtn{text-align:start;display:block}
.c-side{margin-top:6px}
.calbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.mbar2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}
.mbar2 .mt{text-align:center;min-width:0}
.mbar2 .mt h2{font-size:28px}
.mbar2 .mt span{font-size:13px;color:var(--goldhi)}
.navb{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--card-a);box-shadow:var(--shadow-sm);color:var(--goldhi);font-size:26px;line-height:1;display:grid;place-items:center;padding-bottom:3px}
.wdr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--mist);margin-bottom:4px}
.wdr .fri{color:var(--goldhi);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dcell{position:relative;aspect-ratio:1/1.12;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid transparent;min-width:0}
.dcell .g{font-family:var(--display);font-size:21px;font-weight:600;line-height:1}
.dcell .s{font-size:10.5px;color:var(--goldhi);line-height:1.1;opacity:.9}
.dcell .s.mo{font-weight:600}
.dcell.out{opacity:.38}
.dcell.fri{background:var(--nxt-b)}
.dcell.sel{border-color:var(--gold)}
.dcell.today{background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--on-gold)}
.dcell.today .s{color:var(--on-gold);opacity:.85}
.dcell i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.dcell.today i{background:var(--on-gold)}
.lg{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-inline-end:7px;vertical-align:middle}
.seld{margin-top:22px}
.seld .l1{font-size:14px;color:var(--mist)}
.seld .l2{font-family:var(--display);font-size:32px;line-height:1.1;margin-top:4px;color:var(--goldhi)}
.seld .l3{font-size:13.5px;color:var(--mist);margin-top:2px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--goldhi)}
.w42x{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.w42x .c{text-align:center}
.w42x .c i{display:block;font-style:normal;font-size:11.5px;color:var(--mist)}
.w42x .c b{display:block;font-family:var(--display);font-size:18px;font-weight:600;margin-top:1px}
.up{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 0}
.up+.up{border-top:1px solid var(--line-soft)}
.up b{display:block;font-weight:500;font-size:15px}
.up .ml{display:block;font-size:12.5px;color:var(--mist)}
.up em{display:block;font-style:normal;font-size:12px;color:var(--mist2);margin-top:2px}
.up .when{flex:none;font-size:12.5px;color:var(--goldhi);border:1px solid var(--line);border-radius:999px;padding:4px 11px}


/* ---- qibla button, location row, settings ---- */
.qbtn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--card-a);box-shadow:var(--shadow-sm);color:var(--gold);display:grid;place-items:center}
.qbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.locrow{display:flex;justify-content:flex-start;margin:14px 0 0}
.backb{display:inline-flex;align-items:center;color:var(--goldhi);font-size:14px;margin-bottom:12px}
.card.lc{padding:0 16px}
.card.lc .opt:first-child{border-top:0}
.slab{font-size:13px;color:var(--mist);margin:18px 4px 8px}


/* ---- greeting, checkboxes, streak, welcome ---- */
.greet{min-width:0;flex:1}
.ck{flex:none;width:26px;height:26px;border-radius:9px;border:1.8px solid var(--mist2);display:grid;place-items:center;color:transparent;justify-self:center;transition:background .2s,border-color .2s,color .2s}
.ck svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ck.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.ck.due{border-color:var(--gold)}
.ck.wait{opacity:.4;border-style:dashed}
.row.cur .ck:not(.on):not(.wait){box-shadow:0 0 0 4px var(--gold-a18)}
.row .dt{justify-self:center}
.stk{margin-top:22px;padding:18px 16px 16px}
.stk-top{display:flex;align-items:center;gap:14px}
.stk-flame{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--gold-a18);color:var(--gold)}
.stk-flame svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stk-flame.on svg{fill:var(--gold-a18)}
.stk-big b{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;display:block}
.stk-big span{font-size:13px;color:var(--mist)}
.stk-mini{margin-inline-start:auto;display:flex;gap:16px;text-align:center}
.stk-mini b{display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.stk-mini span{font-size:11.5px;color:var(--mist)}
.stk-mo{font-family:var(--display);font-size:21px;margin:18px 0 8px}
.skg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px}
.skd{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;min-width:0}
.skd svg{position:absolute;inset:0;width:100%;height:100%}
.skd .num{position:relative;font-size:12px;font-weight:500}
.skd.full{background:var(--gold-a18)}
.skd.full .num{color:var(--goldhi);font-weight:600}
.skd.today .num{color:var(--goldhi);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.skd.future{opacity:.35}
.welcome{position:absolute;inset:0;z-index:30;display:none;overflow-y:auto;padding:var(--sb) 24px 28px;background:var(--midnight)}
.welcome.on{display:flex}
.wlc{margin:auto;width:100%;max-width:420px;text-align:center}
.wlc .logo{width:58px;height:66px;color:var(--gold);display:block;margin:0 auto 14px}
.wlc h1{font-size:38px}
.wlc .mlh{font-family:var(--ml);color:var(--mist);margin-top:6px;font-size:15px}
.wlc p.lead{color:var(--mist);margin:16px 0 24px;font-size:15px;line-height:1.55}
.wlc .fld{text-align:start;margin-bottom:18px}
.wlc label,.wlc .lbl{display:block;font-size:13px;color:var(--mist);margin:0 4px 8px}
.wlc input{width:100%;border:1px solid var(--line);background:var(--chip-bg);color:var(--ivory);border-radius:16px;padding:15px 16px;font:inherit;font-size:16px}
.wlc input::placeholder{color:var(--mist2)}
.wlc .gq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtn{border:1px solid var(--line);background:var(--chip-bg);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;gap:2px;align-items:center}
.gbtn b{font-weight:500;font-size:16px}
.gbtn span{font-family:var(--ml);font-size:12.5px;color:var(--mist)}
.gbtn[aria-checked=true]{border-color:var(--gold);background:var(--gold-a18)}
.gbtn[aria-checked=true] b{color:var(--goldhi)}
.wlc .go{width:100%;margin-top:6px}
.wlc .skip{margin-top:14px;color:var(--mist);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---- layout helpers (phone defaults) ---- */
.chips.scroll.g-chips{margin-top:16px}
.q-btn{text-align:center;margin-top:18px}
.q-hint{text-align:center;margin:14px 8px 0}
button.brand,.brand{display:none}
/* hero scales with its own width so it looks right on every screen */

/* ---- tablet and up: side rail, no phone frame ---- */
@media (min-width:700px) and (max-height:700px){.tabs{grid-auto-rows:62px}}
@media (min-width:700px){
  .stage{padding:0;display:block}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;border:0;box-shadow:none;--sb:32px}
  .sbar{display:none}
  .tabs{top:14px;bottom:14px;right:14px;left:auto;width:84px;height:auto;grid-template-columns:1fr;grid-auto-rows:76px;align-content:center;border-radius:30px}
  .tab{font-size:11.5px}
  .tab[aria-selected=true]::before{inset:6px 8px;border-radius:22px}
  button.brand,.brand{display:block;position:absolute;top:22px;left:50%;transform:translateX(-50%);width:30px;height:34px;color:var(--gold)}
  .brand svg{width:100%;height:100%;display:block}
  .screen{inset:0 112px 0 0;padding:var(--sb) max(36px,calc((100% - 680px)/2)) 56px}
  h1{font-size:40px}
  .sky{width:min(100%,480px);--u:min(.9vw,4.8px)}
  .row{padding:13px 12px 13px 16px}
  .row time{font-size:24px}
  .reader{padding:24px 28px 28px}
  .ln .ar{font-size:28px}
  .ln .mn{font-size:16.5px}
  #s-widgets{padding-inline:max(36px,calc((100% - 600px)/2))}
  /* sheet becomes a centred dialog */
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(520px,92%);max-height:82%;border:0;box-shadow:0 36px 80px -24px rgba(8,14,40,.5);border-radius:30px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .banner{left:auto;right:124px;top:24px;width:400px;max-width:calc(100% - 48px)}
  .toast{bottom:32px;left:calc(50% - 56px)}
}
/* ---- wide tablet / landscape: two columns ---- */
@media (min-width:860px){
  .screen{padding-inline:max(44px,calc((100% - 1040px)/2))}
  h1{font-size:44px}
  #s-today.on{display:block}
  #s-today .sky{--u:5.2px;width:min(100%,520px);margin:0 auto;min-height:calc(93.6*var(--u))}
  #s-today .cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:stretch;align-content:start;margin-top:44px}
  #s-today .list,#s-today .stk{margin:0}
  #s-today .th .loc-h{display:flex}
  #s-today .sk-loc{display:none}

  #s-guide.on,#s-qibla.on,#s-rem.on,#s-cal.on,#s-set.on{bottom:auto;max-height:100%}
  #s-set.on{display:block}
    #s-cal.on{display:grid;grid-template-columns:minmax(0,560px) minmax(300px,1fr);column-gap:56px;align-items:start;align-content:start}
  .c-head{grid-column:1/-1}
  .c-main{grid-column:1}
  .c-side{grid-column:2;margin-top:0}
  .seld{margin-top:18px}
  #s-guide.on{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);grid-template-rows:auto auto auto auto auto auto 1fr;grid-template-areas:"head main" "cat main" "chips main" "trans main" "sum main" "opts main" "fine main";column-gap:56px;align-items:start}
  .g-head{grid-area:head}
  .chips.scroll.g-chips{grid-area:chips;flex-wrap:wrap;overflow:visible;margin:16px 0 0;padding:0}
  .g-main{grid-area:main}
  #reader{margin-top:0}
  .g-trans{grid-area:trans;margin-top:16px}
  .g-cat{grid-area:cat}
  .g-sum{grid-area:sum}
  .g-opts{grid-area:opts;margin-top:18px}
  .g-fine{grid-area:fine}

  #s-qibla.on{display:grid;grid-template-columns:minmax(0,440px) minmax(280px,1fr);grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"head head" "dial stat" "dial info" "dial btn" "dial hint";column-gap:64px;align-items:start}
  .q-head{grid-area:head}
  #qwrap{grid-area:dial;width:100%;margin:40px 0 0}
  .qstatus{grid-area:stat;text-align:start;margin-top:34px;font-size:16px}
  .qinfo{grid-area:info;margin-top:12px}
  .q-btn{grid-area:btn;text-align:start}
  .q-hint{grid-area:hint;text-align:start;margin:14px 0 0}

  #s-rem.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"head head" "perm lock" "rem lock" "lead lock" "sound lock";column-gap:64px;align-items:start}
  .r-head{grid-area:head}
  .r-perm{grid-area:perm}
  .r-rem{grid-area:rem}
  .r-lead{grid-area:lead}
  .r-sound{grid-area:sound}
  .r-lock{grid-area:lock;margin-top:22px}
}


/* ---- right-to-left (Arabic) ---- */
.hi-m,.hi-ml,.seld .l3,.up em,.up .ml,.ln .mn,.ln .tr,.t2,.row .nm span{unicode-bidi:plaintext}
html[dir="rtl"] html[dir="rtl"] html[dir="rtl"] .opt>svg{transform:scaleX(-1)}
html[dir="rtl"] .ln .tr{direction:ltr}
html[dir="rtl"] .sw::after{left:auto;right:3px}
html[dir="rtl"] .sw[aria-checked=true]::after{left:auto;right:23px}
html[dir="rtl"] .brand svg{transform:none}
.wlc .chips{justify-content:center;margin-bottom:22px}
@media (min-width:700px){
  html[dir="rtl"] .tabs{left:14px;right:auto}
  html[dir="rtl"] .screen{inset:0 0 0 112px}
  html[dir="rtl"] .banner{right:auto;left:124px}
  html[dir="rtl"] .toast{left:calc(50% + 56px)}
}

/* ---- Malayalam: the script runs larger than Latin at the same size, so type is scaled down ---- */
.tw{font-family:var(--body);font-size:11px;font-weight:500;opacity:.75;margin-inline-end:4px}
html[lang="ml"] h1{font-size:28px;line-height:1.3}
html[lang="ml"] h2{font-size:20px;line-height:1.35}
html[lang="ml"] .sec>h3,html[lang="ml"] .about h3{font-size:17px;line-height:1.4}
html[lang="ml"] html[lang="ml"] html[lang="ml"] .sub{font-size:13px;line-height:1.6}
html[lang="ml"] .fine{font-size:11.5px;line-height:1.7}
html[lang="ml"] .row .nm b{font-size:14px;line-height:1.4}
html[lang="ml"] .row time{white-space:nowrap;min-width:0;font-size:20px}
html[lang="ml"] .opt{font-size:14px;line-height:1.5}
html[lang="ml"] .opt small,html[lang="ml"] .setrow .t span{font-size:12px;line-height:1.55}
html[lang="ml"] .setrow .t b,html[lang="ml"] .arow .t b{font-size:14px}
html[lang="ml"] .mbar2 .mt h2{font-size:20px}
html[lang="ml"] .mbar2 .mt span{font-size:12px}
html[lang="ml"] .seld .l1{font-size:13px}
html[lang="ml"] .seld .l2{font-size:22px;line-height:1.35}
html[lang="ml"] .stk-mo{font-size:17px}
html[lang="ml"] .stk-big span,html[lang="ml"] .stk-mini span,html[lang="ml"] .w42x .c i{font-size:11px}
html[lang="ml"] .about h2,html[lang="ml"] .wlc h1{font-size:26px}
html[lang="ml"] .chip,html[lang="ml"] .seg button{font-size:12.5px}
html[lang="ml"] .btn{font-size:14px}
html[lang="ml"] .up b{font-size:14px}

/* ---- the sky is the home background ---- */
html.sky-on{background:var(--sk1,var(--midnight))}
.skybg{position:absolute;top:0;left:0;right:0;--skh:700px;--skf:440px;height:var(--skh);z-index:0;pointer-events:none;overflow:hidden;will-change:transform;
  background:radial-gradient(62% 48% at var(--ox,50%) var(--oy,300px),var(--glow,rgba(255,206,130,.3)),transparent 72%),linear-gradient(180deg,var(--sk1,#070B20) 0%,var(--sk2,#0E1640) 40%,var(--sk3,#1E2A60) 78%,var(--sk3,#1E2A60) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 var(--skf),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 var(--skf),transparent 100%)}

.sk-stars{position:absolute;inset:0}

.screen{z-index:1}
.sky{--u:min(.9vw,4.2px);position:relative;width:min(100%,400px);min-height:calc(93.6*var(--u) + 48px);margin:6px auto 12px;color:#fff}

.sk-in{position:absolute;left:20%;right:20%;top:36%;height:43%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.sk-in .nx{font-size:calc(3.4*var(--u));color:rgba(255,255,255,.78);margin-bottom:calc(.6*var(--u))}

.th .glass{background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.mc{display:block;padding:0;background:none;border-radius:50%;min-width:0}

/* ---- home: the countdown stays put and the cards slide over it ---- */
.hero-pin{position:sticky;top:var(--sb);z-index:0;transform-origin:50% 0;will-change:filter,opacity,transform}

/* ---- rare shooting star ---- */
.shoot{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));transform-origin:100% 50%;transform:rotate(var(--ang));opacity:0;animation:shoot 1.15s ease-out forwards;filter:drop-shadow(0 0 4px rgba(190,210,255,.9));pointer-events:none}
.shoot::after{content:"";position:absolute;right:-2px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(200,220,255,.9)}
@keyframes shoot{0%{opacity:0;transform:rotate(var(--ang)) translateX(0)}12%{opacity:1}70%{opacity:.85}100%{opacity:0;transform:rotate(var(--ang)) translateX(var(--dx))}}
/* ---- drifting clouds (visible by day, tinted by the time of day) ---- */

.cloud{position:absolute;left:calc(-1*var(--w));top:var(--y);width:var(--w);height:calc(var(--w)*.36);opacity:var(--o,.4);animation:drift var(--t,150s) linear var(--dl,0s) infinite;animation-play-state:paused;--cc:var(--cloud,#fff);-webkit-mask-image:radial-gradient(closest-side,#000 58%,transparent 100%);mask-image:radial-gradient(closest-side,#000 58%,transparent 100%)}

.cloud.s1{background:radial-gradient(34% 60% at 20% 66%,var(--cc) 0,transparent 72%),radial-gradient(30% 78% at 42% 44%,var(--cc) 0,transparent 72%),radial-gradient(34% 66% at 66% 58%,var(--cc) 0,transparent 72%),radial-gradient(26% 48% at 86% 70%,var(--cc) 0,transparent 72%)}
.cloud.s2{background:radial-gradient(30% 56% at 16% 68%,var(--cc) 0,transparent 72%),radial-gradient(36% 82% at 38% 46%,var(--cc) 0,transparent 72%),radial-gradient(28% 62% at 62% 60%,var(--cc) 0,transparent 72%),radial-gradient(32% 52% at 82% 66%,var(--cc) 0,transparent 72%)}
.cloud.s3{background:radial-gradient(38% 62% at 24% 64%,var(--cc) 0,transparent 72%),radial-gradient(28% 72% at 52% 42%,var(--cc) 0,transparent 72%),radial-gradient(34% 58% at 78% 62%,var(--cc) 0,transparent 72%)}

/* ---------- prayer time calculation ---------- */
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){
  const D=jd-2451545.0,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360);
  const L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D;
  const RA=fix(atan2(cos(e)*sin(L),cos(L))/15,24);
  return {decl:asin(sin(e)*sin(L)),eq:fix(q/15-RA+12,24)-12};
}
function calc(y,m,d,lat,lng,tz,mt,asrF){
  const jd=julian(y,m,d)-lng/(15*24);

  iftitah:{tEn:"Opening supplication",tMl:"ഇഫ്തിതാഹ് ദുആ",tAr:"دعاء الاستفتاح",pose:"stand",lines:[
    L1("اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ","Allaahumma baa\u2019id baynee wa bayna khataayaaya kamaa baa\u2019adta baynal-mashriqi wal-maghrib, allaahumma naqqinee minal-khataayaa kamaa yunaqqath-thawbul-abyadu minad-danas, allaahummaghsilnee min khataayaaya bith-thalji wal-maa\u2019i wal-barad","അല്ലാഹുവേ, കിഴക്കിനെയും പടിഞ്ഞാറിനെയും നീ അകറ്റിയതുപോലെ എനിക്കും എന്റെ തെറ്റുകൾക്കുമിടയിൽ അകലം വെക്കേണമേ. വെളുത്ത വസ്ത്രം അഴുക്കിൽ നിന്ന് ശുദ്ധീകരിക്കപ്പെടുന്നതുപോലെ എന്റെ തെറ്റുകളിൽ നിന്ന് എന്നെ ശുദ്ധീകരിക്കേണമേ. മഞ്ഞും വെള്ളവും ആലിപ്പഴവും കൊണ്ട് എന്റെ തെറ്റുകളെ കഴുകിക്കളയേണമേ.","O Allah, put distance between me and my sins as You put distance between the east and the west. O Allah, cleanse me of my sins as a white garment is cleansed of dirt. O Allah, wash my sins away with snow, water and hail.")],
    nEn:"Any authentic opening supplication is fine. This one is reported in Bukhari and Muslim.",nMl:"സ്വഹീഹായ ഏത് ആരംഭ പ്രാർത്ഥനയും ചൊല്ലാം. ബുഖാരിയിലും മുസ്‌ലിമിലും ഉള്ളതാണിത്.",nAr:"يجوز أي دعاء استفتاح صحيح، وهذا في الصحيحين."},
  fatiha:{tEn:"Al-Fatiha",tMl:"സൂറത്തുൽ ഫാതിഹ",tAr:"سورة الفاتحة",pose:"stand",lines:[
    L1("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","Bismillaahir-rahmaanir-raheem","പരമകാരുണികനും കരുണാനിധിയുമായ അല്ലാഹുവിന്റെ നാമത്തിൽ.","In the name of Allah, the Most Gracious, the Most Merciful."),
    L1("الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","Alhamdu lillaahi rabbil-aalameen","സർവലോകങ്ങളുടെയും രക്ഷിതാവായ അല്ലാഹുവിന് സർവസ്തുതിയും.","All praise is for Allah, Lord of all the worlds."),
    L1("الرَّحْمَٰنِ الرَّحِيمِ","Ar-rahmaanir-raheem","പരമകാരുണികനും കരുണാനിധിയും.","The Most Gracious, the Most Merciful."),
    L1("مَالِكِ يَوْمِ الدِّينِ","Maaliki yawmid-deen","പ്രതിഫലദിനത്തിന്റെ ഉടമ.","Master of the Day of Judgement."),
    L1("إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","Iyyaaka na\u2019budu wa iyyaaka nasta\u2019een","നിന്നെ മാത്രം ഞങ്ങൾ ആരാധിക്കുന്നു; നിന്നോട് മാത്രം ഞങ്ങൾ സഹായം തേടുന്നു.","You alone we worship, and You alone we ask for help."),
    L1("اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","Ihdinas-siraatal-mustaqeem","ഞങ്ങളെ നീ നേരായ പാതയിൽ നയിക്കേണമേ.","Guide us to the straight path."),
    L1("صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ","Siraatal-lazeena an\u2019amta alayhim, ghayril-maghdoobi alayhim wa lad-daalleen","നീ അനുഗ്രഹിച്ചവരുടെ പാത; കോപത്തിന് ഇരയായവരുടെയോ വഴിതെറ്റിയവരുടെയോ പാതയല്ല.","The path of those You have blessed, not of those who earned anger, nor of those who went astray.")],
    nEn:"Every rak\u2019ah begins with Al-Fatiha.",nMl:"എല്ലാ റക്അത്തിലും ഫാതിഹ ഓതണം.",nAr:"تبدأ كل ركعة بالفاتحة."},

    L1("لَمْ يَلِدْ وَلَمْ يُولَدْ","Lam yalid wa lam yoolad","അവൻ ജനിപ്പിച്ചിട്ടില്ല, ജനിപ്പിക്കപ്പെട്ടിട്ടുമില്ല.","He neither begets nor was born."),

    nEn:"Any surah may be recited. Al-Ikhlas is shown as an example.",nMl:"ഏതു സൂറത്തും ഓതാം. ഉദാഹരണമായി സൂറത്തുൽ ഇഖ്ലാസ് കാണിച്ചിരിക്കുന്നു.",nAr:"يجوز قراءة أي سورة. سورة الإخلاص مثال."},
  ameen:{tEn:"Ameen",tMl:"ആമീൻ",tAr:"التأمين",pose:"stand",lines:[L1("آمِين","Aameen","ആമീൻ.","O Allah, accept.")],nEn:"Say it right after Al-Fatiha: aloud in the loud prayers, quietly in the others.",nMl:"ഫാതിഹക്ക് ശേഷം പറയുക: ഉറക്കെ ഓതുന്ന നമസ്കാരങ്ങളിൽ ഉറക്കെ, മറ്റുള്ളവയിൽ പതുക്കെ.",nAr:"يُقال بعد الفاتحة: جهرًا في الجهرية، وسرًّا في السرية."},
  ruku:{tEn:"Bowing",tMl:"റുകൂഅ്",tAr:"الركوع",pose:"ruku",rep:3,lines:[L1("سُبْحَانَ رَبِّيَ الْعَظِيمِ","Subhaana rabbiyal-azeem","മഹത്വമേറിയ എന്റെ രക്ഷിതാവ് എത്ര പരിശുദ്ധൻ.","Glory be to my Lord, the Magnificent.")],

  sujud:{tEn:"Prostration",tMl:"സുജൂദ്",tAr:"السجود",pose:"sujood",rep:3,lines:[L1("سُبْحَانَ رَبِّيَ الْأَعْلَى","Subhaana rabbiyal-a\u2019laa","അത്യുന്നതനായ എന്റെ രക്ഷിതാവ് എത്ര പരിശുദ്ധൻ.","Glory be to my Lord, the Most High.")],

  sit:{tEn:"Sitting between prostrations",tMl:"സുജൂദുകൾക്കിടയിലെ ഇരുത്തം",tAr:"الجلسة بين السجدتين",pose:"sit",lines:[L1("رَبِّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَارْزُقْنِي وَاهْدِنِي وَعَافِنِي وَاعْفُ عَنِّي","Rabbigh-fir lee warhamnee wajburnee warfa\u2019nee warzuqnee wahdinee wa aafinee wa\u2019fu annee","എന്റെ രക്ഷിതാവേ, എനിക്ക് പൊറുത്തുതരേണമേ, കരുണ കാണിക്കേണമേ, എന്റെ പോരായ്മകൾ നികത്തേണമേ, എന്നെ ഉയർത്തേണമേ, ഉപജീവനം നൽകേണമേ, നേർവഴി കാണിക്കേണമേ, ആരോഗ്യം നൽകേണമേ, എനിക്ക് മാപ്പ് നൽകേണമേ.","My Lord, forgive me, have mercy on me, make up my shortcomings, raise me, provide for me, guide me, grant me well-being, and pardon me.")]},
  tashahhud:{tEn:"Tashahhud",tMl:"തശഹ്ഹുദ്",tAr:"التشهد",pose:"sit",lines:[
    L1("التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ","At-tahiyyaatul-mubaarakaatus-salawaatut-tayyibaatu lillaah","എല്ലാ അഭിവാദ്യങ്ങളും അനുഗ്രഹീത വചനങ്ങളും നമസ്കാരങ്ങളും ശുദ്ധമായ സൽക്കർമങ്ങളും അല്ലാഹുവിനുള്ളതാണ്.","All greetings, blessings, prayers and good deeds belong to Allah."),
    L1("السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ","As-salaamu alayka ayyuhan-nabiyyu wa rahmatullaahi wa barakaatuh, as-salaamu alaynaa wa alaa ibaadillaahis-saaliheen","നബിയേ, അങ്ങയുടെ മേൽ സമാധാനവും അല്ലാഹുവിന്റെ കാരുണ്യവും അനുഗ്രഹങ്ങളും ഉണ്ടാകട്ടെ. ഞങ്ങളുടെ മേലും അല്ലാഹുവിന്റെ സജ്ജനങ്ങളായ ദാസന്മാരുടെ മേലും സമാധാനം ഉണ്ടാകട്ടെ.","Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah."),
    L1("أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","Ash-hadu al-laa ilaaha illallaah, wa ash-hadu anna muhammadan rasoolullaah","അല്ലാഹുവല്ലാതെ ആരാധനയ്ക്ക് അർഹനായി ആരുമില്ലെന്നും മുഹമ്മദ് നബി അല്ലാഹുവിന്റെ ദൂതനാണെന്നും ഞാൻ സാക്ഷ്യം വഹിക്കുന്നു.","I bear witness that there is no god but Allah, and I bear witness that Muhammad is the Messenger of Allah.")],
    nEn:"Raise your right index finger when you say \u201Cillallah\u201D.",nMl:"\u2018ഇല്ലല്ലാഹ്\u2019 എന്ന് പറയുമ്പോൾ വലതു ചൂണ്ടുവിരൽ ഉയർത്തുക.",nAr:"ارفع سبابة اليمنى عند قول «إلا الله»."},
  salawat:{tEn:"Blessings on the Prophet",tMl:"സ്വലാത്ത്",tAr:"الصلاة على النبي",pose:"sit",lines:[
    L1("اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ","Allaahumma salli alaa muhammadin wa alaa aali muhammad, kamaa sallayta alaa ibraaheema wa alaa aali ibraaheem","അല്ലാഹുവേ, ഇബ്രാഹീം നബിയുടെയും കുടുംബത്തിന്റെയും മേൽ നീ അനുഗ്രഹം ചൊരിഞ്ഞതുപോലെ, മുഹമ്മദ് നബിയുടെയും കുടുംബത്തിന്റെയും മേൽ നീ അനുഗ്രഹം ചൊരിയേണമേ.","O Allah, send blessings upon Muhammad and his family as You sent blessings upon Ibrahim and his family."),
    L1("وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ","Wa baarik alaa muhammadin wa alaa aali muhammad, kamaa baarakta alaa ibraaheema wa alaa aali ibraaheem, fil-aalameena innaka hameedun majeed","ഇബ്രാഹീം നബിയുടെയും കുടുംബത്തിന്റെയും മേൽ നീ അഭിവൃദ്ധി നൽകിയതുപോലെ, മുഹമ്മദ് നബിയുടെയും കുടുംബത്തിന്റെയും മേൽ അഭിവൃദ്ധി നൽകേണമേ. തീർച്ചയായും നീ സ്തുത്യർഹനും മഹത്വമുള്ളവനുമാകുന്നു.","And bestow Your favour upon Muhammad and his family as You did upon Ibrahim and his family, in all the worlds. You are indeed Praiseworthy and Glorious.")]},
  refuge:{tEn:"Refuge before the salam",tMl:"സലാമിന് മുമ്പ് അഭയം തേടൽ",tAr:"الاستعاذة قبل السلام",pose:"sit",lines:[L1("اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ","Allaahumma innee a\u2019oodhu bika min \u2019adhaabi jahannam, wa min \u2019adhaabil-qabr, wa min fitnatil-mahyaa wal-mamaat, wa min sharri fitnatil-maseehid-dajjaal","അല്ലാഹുവേ, നരകശിക്ഷയിൽ നിന്നും ഖബർശിക്ഷയിൽ നിന്നും ജീവിതത്തിലെയും മരണത്തിലെയും പരീക്ഷണങ്ങളിൽ നിന്നും മസീഹുദ്ദജ്ജാലിന്റെ കുഴപ്പത്തിന്റെ ദോഷത്തിൽ നിന്നും ഞാൻ നിന്നോട് അഭയം തേടുന്നു.","O Allah, I seek refuge in You from the punishment of Hell, the punishment of the grave, the trials of life and death, and the evil of the trial of the False Messiah.")],nEn:"Then ask Allah for anything you wish before you give the salam.",nMl:"സലാം വീട്ടുന്നതിന് മുമ്പ് ഇഷ്ടമുള്ളത് അല്ലാഹുവോട് ചോദിക്കുക.",nAr:"ثم ادعُ بما شئت قبل أن تسلّم."},

function content(k,p){
  if(k==="niyyah"){
    const n=RAK[p],nm=NAMES[p];
    return {tEn:"Intention",tMl:"നിയ്യത്ത്",tAr:"النية",pose:"stand",lines:[L1(
      "أُصَلِّي فَرْضَ "+ARN[p]+" "+ARC[n]+" مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى",
      NTR[p]+" mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa",
      "ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, "+nm.ml+" ഫർള് നമസ്കാരത്തിലെ "+MLC[n]+" റക്അത്ത് ഞാൻ നിർവഹിക്കുന്നു.",
      "I intend to pray the "+ENC[n]+" rak\u2019ahs of obligatory "+nm.en+", facing the Qibla, for the sake of Allah.")],
      nEn:"The intention is made in the heart. Saying it aloud is not required.",nMl:"നിയ്യത്ത് ഹൃദയത്തിലാണ് ഉറപ്പിക്കേണ്ടത്; ഉച്ചരിക്കേണ്ടതില്ല.",nAr:"تكون النية بالقلب، ولا يلزم النطق بها."};
  }
  if(k==="sujud1"||k==="sujud2"){const c=Object.assign({},BASE.sujud);if(k==="sujud2"){c.tEn="Second prostration";c.tMl="രണ്ടാം സുജൂദ്";c.tAr="السجدة الثانية"}return c}
  return BASE[k];
}

  lines:[L1("أُصَلِّي سُنَّةَ عِيدِ الْأَضْحَى رَكْعَتَيْنِ مُسْتَقْبِلَ الْقِبْلَةِ مَأْمُومًا لِلَّهِ تَعَالَى","Usallee sunnata eedil-adhaa rak\u2019ataini mustaqbilal-qiblati ma\u2019moomam lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, ഇമാമിനെ പിൻപറ്റി, അല്ലാഹുവിനു വേണ്ടി, ഈദുൽ അദ്ഹായുടെ രണ്ട് റക്അത്ത് സുന്നത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the two rak\u2019ahs of the sunnah of Eid al-Adha behind the imam, facing the Qibla, for the sake of Allah.")],
  nt:TL3("There is no adhan or iqamah. The call is \u201cAs-salaatu jaami\u2019ah\u201d.","ബാങ്കും ഇഖാമത്തും ഇല്ല; \u201cഅസ്സ്വലാത്തു ജാമിഅ\u201d എന്ന് വിളിക്കും.","لا أذان ولا إقامة، ويُنادى: «الصلاة جامعة».")}),
eid_x7:XM(TL3("Seven extra takbirs","ഏഴ് അധിക തക്ബീറുകൾ","سبع تكبيرات زائدة"),{rep:7,
  lines:[TKB],
  b:TL3("After the opening supplication and before Al-Fatiha, say Allahu akbar seven times, raising your hands each time.",
        "ഇഫ്തിതാഹ് ദുആക്ക് ശേഷം, ഫാതിഹക്ക് മുമ്പ്, ഓരോ തവണയും കൈകൾ ഉയർത്തി ഏഴ് തവണ \u201cഅല്ലാഹു അക്ബർ\u201d പറയുക. ഓരോ രണ്ട് തക്ബീറിനും ഇടയിൽ ഈ ചെറിയ ദിക്ർ ചൊല്ലുക.",
        "بعد دعاء الافتتاح وقبل الفاتحة كبّر سبع تكبيرات رافعًا يديك مع كل تكبيرة، وقل بين كل تكبيرتين هذا الذكر.")}),
eid_x5:XM(TL3("Five extra takbirs","അഞ്ച് അധിക തക്ബീറുകൾ","خمس تكبيرات زائدة"),{rep:5,
  lines:[TKB],
  b:TL3("After standing up for the second rak\u2019ah and before Al-Fatiha, say Allahu akbar five times.",
        "രണ്ടാം റക്അത്തിനായി എഴുന്നേറ്റ ശേഷം, ഫാതിഹക്ക് മുമ്പ്, അഞ്ച് തവണ \u201cഅല്ലാഹു അക്ബർ\u201d പറയുക; ഇടയിൽ അതേ ദിക്ർ ചൊല്ലുക.",
        "بعد القيام للركعة الثانية وقبل الفاتحة كبّر خمس تكبيرات، وقل بينها الذكر نفسه.")}),
sur_eid:XM(TL3("A surah","സൂറത്ത്","سورة"),{pose:"info",
  b:TL3("Recite a surah after Al-Fatiha. The sunnah is Surah Qaf in the first rak\u2019ah and Surah Al-Qamar in the second (or Al-A\u2019la and Al-Ghashiyah).",
        "ഫാതിഹക്ക് ശേഷം ഒരു സൂറത്ത് ഓതുക. ഒന്നാം റക്അത്തിൽ സൂറത്ത് ഖാഫും രണ്ടാമത്തേതിൽ സൂറത്തുൽ ഖമറും ഓതുന്നത് സുന്നത്താണ് (അല്ലെങ്കിൽ അൽ അഅ്‌ലയും അൽ ഗാശിയയും).",
        "اقرأ سورة بعد الفاتحة. والسنة قراءة سورة ق في الأولى وسورة القمر في الثانية (أو الأعلى والغاشية).")}),
eid_khutbah:XM(TL3("The khutbah","ഖുത്ബ","الخطبة"),{pose:"info",
  lines:[L1("تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكُمْ","Taqabbalallaahu minnaa wa minkum","അല്ലാഹു ഞങ്ങളിൽ നിന്നും നിങ്ങളിൽ നിന്നും സ്വീകരിക്കട്ടെ.","May Allah accept it from us and from you.")],
  b:TL3("After the prayer the imam gives two sermons. Listening is sunnah. Greet one another with the words below.",
        "നമസ്കാരത്തിന് ശേഷം ഇമാം രണ്ട് ഖുത്ബകൾ നടത്തും. ഒന്നാമത്തേത് ഒമ്പത് തക്ബീറോടെയും രണ്ടാമത്തേത് ഏഴ് തക്ബീറോടെയും തുടങ്ങും. ശ്രദ്ധിച്ച് കേൾക്കുന്നത് സുന്നത്താണ്. താഴെ കൊടുത്ത വാക്കുകളാൽ പരസ്പരം ആശംസിക്കുക.",
        "بعد الصلاة يخطب الإمام خطبتين، يفتتح الأولى بتسع تكبيرات والثانية بسبع. والاستماع سنة. وتبادلوا التهنئة بالعبارة التالية.")}),
/* ---- Janazah ---- */
jz_info:XM(TL3("Before the prayer","നമസ്കാരത്തിന് മുമ്പ്","قبل الصلاة"),{pose:"info",
  b:TL3("The deceased is bathed and shrouded first. The imam stands by the head of a man, or the middle of a woman, and everyone stands in rows behind him. The prayer is entirely standing, with four takbirs and no bowing or prostration.",
        "ആദ്യം മയ്യിത്ത് കുളിപ്പിച്ച് കഫൻ ചെയ്യുന്നു. ഇമാം പുരുഷന്റെ തലക്കൽ, സ്ത്രീയാണെങ്കിൽ ശരീരത്തിന്റെ മധ്യത്തിൽ നിൽക്കും; എല്ലാവരും സ്വഫ്ഫുകളായി പിന്നിൽ നിൽക്കും. നമസ്കാരം പൂർണമായും നിന്നുകൊണ്ടാണ്, നാല് തക്ബീറോടെ, റുകൂഅും സുജൂദും ഇല്ലാതെ.",
        "يُغسَّل الميت ويُكفَّن أولًا. يقف الإمام عند رأس الرجل ووسط المرأة، ويصطف الناس خلفه. الصلاة كلها قيام بأربع تكبيرات، بلا ركوع ولا سجود.")}),
niy_jz:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي عَلَى هَذَا الْمَيِّتِ أَرْبَعَ تَكْبِيرَاتٍ فَرْضَ كِفَايَةٍ مَأْمُومًا لِلَّهِ تَعَالَى","Usallee alaa haadhal-mayyiti arba\u2019a takbeeraatin farda kifaayatin ma\u2019moomam lillaahi ta\u2019aalaa","ഈ മയ്യിത്തിന് വേണ്ടി, ഇമാമിനെ പിൻപറ്റി, അല്ലാഹുവിനു വേണ്ടി, നാല് തക്ബീറോടെ ഫർള് കിഫായ ആയ നമസ്കാരം ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray, behind the imam and for the sake of Allah, the four-takbir funeral prayer for this deceased man, a communal obligation."),
         L1("أُصَلِّي عَلَى هَذِهِ الْمَيِّتَةِ أَرْبَعَ تَكْبِيرَاتٍ فَرْضَ كِفَايَةٍ مَأْمُومًا لِلَّهِ تَعَالَى","Usallee alaa haadhihil-mayyitati arba\u2019a takbeeraatin farda kifaayatin ma\u2019moomam lillaahi ta\u2019aalaa","ഈ മയ്യിത്തിന് (സ്ത്രീ) വേണ്ടി, ഇമാമിനെ പിൻപറ്റി, അല്ലാഹുവിനു വേണ്ടി, നാല് തക്ബീറോടെ ഫർള് കിഫായ ആയ നമസ്കാരം ഞാൻ നിർവഹിക്കുന്നു.","The same intention for a deceased woman.")],
  nt:TL3("Use the first for a man and the second for a woman.","പുരുഷനാണെങ്കിൽ ആദ്യത്തേത്, സ്ത്രീയാണെങ്കിൽ രണ്ടാമത്തേത് ഉപയോഗിക്കുക.","الأولى للرجل والثانية للمرأة.")}),
jz_1:XM(TL3("First takbir and Al-Fatiha","ഒന്നാം തക്ബീറും ഫാതിഹയും","التكبيرة الأولى والفاتحة"),{lines:[TKB].concat(BASE.fatiha.lines),
  nt:TL3("Say the takbir with your hands raised, fold them over your chest, then recite Al-Fatiha quietly.","കൈകൾ ഉയർത്തി തക്ബീർ പറഞ്ഞ് നെഞ്ചിനു മുകളിൽ കെട്ടി, പതുക്കെ ഫാതിഹ ഓതുക.","كبّر رافعًا يديك، وضعهما على صدرك، ثم اقرأ الفاتحة سرًّا.")}),
jz_2:XM(TL3("Second takbir and blessings on the Prophet","രണ്ടാം തക്ബീറും നബിയുടെ മേൽ സ്വലാത്തും","التكبيرة الثانية والصلاة على النبي"),{lines:[TKB].concat(BASE.salawat.lines),
  nt:TL3("Raise your hands for each takbir. At least \u201cAllaahumma salli alaa muhammad\u201d is required.","ഓരോ തക്ബീറിനും കൈകൾ ഉയർത്തുക. കുറഞ്ഞത് \u201cഅല്ലാഹുമ്മ സ്വല്ലി അലാ മുഹമ്മദ്\u201d നിർബന്ധമാണ്.","ارفع يديك مع كل تكبيرة. ويجب على الأقل «اللهم صلِّ على محمد».")}),
jz_3:XM(TL3("Third takbir and dua for the deceased","മൂന്നാം തക്ബീറും മയ്യിത്തിനുള്ള ദുആയും","التكبيرة الثالثة والدعاء للميت"),{lines:[TKB,
  L1("اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ، وَأَدْخِلْهُ الْجَنَّةَ وَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ النَّارِ",
     "Allaahummagh-fir lahu warhamhu wa aafihi wa\u2019fu anhu, wa akrim nuzulahu wa wassi\u2019 mudkhalahu, waghsilhu bilmaa\u2019i wath-thalji wal-barad, wa naqqihi minal-khataayaa kamaa naqqaytath-thawbal-abyada minad-danas, wa abdilhu daaran khayran min daarihi wa ahlan khayran min ahlihi wa zawjan khayran min zawjihi, wa adkhilhul-jannata wa a\u2019idhhu min adhaabil-qabri wa min adhaabin-naar",
     "അല്ലാഹുവേ, അദ്ദേഹത്തിന് പൊറുത്തുകൊടുക്കേണമേ, കരുണ ചെയ്യേണമേ, ആരോഗ്യം നൽകേണമേ, മാപ്പ് നൽകേണമേ. അദ്ദേഹത്തിന്റെ ആതിഥ്യം മാന്യമാക്കേണമേ, പ്രവേശന സ്ഥലം വിശാലമാക്കേണമേ. വെള്ളം, മഞ്ഞ്, ആലിപ്പഴം എന്നിവ കൊണ്ട് അദ്ദേഹത്തെ കഴുകേണമേ; വെളുത്ത വസ്ത്രം അഴുക്കിൽ നിന്ന് ശുദ്ധമാക്കുന്നതുപോലെ പാപങ്ങളിൽ നിന്ന് ശുദ്ധീകരിക്കേണമേ. അദ്ദേഹത്തിന്റെ വീടിനേക്കാൾ നല്ല വീടും, കുടുംബത്തേക്കാൾ നല്ല കുടുംബവും, ഇണയേക്കാൾ നല്ല ഇണയും നൽകേണമേ. അദ്ദേഹത്തെ സ്വർഗത്തിൽ പ്രവേശിപ്പിക്കേണമേ; ഖബ്ർ ശിക്ഷയിൽ നിന്നും നരക ശിക്ഷയിൽ നിന്നും കാക്കേണമേ.",
     "O Allah, forgive him, have mercy on him, give him well-being and pardon him. Honour his resting place and make his entrance spacious. Wash him with water, snow and hail, and cleanse him of sins as a white garment is cleansed of dirt. Give him a home better than his home, a family better than his family and a spouse better than his spouse. Admit him to Paradise and protect him from the punishment of the grave and the punishment of the Fire."),
  L1("اللَّهُمَّ اغْفِرْ لَهَا وَارْحَمْهَا وَعَافِهَا وَاعْفُ عَنْهَا","Allaahummagh-fir lahaa warhamhaa wa aafihaa wa\u2019fu anhaa","അല്ലാഹുവേ, അവർക്ക് പൊറുത്തുകൊടുക്കേണമേ, കരുണ ചെയ്യേണമേ, ആരോഗ്യം നൽകേണമേ, മാപ്പ് നൽകേണമേ.","O Allah, forgive her, have mercy on her, give her well-being and pardon her.")],
  nt:TL3("For a woman, use the feminine forms (lahaa, anhaa and so on) throughout the dua.","സ്ത്രീക്ക് വേണ്ടിയാണെങ്കിൽ ദുആയിൽ ഉടനീളം സ്ത്രീലിംഗ രൂപങ്ങൾ (ലഹാ, അൻഹാ തുടങ്ങിയവ) ഉപയോഗിക്കുക.","للمرأة استعمل صيغ المؤنث (لها، عنها وهكذا) في الدعاء كله.")}),
jz_child:XM(TL3("Dua for a child (instead)","കുട്ടിക്കുള്ള ദുആ (പകരം)","دعاء الطفل (بدلًا منه)"),{lines:[
  L1("اللَّهُمَّ اجْعَلْهُ فَرَطًا لِأَبَوَيْهِ، وَسَلَفًا وَذُخْرًا، وَعِظَةً وَاعْتِبَارًا وَشَفِيعًا، وَثَقِّلْ بِهِ مَوَازِينَهُمَا، وَأَفْرِغِ الصَّبْرَ عَلَى قُلُوبِهِمَا، وَلَا تَفْتِنْهُمَا بَعْدَهُ، وَلَا تَحْرِمْهُمَا أَجْرَهُ",
     "Allaahummaj-alhu faratan li-abawayhi, wa salafan wa dhukhran, wa \u2019izatan wa i\u2019tibaaran wa shafee\u2019an, wa thaqqil bihi mawaazeenahumaa, wa afrighis-sabra alaa quloobihimaa, wa laa taftinhumaa ba\u2019dahu, wa laa tahrimhumaa ajrahu",
     "അല്ലാഹുവേ, ഇവനെ ഇവന്റെ മാതാപിതാക്കൾക്ക് മുൻഗാമിയും നിക്ഷേപവും ഗുണപാഠവും ഉദാഹരണവും ശുപാർശകനുമാക്കേണമേ. ഇവൻ കാരണം അവരുടെ തുലാസുകൾ ഭാരമുള്ളതാക്കേണമേ, അവരുടെ ഹൃദയങ്ങളിൽ ക്ഷമ ചൊരിയേണമേ, ഇവനു ശേഷം അവരെ പരീക്ഷിക്കരുതേ, ഇവന്റെ പ്രതിഫലം അവർക്ക് നിഷേധിക്കരുതേ.",
     "O Allah, make him a forerunner for his parents, a treasure and a lesson, an example and an intercessor. Make their scales heavy because of him, pour patience into their hearts, do not test them after him and do not deprive them of his reward.")],
  nt:TL3("Say this at the third takbir when the deceased is a child.","മയ്യിത്ത് കുട്ടിയാണെങ്കിൽ മൂന്നാം തക്ബീറിൽ ഇത് ചൊല്ലുക.","إذا كان الميت طفلًا فقل هذا عند التكبيرة الثالثة.")}),
jz_4:XM(TL3("Fourth takbir and closing dua","നാലാം തക്ബീറും സമാപന ദുആയും","التكبيرة الرابعة والدعاء الختامي"),{lines:[TKB,
  L1("اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُ وَلَا تَفْتِنَّا بَعْدَهُ وَاغْفِرْ لَنَا وَلَهُ","Allaahumma laa tahrimnaa ajrahu wa laa taftinnaa ba\u2019dahu waghfir lanaa wa lahu","അല്ലാഹുവേ, അദ്ദേഹത്തിന്റെ പ്രതിഫലം ഞങ്ങൾക്ക് നിഷേധിക്കരുതേ, അദ്ദേഹത്തിനു ശേഷം ഞങ്ങളെ പരീക്ഷിക്കരുതേ, ഞങ്ങൾക്കും അദ്ദേഹത്തിനും പൊറുത്തുതരേണമേ.","O Allah, do not deprive us of his reward, do not test us after him, and forgive us and him.")]}),
/* ---- in congregation ---- */
jm_1:XM(TL3("Intend to follow the imam","ഇമാമിനെ പിൻപറ്റാൻ നിയ്യത്ത്","نيّة الاقتداء بالإمام"),{
  lines:[L1("أُصَلِّي فَرْضَ الظُّهْرِ أَرْبَعَ رَكَعَاتٍ مُسْتَقْبِلَ الْقِبْلَةِ مَأْمُومًا لِلَّهِ تَعَالَى","Usallee fardaz-zuhri arba\u2019a raka\u2019aatin mustaqbilal-qiblati ma\u2019moomam lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, ഇമാമിനെ പിൻപറ്റി, അല്ലാഹുവിനു വേണ്ടി, ളുഹ്ർ ഫർളിന്റെ നാല് റക്അത്ത് ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the four rak\u2019ahs of obligatory Dhuhr behind the imam, facing the Qibla, for the sake of Allah.")],
  b:TL3("Add \u201cma\u2019moomam\u201d (following the imam) to your usual intention. Dhuhr is shown as an example.","നിങ്ങളുടെ സാധാരണ നിയ്യത്തിനൊപ്പം \u201cമഅ്മൂമൻ\u201d (ഇമാമിനെ പിൻപറ്റി) ചേർക്കുക. ഉദാഹരണമായി ളുഹ്ർ കാണിച്ചിരിക്കുന്നു.","أضف «مأمومًا» (مقتديًا بالإمام) إلى نيتك المعتادة. والظهر مثال.")}),
jm_2:XM(TL3("Straighten the rows","സ്വഫ്ഫുകൾ നേരെയാക്കുക","تسوية الصفوف"),{
  lines:[L1("سَوُّوا صُفُوفَكُمْ فَإِنَّ تَسْوِيَةَ الصُّفُوفِ مِنْ تَمَامِ الصَّلَاةِ","Sawwoo sufoofakum fa-inna taswiyatas-sufoofi min tamaamis-salaah","നിങ്ങളുടെ സ്വഫ്ഫുകൾ നേരെയാക്കുക; സ്വഫ്ഫുകൾ നേരെയാക്കുന്നത് നമസ്കാരത്തിന്റെ പൂർണതയിൽ പെട്ടതാണ്.","Straighten your rows, for straightening the rows is part of perfecting the prayer.")],
  b:TL3("Stand shoulder to shoulder, close the gaps and complete the front row first.","തോളോട് തോൾ ചേർന്ന് നിൽക്കുക, വിടവുകൾ നികത്തുക, ആദ്യം മുൻ സ്വഫ്ഫ് പൂർത്തിയാക്കുക.","قف كتفًا بكتف، وسدّ الفُرَج، وأتمّ الصف الأول أولًا.")}),
jm_3:XM(TL3("Follow the imam","ഇമാമിനെ പിൻപറ്റുക","متابعة الإمام"),{
  lines:[L1("إِنَّمَا جُعِلَ الْإِمَامُ لِيُؤْتَمَّ بِهِ","Innamaa ju\u2019ilal-imaamu liyu\u2019tamma bih","ഇമാമിനെ പിൻപറ്റാൻ വേണ്ടിയാണ് അദ്ദേഹത്തെ നിശ്ചയിച്ചിരിക്കുന്നത്.","The imam is appointed to be followed.")],
  b:TL3("Never move before the imam; begin each movement just after him. Say Ameen aloud with him after Al-Fatiha in the loud prayers, and recite Al-Fatiha yourself in the quiet prayers.","ഇമാമിന് മുമ്പ് ഒരിക്കലും ചലിക്കരുത്; ഓരോ ചലനവും അദ്ദേഹത്തിന് തൊട്ടുപിന്നാലെ തുടങ്ങുക. ഉച്ചത്തിൽ ഓതുന്ന നമസ്കാരങ്ങളിൽ ഫാതിഹക്ക് ശേഷം അദ്ദേഹത്തോടൊപ്പം ഉച്ചത്തിൽ ആമീൻ പറയുക; പതുക്കെ ഓതുന്ന നമസ്കാരങ്ങളിൽ ഫാതിഹ സ്വയം ഓതുക.","لا تسبق الإمام، وابدأ كل حركة بعده مباشرة. قل «آمين» جهرًا معه بعد الفاتحة في الصلوات الجهرية، واقرأ الفاتحة بنفسك في الصلوات السرية.")}),
jm_4:XM(TL3("If you arrive late","تാമസിച്ച് എത്തിയാൽ","إذا جئت متأخرًا"),{pose:"info",
  b:TL3("Join the imam in whatever position he is in, saying the opening takbir while standing. You gain the rak\u2019ah if you reach the bowing with the imam and are calm in it. When the imam finishes with the salam, stand up and complete what you missed.","ഇമാം ഏത് അവസ്ഥയിലാണോ അതിൽ ചേരുക; നിന്നുകൊണ്ട് തക്ബീറത്തുൽ ഇഹ്റാം ചൊല്ലുക. ഇമാമിനൊപ്പം റുകൂഅ് ലഭിക്കുകയും അതിൽ ശാന്തത പാലിക്കുകയും ചെയ്താൽ ആ റക്അത്ത് ലഭിച്ചു. ഇമാം സലാം വീട്ടിയ ശേഷം എഴുന്നേറ്റ് നഷ്ടപ്പെട്ടത് പൂർത്തിയാക്കുക.","انضم إلى الإمام في أي حال كان، وكبّر تكبيرة الإحرام قائمًا. تُدرك الركعة إذا أدركت الركوع مع الإمام واطمأننت فيه. وإذا سلّم الإمام فقم وأتمّ ما فاتك.")}),
/* ---- travel: qasr ---- */
qs_1:XM(TL3("When may you shorten?","എപ്പോൾ ചുരുക്കാം?","متى يجوز القصر؟"),{pose:"info",
  b:TL3("You are a traveller once you leave the boundary of your city on a journey of at least 48 miles (77 km), and you plan to stay at your destination for fewer than 15 full days. In that case Dhuhr, Asr and Isha are prayed as two rak’ahs; Fajr and Maghrib stay the same.",
        "നിങ്ങളുടെ നഗരത്തിന്റെ അതിർത്തി കടന്ന്, കുറഞ്ഞത് 48 മൈൽ (77 കി.മീ.) ദൂരമുള്ള യാത്ര ഉദ്ദേശിക്കുകയും, എത്തുന്നിടത്ത് 15 പൂർണ ദിവസത്തിൽ കുറവ് താമസിക്കാൻ ഉദ്ദേശിക്കുകയും ചെയ്താൽ നിങ്ങൾ യാത്രക്കാരനാണ്. അപ്പോൾ ളുഹ്ർ, അസ്ർ, ഇശാ എന്നിവ രണ്ട് റക്അത്തായി നമസ്കരിക്കണം; സുബ്ഹിയും മഗ്‌രിബും മാറ്റമില്ലാതെ തുടരും.",
        "تكون مسافرًا إذا خرجت من حدود مدينتك قاصدًا سفرًا لا يقل عن ٤٨ ميلًا (٧٧ كم)، ونويت الإقامة في وجهتك أقل من خمسة عشر يومًا كاملة. فتصلي الظهر والعصر والعشاء ركعتين، ولا يتغير الفجر والمغرب."),
  nt:TL3("This follows the Hanafi view. Scholars differ on the exact distance, so follow a scholar you trust.","ഇത് ഹനഫീ അഭിപ്രായമനുസരിച്ചാണ്. ദൂരത്തിൽ പണ്ഡിതർക്കിടയിൽ വ്യത്യാസമുണ്ട്, അതിനാൽ നിങ്ങൾ വിശ്വസിക്കുന്ന പണ്ഡിതനെ പിന്തുടരുക.","هذا وفق المذهب الحنفي، وتختلف المسافة بين العلماء، فاتبع عالمًا تثق به.")}),
qs_2:XM(TL3("How long?","എത്ര കാലം?","إلى متى؟"),{pose:"info",
  b:TL3("Shorten for as long as you plan to stay at your destination for fewer than 15 full days. If you plan to stay 15 full days or more, pray in full there; on the journey itself you still shorten. Once you re-enter your own city boundary you are no longer a traveller, so pray in full.",
        "ലക്ഷ്യസ്ഥാനത്ത് 15 പൂർണ ദിവസത്തിൽ കുറവ് താമസിക്കാനാണ് ഉദ്ദേശമെങ്കിൽ ചുരുക്കി നമസ്കരിക്കണം. 15 പൂർണ ദിവസമോ അതിൽ കൂടുതലോ താമസിക്കാൻ ഉദ്ദേശിച്ചാൽ അവിടെ പൂർണമായി നമസ്കരിക്കണം; യാത്രയ്ക്കിടയിൽ ചുരുക്കുക തന്നെ വേണം. സ്വന്തം നഗരത്തിന്റെ അതിർത്തിക്കുള്ളിൽ തിരിച്ചെത്തിയാൽ നിങ്ങൾ യാത്രക്കാരനല്ല; പൂർണമായി നമസ്കരിക്കണം.",
        "اقصر ما دمت تنوي الإقامة في وجهتك أقل من خمسة عشر يومًا كاملة. فإن نويت إقامة خمسة عشر يومًا فأكثر أتممت هناك، وتقصر أثناء الطريق. وإذا دخلت حدود مدينتك لم تعد مسافرًا فصلِّ كاملة.")}),
qs_3:XM(TL3("Intention","നിയ്യത്ത്","النية"),{
  lines:[L1("أُصَلِّي فَرْضَ الظُّهْرِ رَكْعَتَيْنِ قَصْرًا مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee fardaz-zuhri rak\u2019ataini qasran mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ളുഹ്ർ ഫർളിന്റെ രണ്ട് റക്അത്ത് ചുരുക്കി ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the two rak\u2019ahs of obligatory Dhuhr, shortened, facing the Qibla, for the sake of Allah."),
         L1("أُصَلِّي فَرْضَ الْعَصْرِ رَكْعَتَيْنِ قَصْرًا مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee fardal-asri rak\u2019ataini qasran mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, അസ്ർ ഫർളിന്റെ രണ്ട് റക്അത്ത് ചുരുക്കി ഞാൻ നിർവഹിക്കുന്നു.","The same for Asr."),
         L1("أُصَلِّي فَرْضَ الْعِشَاءِ رَكْعَتَيْنِ قَصْرًا مُسْتَقْبِلَ الْقِبْلَةِ أَدَاءً لِلَّهِ تَعَالَى","Usallee fardal-ishaa\u2019i rak\u2019ataini qasran mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa","ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, ഇശാ ഫർളിന്റെ രണ്ട് റക്അത്ത് ചുരുക്കി ഞാൻ നിർവഹിക്കുന്നു.","The same for Isha.")],
  nt:TL3("Make the intention to shorten at the opening takbir. The three lines are for Dhuhr, Asr and Isha.","ചുരുക്കുന്നതിനുള്ള നിയ്യത്ത് തക്ബീറത്തുൽ ഇഹ്റാമിൽ ചെയ്യുക. മൂന്ന് വരികൾ ളുഹ്ർ, അസ്ർ, ഇശാ എന്നിവയ്ക്കാണ്.","انوِ القصر عند تكبيرة الإحرام. والأسطر الثلاثة للظهر والعصر والعشاء.")}),
/* ---- travel: jam’ taqdim ---- */
jt_1:XM(TL3("Conditions","നിബന്ധനകൾ","الشروط"),{pose:"info",
  b:TL3("While travelling (the same distance as for shortening) you may pray Asr together with Dhuhr in Dhuhr\u2019s time, or Isha together with Maghrib in Maghrib\u2019s time. Pray the earlier prayer first, intend to combine during it, and pray the second straight after without a long gap.",
        "യാത്രയിൽ (ചുരുക്കുന്നതിനുള്ള അതേ ദൂരം) ളുഹ്റിന്റെ സമയത്ത് ളുഹ്റിനൊപ്പം അസ്റും, മഗ്‌രിബിന്റെ സമയത്ത് മഗ്‌രിബിനൊപ്പം ഇശായും നമസ്കരിക്കാം. ആദ്യ നമസ്കാരം ആദ്യം നമസ്കരിക്കുക, അതിനിടയിൽ ചേർക്കാൻ നിയ്യത്ത് ചെയ്യുക, ദീർഘമായ ഇടവേളയില്ലാതെ രണ്ടാമത്തേത് തുടർന്ന് നമസ്കരിക്കുക.",
        "في السفر (بالمسافة نفسها للقصر) يجوز أن تصلي العصر مع الظهر في وقت الظهر، أو العشاء مع المغرب في وقت المغرب. صلِّ الأولى أولًا وانوِ الجمع أثناءها، وصلِّ الثانية بعدها مباشرة دون فاصل طويل.")}),
jt_2:XM(TL3("Intention for the first prayer","ആദ്യ നമസ്കാരത്തിനുള്ള നിയ്യത്ത്","نيّة الصلاة الأولى"),{
  lines:[L1("أُصَلِّي فَرْضَ الظُّهْرِ أَرْبَعَ رَكَعَاتٍ مَجْمُوعًا مَعَ الْعَصْرِ جَمْعَ تَقْدِيمٍ لِلَّهِ تَعَالَى","Usallee fardaz-zuhri arba\u2019a raka\u2019aatin majmoo\u2019an ma\u2019al-asri jam\u2019a taqdeemin lillaahi ta\u2019aalaa","ളുഹ്ർ ഫർളിന്റെ നാല് റക്അത്ത്, അസ്റിനോടൊപ്പം ജംഅ് തഖ്ദീമായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the four rak\u2019ahs of obligatory Dhuhr, combined early with Asr, for the sake of Allah."),
         L1("أُصَلِّي فَرْضَ الْمَغْرِبِ ثَلَاثَ رَكَعَاتٍ مَجْمُوعًا مَعَ الْعِشَاءِ جَمْعَ تَقْدِيمٍ لِلَّهِ تَعَالَى","Usallee fardal-maghribi thalaatha raka\u2019aatin majmoo\u2019an ma\u2019al-ishaa\u2019i jam\u2019a taqdeemin lillaahi ta\u2019aalaa","മഗ്‌രിബ് ഫർളിന്റെ മൂന്ന് റക്അത്ത്, ഇശായോടൊപ്പം ജംഅ് തഖ്ദീമായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","The same for Maghrib, combined early with Isha.")],
  nt:TL3("You may also make the intention to combine at any point before the salam of the first prayer.","ആദ്യ നമസ്കാരത്തിന്റെ സലാമിന് മുമ്പ് ഏത് ഘട്ടത്തിലും ചേർക്കാനുള്ള നിയ്യത്ത് ചെയ്യാം.","ويجوز أيضًا أن تنوي الجمع في أي لحظة قبل سلام الصلاة الأولى.")}),
jt_3:XM(TL3("Pray the first prayer","ആദ്യ നമസ്കാരം നമസ്കരിക്കുക","صلِّ الصلاة الأولى"),{pose:"info",
  b:TL3("Pray Dhuhr (or Maghrib) as usual and end it with the salam. You may shorten Dhuhr to two rak\u2019ahs if you wish; see the Qasr guide.",
        "ളുഹ്ർ (അല്ലെങ്കിൽ മഗ്‌രിബ്) സാധാരണ പോലെ നമസ്കരിച്ച് സലാം വീട്ടുക. താൽപര്യമുണ്ടെങ്കിൽ ളുഹ്ർ രണ്ട് റക്അത്തായി ചുരുക്കാം; ഖസ്ർ ഗൈഡ് കാണുക.",
        "صلِّ الظهر (أو المغرب) كالمعتاد واختمها بالسلام. ويجوز قصر الظهر إلى ركعتين إن شئت؛ راجع دليل القصر.")}),
jt_4:XM(TL3("Then the second prayer","പിന്നെ രണ്ടാമത്തെ നമസ്കാരം","ثم الصلاة الثانية"),{
  lines:[L1("أُصَلِّي فَرْضَ الْعَصْرِ أَرْبَعَ رَكَعَاتٍ مَجْمُوعًا مَعَ الظُّهْرِ جَمْعَ تَقْدِيمٍ لِلَّهِ تَعَالَى","Usallee fardal-asri arba\u2019a raka\u2019aatin majmoo\u2019an ma\u2019az-zuhri jam\u2019a taqdeemin lillaahi ta\u2019aalaa","അസ്ർ ഫർളിന്റെ നാല് റക്അത്ത്, ളുഹ്റിനോടൊപ്പം ജംഅ് തഖ്ദീമായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the four rak\u2019ahs of obligatory Asr, combined early with Dhuhr, for the sake of Allah."),
         L1("أُصَلِّي فَرْضَ الْعِشَاءِ أَرْبَعَ رَكَعَاتٍ مَجْمُوعًا مَعَ الْمَغْرِبِ جَمْعَ تَقْدِيمٍ لِلَّهِ تَعَالَى","Usallee fardal-ishaa\u2019i arba\u2019a raka\u2019aatin majmoo\u2019an ma\u2019al-maghribi jam\u2019a taqdeemin lillaahi ta\u2019aalaa","ഇശാ ഫർളിന്റെ നാല് റക്അത്ത്, മഗ്‌രിബിനോടൊപ്പം ജംഅ് തഖ്ദീമായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","The same for Isha, combined early with Maghrib.")],
  nt:TL3("Stand up and pray it straight away. Do not leave a long gap between the two prayers.","ഉടൻ എഴുന്നേറ്റ് നമസ്കരിക്കുക. രണ്ട് നമസ്കാരങ്ങൾക്കിടയിൽ ദീർഘമായ ഇടവേള വരുത്തരുത്.","قم فصلِّها مباشرة. ولا تترك فاصلًا طويلًا بين الصلاتين.")}),
/* ---- travel: jam’ ta’khir ---- */
jk_1:XM(TL3("Conditions","നിബന്ധനകൾ","الشروط"),{pose:"info",
  b:TL3("While travelling you may delay Dhuhr and pray it with Asr in Asr\u2019s time, or delay Maghrib and pray it with Isha in Isha\u2019s time. You must make the intention to delay while the first prayer\u2019s time is still running, and you must still be a traveller until both prayers are finished.",
        "യാത്രയിൽ ളുഹ്ർ വൈകിച്ച് അസ്‌റിന്റെ സമയത്ത് അസ്‌റിനൊപ്പം, അല്ലെങ്കിൽ മഗ്‌രിബ് വൈകിച്ച് ഇശായുടെ സമയത്ത് ഇശായോടൊപ്പം നമസ്കരിക്കാം. ആദ്യ നമസ്കാരത്തിന്റെ സമയം ബാക്കിയുള്ളപ്പോൾ തന്നെ വൈകിക്കാനുള്ള നിയ്യത്ത് ചെയ്യണം; രണ്ട് നമസ്കാരവും കഴിയുന്നതുവരെ യാത്രക്കാരനായി തുടരുകയും വേണം.",
        "في السفر يجوز تأخير الظهر وصلاتها مع العصر في وقت العصر، أو تأخير المغرب وصلاتها مع العشاء في وقت العشاء. ويجب أن تنوي التأخير والوقت الأول لا يزال قائمًا، وأن تبقى مسافرًا حتى تنتهي الصلاتان.")}),
jk_2:XM(TL3("Intend to delay","വൈകിക്കാൻ നിയ്യത്ത്","نيّة التأخير"),{
  lines:[L1("نَوَيْتُ تَأْخِيرَ صَلَاةِ الظُّهْرِ إِلَى وَقْتِ الْعَصْرِ لِأَجْمَعَهَا مَعَهَا","Nawaytu ta\u2019kheera salaatiz-zuhri ilaa waqtil-asri li-ajma\u2019ahaa ma\u2019ahaa","ളുഹ്ർ നമസ്കാരം അസ്ർ സമയത്തേക്ക് വൈകിച്ച് അതിനോടൊപ്പം ചേർത്ത് നമസ്കരിക്കാൻ ഞാൻ നിയ്യത്ത് ചെയ്യുന്നു.","I intend to delay Dhuhr until Asr\u2019s time, to combine it with Asr."),
         L1("نَوَيْتُ تَأْخِيرَ صَلَاةِ الْمَغْرِبِ إِلَى وَقْتِ الْعِشَاءِ لِأَجْمَعَهَا مَعَهَا","Nawaytu ta\u2019kheera salaatil-maghribi ilaa waqtil-ishaa\u2019i li-ajma\u2019ahaa ma\u2019ahaa","മഗ്‌രിബ് നമസ്കാരം ഇശാ സമയത്തേക്ക് വൈകിച്ച് അതിനോടൊപ്പം ചേർത്ത് നമസ്കരിക്കാൻ ഞാൻ നിയ്യത്ത് ചെയ്യുന്നു.","The same for Maghrib, delayed to Isha\u2019s time.")],
  nt:TL3("It is the intention in the heart that counts; this is a common wording. Make it before the first prayer\u2019s time ends.","ഹൃദയത്തിലെ നിയ്യത്താണ് പ്രധാനം; ഇത് സാധാരണ ഉപയോഗിക്കുന്ന വാക്കുകളാണ്. ആദ്യ നമസ്കാരത്തിന്റെ സമയം തീരുന്നതിന് മുമ്പ് ഇത് ചെയ്യുക.","المعتبر هو النية في القلب، وهذه صيغة شائعة. اجعلها قبل خروج وقت الصلاة الأولى.")}),
jk_3:XM(TL3("Pray the first prayer","ആദ്യ നമസ്കാരം നമസ്കരിക്കുക","صلِّ الصلاة الأولى"),{
  lines:[L1("أُصَلِّي فَرْضَ الظُّهْرِ أَرْبَعَ رَكَعَاتٍ مَجْمُوعًا مَعَ الْعَصْرِ جَمْعَ تَأْخِيرٍ لِلَّهِ تَعَالَى","Usallee fardaz-zuhri arba\u2019a raka\u2019aatin majmoo\u2019an ma\u2019al-asri jam\u2019a ta\u2019kheerin lillaahi ta\u2019aalaa","ളുഹ്ർ ഫർളിന്റെ നാല് റക്അത്ത്, അസ്റിനോടൊപ്പം ജംഅ് തഅ്ഖീറായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the four rak\u2019ahs of obligatory Dhuhr, combined late with Asr, for the sake of Allah."),
         L1("أُصَلِّي فَرْضَ الْمَغْرِبِ ثَلَاثَ رَكَعَاتٍ مَجْمُوعًا مَعَ الْعِشَاءِ جَمْعَ تَأْخِيرٍ لِلَّهِ تَعَالَى","Usallee fardal-maghribi thalaatha raka\u2019aatin majmoo\u2019an ma\u2019al-ishaa\u2019i jam\u2019a ta\u2019kheerin lillaahi ta\u2019aalaa","മഗ്‌രിബ് ഫർളിന്റെ മൂന്ന് റക്അത്ത്, ഇശായോടൊപ്പം ജംഅ് തഅ്ഖീറായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","The same for Maghrib, combined late with Isha.")],
  nt:TL3("In the second prayer\u2019s time, pray the earlier prayer first, then the second.","രണ്ടാമത്തെ നമസ്കാരത്തിന്റെ സമയത്ത്, ആദ്യത്തേത് ആദ്യം, പിന്നെ രണ്ടാമത്തേത് നമസ്കരിക്കുക.","في وقت الصلاة الثانية صلِّ الأولى أولًا ثم الثانية.")}),
jk_4:XM(TL3("Then the second prayer","പിന്നെ രണ്ടാമത്തെ നമസ്കാരം","ثم الصلاة الثانية"),{
  lines:[L1("أُصَلِّي فَرْضَ الْعَصْرِ أَرْبَعَ رَكَعَاتٍ مَجْمُوعًا مَعَ الظُّهْرِ جَمْعَ تَأْخِيرٍ لِلَّهِ تَعَالَى","Usallee fardal-asri arba\u2019a raka\u2019aatin majmoo\u2019an ma\u2019az-zuhri jam\u2019a ta\u2019kheerin lillaahi ta\u2019aalaa","അസ്ർ ഫർളിന്റെ നാല് റക്അത്ത്, ളുഹ്റിനോടൊപ്പം ജംഅ് തഅ്ഖീറായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","I intend to pray the four rak\u2019ahs of obligatory Asr, combined late with Dhuhr, for the sake of Allah."),
         L1("أُصَلِّي فَرْضَ الْعِشَاءِ أَرْبَعَ رَكَعَاتٍ مَجْمُوعًا مَعَ الْمَغْرِبِ جَمْعَ تَأْخِيرٍ لِلَّهِ تَعَالَى","Usallee fardal-ishaa\u2019i arba\u2019a raka\u2019aatin majmoo\u2019an ma\u2019al-maghribi jam\u2019a ta\u2019kheerin lillaahi ta\u2019aalaa","ഇശാ ഫർളിന്റെ നാല് റക്അത്ത്, മഗ്‌രിബിനോടൊപ്പം ജംഅ് തഅ്ഖീറായി, അല്ലാഹുവിനു വേണ്ടി ഞാൻ നിർവഹിക്കുന്നു.","The same for Isha, combined late with Maghrib.")],
  nt:TL3("Each prayer may also be shortened to two rak\u2019ahs (Maghrib stays three); see the Qasr guide.","ഓരോ നമസ്കാരവും രണ്ട് റക്അത്തായി ചുരുക്കാനും കഴിയും (മഗ്‌രിബ് മൂന്ന് തന്നെ); ഖസ്ർ ഗൈഡ് കാണുക.","ويجوز قصر كل صلاة إلى ركعتين (والمغرب تبقى ثلاثًا)؛ راجع دليل القصر.")}),
/* ---- travel: on a vehicle ---- */
vh_1:XM(TL3("Before you pray","നമസ്കരിക്കുന്നതിന് മുമ്പ്","قبل أن تصلي"),{pose:"info",
  b:TL3("Try to pray on time. If you can, pray the obligatory prayer on the ground, before the journey or when the vehicle stops. Praying on the move is for when you cannot do that.",
        "സമയത്ത് നമസ്കരിക്കാൻ ശ്രമിക്കുക. സാധിക്കുമെങ്കിൽ യാത്രക്ക് മുമ്പോ വാഹനം നിർത്തുമ്പോഴോ നിലത്ത് ഫർള് നമസ്കരിക്കുക. അതിന് കഴിയാത്തപ്പോഴാണ് ചലിക്കുന്ന വാഹനത്തിൽ നമസ്കരിക്കുന്നത്.",
        "حاول أن تصلي في وقتها. وإن استطعت فصلِّ الفريضة على الأرض قبل السفر أو عند توقف المركبة. والصلاة أثناء الحركة لمن لم يستطع ذلك.")}),
vh_2:XM(TL3("Ship, train or plane","കപ്പൽ, ട്രെയിൻ, വിമാനം","السفينة والقطار والطائرة"),{pose:"info",
  b:TL3("For the obligatory prayer, face the Qibla at the start and keep facing it as best you can; if the vehicle turns, turn with it. Stand if you are able, otherwise sit. Bow and prostrate fully if possible; if not, gesture, lowering your head further for the prostration.",
        "ഫർള് നമസ്കാരത്തിന്, തുടക്കത്തിൽ ഖിബ്ലക്ക് അഭിമുഖമാവുകയും കഴിയുന്നത്ര അങ്ങനെ തുടരുകയും ചെയ്യുക; വാഹനം തിരിഞ്ഞാൽ കൂടെ തിരിയുക. സാധിക്കുമെങ്കിൽ നിൽക്കുക, ഇല്ലെങ്കിൽ ഇരിക്കുക. സാധ്യമെങ്കിൽ റുകൂഉം സുജൂദും പൂർണമായി ചെയ്യുക; ഇല്ലെങ്കിൽ ആംഗ്യം കാണിക്കുക, സുജൂദിന് തല കൂടുതൽ താഴ്ത്തുക.",
        "في الفريضة استقبل القبلة عند البدء وداوم على استقبالها قدر الإمكان، وإذا انحرفت المركبة فانحرف معها. قم إن استطعت وإلا فاجلس. واركع واسجد تامًّا إن أمكن، وإلا فأَومِئ وأخفض رأسك في السجود أكثر."),
  nt:TL3("If you could not meet these conditions, you may need to repeat the prayer later. Please ask your scholar about your case.","ഈ നിബന്ധനകൾ പാലിക്കാൻ കഴിഞ്ഞില്ലെങ്കിൽ പിന്നീട് നമസ്കാരം മടക്കി നമസ്കരിക്കേണ്ടി വന്നേക്കാം. നിങ്ങളുടെ സാഹചര്യത്തെക്കുറിച്ച് പണ്ഡിതനോട് ചോദിക്കുക.","إن لم تستطع تحقيق هذه الشروط فقد تحتاج إلى إعادة الصلاة لاحقًا. يُرجى سؤال عالِم عن حالتك.")}),
vh_3:XM(TL3("Voluntary prayers","നഫ്ൽ നമസ്കാരങ്ങൾ","النوافل"),{pose:"info",
  b:TL3("Sunnah and nafl prayers may be prayed on any vehicle, facing the direction of travel, with gestures for bowing and prostrating.",
