<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Mihrab – a prayer companion: prayer times, Qibla, calendar, guides and reminders. Works offline.">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

<title>Mihrab – prayer companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --display:"Cormorant Garamond","Noto Serif Malayalam","Amiri","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Hanken Grotesk","Noto Sans Malayalam","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --ml:"Hanken Grotesk","Noto Sans Malayalam","Manjari","Kartika",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

html{transition:--midnight 1.6s cubic-bezier(.4,0,.2,1),--night 1.6s cubic-bezier(.4,0,.2,1),--dusk 1.6s cubic-bezier(.4,0,.2,1),--dusk2 1.6s cubic-bezier(.4,0,.2,1),--gold 1.6s cubic-bezier(.4,0,.2,1),--goldhi 1.6s cubic-bezier(.4,0,.2,1),--goldlo 1.6s cubic-bezier(.4,0,.2,1),--ivory 1.6s cubic-bezier(.4,0,.2,1),--mist 1.6s cubic-bezier(.4,0,.2,1),--mist2 1.6s cubic-bezier(.4,0,.2,1),--line 1.6s cubic-bezier(.4,0,.2,1),--line-soft 1.6s cubic-bezier(.4,0,.2,1),--on-gold 1.6s cubic-bezier(.4,0,.2,1),--btn-a 1.6s cubic-bezier(.4,0,.2,1),--btn-b 1.6s cubic-bezier(.4,0,.2,1),--bg-glow 1.6s cubic-bezier(.4,0,.2,1),--card-a 1.6s cubic-bezier(.4,0,.2,1),--card-b 1.6s cubic-bezier(.4,0,.2,1),--chip-bg 1.6s cubic-bezier(.4,0,.2,1),--tabbar 1.6s cubic-bezier(.4,0,.2,1),--sheet-bg 1.6s cubic-bezier(.4,0,.2,1),--toast-bg 1.6s cubic-bezier(.4,0,.2,1),--sw-off 1.6s cubic-bezier(.4,0,.2,1),--gold-a18 1.6s cubic-bezier(.4,0,.2,1),--nxt-a 1.6s cubic-bezier(.4,0,.2,1),--nxt-b 1.6s cubic-bezier(.4,0,.2,1),--pose-bg 1.6s cubic-bezier(.4,0,.2,1),--shade 1.6s cubic-bezier(.4,0,.2,1),--arch-a 1.6s cubic-bezier(.4,0,.2,1),--arch-b 1.6s cubic-bezier(.4,0,.2,1),--arch-prog 1.6s cubic-bezier(.4,0,.2,1),--arch-dot 1.6s cubic-bezier(.4,0,.2,1),--dial-a 1.6s cubic-bezier(.4,0,.2,1),--dial-b 1.6s cubic-bezier(.4,0,.2,1)}
html.no-anim,html.no-anim *{transition:none!important}

/* ---- themes: midnight (default, also used inside device mock-ups) and dawn ---- */
:root,.dev{
  --midnight:#0A1022; --night:#0F1830; --dusk:#16213F; --dusk2:#1E2B50;
  --gold:#D6B26E; --goldhi:#F1DCA8; --goldlo:#8F7340;
  --ivory:#EFE8D6; --mist:#9AA3BF; --mist2:#6B759A;
  --line:rgba(214,178,110,.2); --line-soft:rgba(214,178,110,.1);
  --on-gold:var(--on-gold); --btn-a:#E3C27F; --btn-b:#C99F55;
  --bg-glow:#1D2D5C; --card-a:var(--card-a); --card-b:var(--card-b);
  --chip-bg:var(--card-b); --tabbar:rgba(10,16,34,.92); --sheet-bg:#0F1830; --toast-bg:#1E2B50;
  --sw-off:#27345F; --gold-a18:rgba(214,178,110,.18); --nxt-a:rgba(214,178,110,.16); --nxt-b:rgba(214,178,110,.04);
  --pose-bg:rgba(10,16,34,.5); --shade:rgba(3,6,16,.62);
  --arch-a:#22336B; --arch-b:#0D1630; --arch-prog:#F1DCA8; --arch-dot:#FFF3CF;
  --dial-a:#16244B; --dial-b:#0B1330;
  color-scheme:dark;
}
.dev{color:var(--ivory)}
html[data-theme="day"]{
  --midnight:#EEF1F6; --night:#F7F8FB; --dusk:#E4E9F2; --dusk2:#DCE3EF;
  --gold:#9A6C15; --goldhi:#7D5410; --goldlo:#B39254;
  --ivory:#14203F; --mist:#55607E; --mist2:#7A84A2;
  --line:rgba(122,84,16,.24); --line-soft:rgba(122,84,16,.13);
  --on-gold:#FFF8E6; --btn-a:#B8862A; --btn-b:#946913;
  --bg-glow:#FBE0AE; --card-a:rgba(255,255,255,.88); --card-b:rgba(255,255,255,.62);
  --chip-bg:rgba(255,255,255,.7); --tabbar:rgba(244,246,250,.93); --sheet-bg:#F7F8FB; --toast-bg:#FFFFFF;
  --sw-off:#C9D1E2; --gold-a18:rgba(154,108,21,.2); --nxt-a:rgba(154,108,21,.17); --nxt-b:rgba(154,108,21,.04);
  --pose-bg:rgba(255,255,255,.65); --shade:rgba(20,32,63,.4);
  --arch-a:#FFF6DE; --arch-b:#F3D399; --arch-prog:#9A6C15; --arch-dot:#6E4A0C;
  --dial-a:#FFFFFF; --dial-b:#E3E9F3;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--midnight)}
body{margin:0;height:100%;background:var(--midnight);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--goldhi);outline-offset:2px;border-radius:8px}
.ml{font-family:var(--ml)}
.ar{font-family:var(--ar)}
.num{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum","tnum"}

/* stage + phone */
.stage{height:100%;display:grid;place-items:center;padding:16px}
.phone{--sb:52px;position:relative;width:390px;height:min(844px,calc(100dvh - 32px));min-height:600px;overflow:hidden;border-radius:46px;border:1px solid rgba(214,178,110,.3);box-shadow:0 0 0 8px #060a17,0 40px 90px rgba(0,0,0,.55);
  background:radial-gradient(130% 55% at 50% -5%,var(--bg-glow) 0%,transparent 62%),var(--midnight)}
.sbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:13px;font-weight:600;z-index:5;pointer-events:none}
.sbar svg{width:18px;height:18px;fill:var(--ivory)}
@media (max-width:520px){
  .stage{padding:0;display:block}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;border:0;box-shadow:none;--sb:20px}
  .sbar{display:none}
}
.screen{position:absolute;inset:0 0 72px 0;overflow-y:auto;overflow-x:hidden;padding:var(--sb) 20px 32px;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}

/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:72px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbar);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:4}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mist2);position:relative}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--gold)}
.tab[aria-selected=true]::before{content:"";position:absolute;top:-1px;width:26px;height:2px;background:var(--gold);border-radius:2px}

/* type */
h1{font-family:var(--display);font-weight:500;font-size:36px;line-height:1.05;margin:0;letter-spacing:.2px}
h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin:0}
.sub{color:var(--mist);font-size:14px;margin:4px 0 0}
.fine{color:var(--mist2);font-size:12px;line-height:1.55}

/* today header */
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hij{font-family:var(--display);font-size:30px;font-weight:500;line-height:1.05}
.greg{color:var(--mist);font-size:13.5px;margin-top:4px}
.loc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 11px 7px 9px;font-size:13px;color:var(--goldhi);background:var(--chip-bg);white-space:nowrap}
.loc svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero arch */
.hero{position:relative;width:min(100%,318px);aspect-ratio:300/340;margin:18px auto 6px}
.hero .arch{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hero-in{position:absolute;left:14%;right:14%;top:27%;bottom:7%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .nx{color:var(--mist);font-size:13px}
.hero .arn{font-family:var(--ar);font-size:54px;line-height:1.25;color:var(--goldhi);margin-top:2px}
.hero .enn{font-family:var(--display);font-size:24px;line-height:1.1;margin-top:-2px}
.hero .mln{font-family:var(--ml);font-size:13px;color:var(--mist);margin-top:2px}
.hero .cd{font-family:var(--display);font-size:42px;line-height:1;margin-top:14px;color:var(--ivory);font-weight:500}
.hero .at{font-size:13px;color:var(--mist);margin-top:6px}

/* prayer list */
.list{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:28px 1fr auto auto 38px;align-items:center;gap:10px;padding:11px 8px 11px 10px;border-radius:16px}
.row .dt{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mist2)}
.row .nm b{font-weight:500;font-size:16px;display:block;line-height:1.2}
.row .nm span{font-family:var(--ml);font-size:12px;color:var(--mist)}
.row .a{font-family:var(--ar);font-size:20px;color:var(--goldlo)}
.row time{font-family:var(--display);font-size:22px;font-weight:500;min-width:76px;text-align:end}
.row.past .nm,.row.past .a,.row.past time{opacity:.6}
.row.past .dt{background:var(--goldlo);border-color:var(--goldlo)}
.row.cur .dt{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-a18)}
.row.nxt{background:linear-gradient(90deg,var(--nxt-a),var(--nxt-b));outline:1px solid var(--line)}
.row.nxt .dt{border-color:var(--gold)}
.row.nxt .a,.row.nxt time{color:var(--goldhi)}
.row.sun{opacity:.75}
.row.sun .dt{border-style:dashed}
.bell{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--mist2)}
.bell svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bell.on{color:var(--gold)}
.bell.on svg path:first-child{fill:var(--gold-a18)}
.row .nob{width:36px}

/* chips / buttons */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--mist);white-space:nowrap;background:var(--chip-bg)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.chip small{opacity:.75;margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px}
.btn.gold{background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--on-gold)}
.btn.ghost{border:1px solid var(--line);color:var(--goldhi);background:var(--chip-bg)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* cards */
.card{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:22px;padding:16px}
.sec{margin-top:22px}
.sec>h3{margin:0 0 10px;font-family:var(--display);font-weight:500;font-size:21px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.setrow+.setrow{border-top:1px solid var(--line-soft)}
.setrow .t b{display:block;font-weight:500;font-size:15.5px}
.setrow .t span{font-size:12.5px;color:var(--mist)}
.sw{flex:none;width:48px;height:28px;border-radius:99px;background:var(--sw-off);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:left .2s,background .2s}
.sw[aria-checked=true]{background:var(--gold)}
.sw[aria-checked=true]::after{left:23px;background:var(--on-gold)}

/* guide */
.pbar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--goldlo),var(--goldhi));border-radius:3px;transition:width .35s}
.reader{margin-top:16px;padding:18px 18px 22px}
.rmeta{display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--gold)}
.rmeta button{color:var(--mist);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.thead{display:flex;gap:14px;align-items:center}
.pose{flex:none;width:84px;height:92px;border:1px solid var(--line);border-radius:42px 42px 14px 14px;display:grid;place-items:center;background:var(--pose-bg)}
.pose svg{width:68px;height:60px;fill:none;stroke:var(--gold);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.thead .t2{color:var(--mist);font-size:13.5px;margin-top:3px}
.lines{margin-top:18px;display:flex;flex-direction:column;gap:18px}
.ln{text-align:center}
.ln .ar{direction:rtl;font-size:29px;line-height:2.05;color:var(--goldhi)}
.ln .tr{font-style:italic;color:var(--mist);font-size:14px;line-height:1.55;margin-top:2px}
.ln .mn{margin-top:6px;font-size:15.5px;line-height:1.75;color:var(--ivory)}
.ln .mn.ml{font-size:15px;line-height:1.9}
.rep{display:inline-block;margin-top:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--goldhi)}
.note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--mist);line-height:1.6}
.gnav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.gnav .cnt{color:var(--mist);font-size:13px}
.gopts{margin-top:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--chip-bg)}
.seg button{padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--mist)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--on-gold);font-weight:600}

/* qibla */
.qwrap{position:relative;width:min(100%,318px);aspect-ratio:1;margin:22px auto 0;touch-action:none;cursor:grab;user-select:none}
.qwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.qwrap .glow{opacity:0;transition:opacity .3s}
.qwrap.al .glow{opacity:1}
.qwrap.al .rim{stroke:var(--goldhi)}
.qc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.qc .deg{font-family:var(--display);font-size:50px;font-weight:500;line-height:1}
.qc .dir{color:var(--mist);font-size:13px;margin-top:6px}
.qinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.qinfo .card{padding:14px}
.qinfo b{display:block;font-family:var(--display);font-size:26px;font-weight:500}
.qinfo span{font-size:12.5px;color:var(--mist)}
.qstatus{text-align:center;margin-top:16px;min-height:24px;font-size:14px;color:var(--mist)}
.qstatus.al{color:var(--goldhi)}

/* lock preview + widgets */
.lock{border-radius:28px;padding:22px 16px 16px;background:linear-gradient(170deg,#25386F 0%,#0F1830 70%);border:1px solid var(--line);text-align:center}
.lock .lt{font-family:var(--display);font-size:62px;line-height:1;font-weight:500}
.lock .ld{font-size:13px;color:var(--mist);margin:2px 0 18px}
.ntf{display:flex;gap:11px;text-align:start;background:rgba(10,16,34,.72);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 14px;backdrop-filter:blur(8px)}
.ntf+.ntf{margin-top:8px;opacity:.7;transform:scale(.97)}
.ntf .ic{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#16244B,#0A1022);border:1px solid var(--line);display:grid;place-items:center}
.ntf .ic svg{width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ntf .hd{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mist)}
.ntf b{display:block;font-weight:600;font-size:14.5px;margin-top:1px}
.ntf p{margin:1px 0 0;font-size:13px;color:var(--mist)}
.wall{border-radius:30px;padding:20px 16px 16px;background:radial-gradient(90% 50% at 70% 0%,#3A4F94 0%,rgba(58,79,148,0) 70%),linear-gradient(180deg,#14204A,#0B1228);border:1px solid var(--line)}
.wall .wt{font-family:var(--display);font-size:54px;font-weight:500;line-height:1;text-align:center}
.wall .wd{text-align:center;color:var(--mist);font-size:13px;margin:2px 0 16px}
.wg{background:rgba(10,16,34,.74);border:1px solid rgba(214,178,110,.28);border-radius:26px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w22{aspect-ratio:1;padding:14px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.w22 .arch{width:44px;height:50px;overflow:visible}
.w22 .an{position:absolute;right:14px;top:10px;font-family:var(--ar);font-size:28px;color:var(--goldhi);line-height:1.4}
.w22 .tm{font-family:var(--display);font-size:30px;line-height:1;font-weight:500}
.w22 .in{font-size:12px;color:var(--mist);margin-top:3px}
.wcap{font-size:12px;color:var(--mist2);text-align:center;margin-top:7px}
.w42{margin-top:12px;padding:14px 14px 12px}
.w42 .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w42 .top b{font-family:var(--display);font-size:19px;font-weight:500}
.w42 .top span{font-size:11.5px;color:var(--mist)}
.w42 .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.w42 .c{text-align:center;padding:7px 0 6px;border-radius:14px}
.w42 .c i{display:block;font-style:normal;font-size:11.5px;color:var(--mist)}
.w42 .c b{display:block;font-family:var(--display);font-size:16.5px;font-weight:600;margin-top:1px}
.w42 .c.n{background:var(--gold)}
.w42 .c.n i,.w42 .c.n b{color:var(--on-gold)}
.w42 .c.p{opacity:.45}
.w41{margin-top:12px;padding:11px 16px 12px}
.w41 .r{display:flex;justify-content:space-between;align-items:baseline}
.w41 b{font-family:var(--display);font-size:20px;font-weight:500}
.w41 span{font-size:13px;color:var(--goldhi)}
.mbar{height:3px;border-radius:3px;background:rgba(214,178,110,.18);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--gold)}
.dock{display:flex;justify-content:space-around;margin-top:18px}
.dock i{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}

/* sheet + banner + toast */
.shade{position:absolute;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;overflow-y:auto;background:var(--sheet-bg);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 20px 28px;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:9}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--mist2);opacity:.5;margin:0 auto 14px}
.sheet h2{margin-bottom:6px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 4px;text-align:start;border-top:1px solid var(--line-soft);font-size:15.5px}
.opt small{display:block;color:var(--mist);font-size:12.5px}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mist2)}
.opt[aria-checked=true] .rd{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 0 45%,transparent 50%)}
.banner{position:absolute;left:12px;right:12px;top:calc(var(--sb) - 10px);z-index:12;transform:translateY(-160%);transition:transform .45s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.banner.on{transform:none;pointer-events:auto}
.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--toast-bg);border:1px solid var(--line);color:var(--ivory);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s;z-index:13;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}



/* ---- about ---- */
.verlink{display:inline-block;margin-top:10px;color:var(--goldhi);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.about{text-align:center}
.about .logo{display:block;width:58px;height:66px;color:var(--gold);margin:8px auto 12px}
.about h2{font-size:36px}
.about .mlname{font-family:var(--ml);color:var(--mist);font-size:14px;margin-top:2px}
.vpill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--goldhi);margin-top:12px}
.about h3{font-family:var(--display);font-weight:500;font-size:21px;text-align:start;margin:26px 0 4px}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid var(--line-soft);text-align:start;font-size:14.5px}
.crow span{color:var(--mist);font-size:13px;text-align:end}
.crow.todo span{color:var(--goldhi)}
.about .priv{margin-top:22px;text-align:start;font-size:13.5px;line-height:1.6;color:var(--mist)}
.about .copy{margin-top:20px}
button.brand{background:none;border:0;padding:0;cursor:pointer}


/* ---- manual adjustment ---- */
.adjb{font-style:normal;color:var(--goldhi);margin-inline-start:6px;font-size:11.5px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.arow .t b{display:block;font-weight:500;font-size:15.5px}
.arow .t span{display:block;font-size:12.5px;color:var(--mist);margin-top:1px}
.arow .t span em{font-style:normal;color:var(--goldhi)}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--chip-bg);color:var(--goldhi);font-size:22px;line-height:1;display:grid;place-items:center}
.stp button[disabled]{opacity:.3;pointer-events:none}
.stp b{min-width:98px;text-align:center;font-weight:500;font-size:14px}
.stp b.z{color:var(--mist)}


/* ---- calendar ---- */
.datebtn{text-align:start;display:block}
.c-side{margin-top:6px}
.calbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.mbar2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}
.mbar2 .mt{text-align:center;min-width:0}
.mbar2 .mt h2{font-size:28px}
.mbar2 .mt span{font-size:13px;color:var(--goldhi)}
.navb{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--chip-bg);color:var(--goldhi);font-size:26px;line-height:1;display:grid;place-items:center;padding-bottom:3px}
.wdr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--mist);margin-bottom:4px}
.wdr .fri{color:var(--goldhi);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dcell{position:relative;aspect-ratio:1/1.12;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid transparent;min-width:0}
.dcell .g{font-family:var(--display);font-size:21px;font-weight:600;line-height:1}
.dcell .s{font-size:10.5px;color:var(--goldhi);line-height:1.1;opacity:.9}
.dcell .s.mo{font-weight:600}
.dcell.out{opacity:.38}
.dcell.fri{background:var(--nxt-b)}
.dcell.sel{border-color:var(--gold)}
.dcell.today{background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--on-gold)}
.dcell.today .s{color:var(--on-gold);opacity:.85}
.dcell i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.dcell.today i{background:var(--on-gold)}
.lg{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-inline-end:7px;vertical-align:middle}
.seld{margin-top:22px}
.seld .l1{font-size:14px;color:var(--mist)}
.seld .l2{font-family:var(--display);font-size:32px;font-weight:500;line-height:1.1;margin-top:4px;color:var(--goldhi)}
.seld .l3{font-size:13.5px;color:var(--mist);margin-top:2px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--goldhi)}
.w42x{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.w42x .c{text-align:center}
.w42x .c i{display:block;font-style:normal;font-size:11.5px;color:var(--mist)}
.w42x .c b{display:block;font-family:var(--display);font-size:18px;font-weight:600;margin-top:1px}
.up{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 0}
.up+.up{border-top:1px solid var(--line-soft)}
.up b{display:block;font-weight:500;font-size:15px}
.up .ml{display:block;font-size:12.5px;color:var(--mist)}
.up em{display:block;font-style:normal;font-size:12px;color:var(--mist2);margin-top:2px}
.up .when{flex:none;font-size:12.5px;color:var(--goldhi);border:1px solid var(--line);border-radius:999px;padding:4px 11px}


/* ---- qibla button, location row, settings ---- */
.qbtn{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--chip-bg);color:var(--gold);display:grid;place-items:center}
.qbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.locrow{display:flex;justify-content:flex-start;margin:14px 0 0}
.backb{display:inline-flex;align-items:center;color:var(--goldhi);font-size:14px;margin-bottom:12px}
.card.lc{padding:0 16px}
.card.lc .opt:first-child{border-top:0}
.slab{font-size:13px;color:var(--mist);margin:18px 4px 8px}
.st-b{margin-top:0}


/* ---- greeting, checkboxes, streak, welcome ---- */
.greet{min-width:0;flex:1}
.hi-h{font-family:var(--display);font-size:27px;font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-m{font-size:14px;color:var(--ivory);margin:6px 0 0;line-height:1.4}
.hi-ml{font-family:var(--ml);font-size:12.5px;color:var(--mist);margin:3px 0 0;line-height:1.65}
.ck{flex:none;width:26px;height:26px;border-radius:9px;border:1.8px solid var(--mist2);display:grid;place-items:center;color:transparent;justify-self:center;transition:background .2s,border-color .2s,color .2s}
.ck svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ck.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.ck.due{border-color:var(--gold)}
.ck.wait{opacity:.4;border-style:dashed}
.row.cur .ck:not(.on):not(.wait){box-shadow:0 0 0 4px var(--gold-a18)}
.row .dt{justify-self:center}
.stk{margin-top:22px;padding:18px 16px 16px}
.stk-top{display:flex;align-items:center;gap:14px}
.stk-flame{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--gold-a18);color:var(--gold)}
.stk-flame svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stk-flame.on svg{fill:var(--gold-a18)}
.stk-big b{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;display:block}
.stk-big span{font-size:13px;color:var(--mist)}
.stk-mini{margin-inline-start:auto;display:flex;gap:16px;text-align:center}
.stk-mini b{display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.stk-mini span{font-size:11.5px;color:var(--mist)}
.stk-mo{font-family:var(--display);font-size:21px;margin:18px 0 8px}
.skg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px}
.skd{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;min-width:0}
.skd svg{position:absolute;inset:0;width:100%;height:100%}
.skd .num{position:relative;font-size:12px;font-weight:500}
.skd.full{background:var(--gold-a18)}
.skd.full .num{color:var(--goldhi);font-weight:700}
.skd.today .num{color:var(--goldhi);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.skd.future{opacity:.35}
.welcome{position:absolute;inset:0;z-index:30;display:none;overflow-y:auto;padding:var(--sb) 24px 28px;background:radial-gradient(120% 50% at 50% -5%,var(--bg-glow) 0%,transparent 62%),var(--midnight)}
.welcome.on{display:flex}
.wlc{margin:auto;width:100%;max-width:420px;text-align:center}
.wlc .logo{width:58px;height:66px;color:var(--gold);display:block;margin:0 auto 14px}
.wlc h1{font-size:38px}
.wlc .mlh{font-family:var(--ml);color:var(--mist);margin-top:6px;font-size:15px}
.wlc p.lead{color:var(--mist);margin:16px 0 24px;font-size:15px;line-height:1.55}
.wlc .fld{text-align:start;margin-bottom:18px}
.wlc label,.wlc .lbl{display:block;font-size:13px;color:var(--mist);margin:0 4px 8px}
.wlc input{width:100%;border:1px solid var(--line);background:var(--chip-bg);color:var(--ivory);border-radius:16px;padding:15px 16px;font:inherit;font-size:16px}
.wlc input::placeholder{color:var(--mist2)}
.wlc .gq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtn{border:1px solid var(--line);background:var(--chip-bg);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;gap:2px;align-items:center}
.gbtn b{font-weight:500;font-size:16px}
.gbtn span{font-family:var(--ml);font-size:12.5px;color:var(--mist)}
.gbtn[aria-checked=true]{border-color:var(--gold);background:var(--gold-a18)}
.gbtn[aria-checked=true] b{color:var(--goldhi)}
.wlc .go{width:100%;margin-top:6px}
.wlc .skip{margin-top:14px;color:var(--mist);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.q-head{position:relative}
.locrow.qloc{position:absolute;top:-4px;right:0;margin:0}

/* ---- layout helpers (phone defaults) ---- */
.chips.scroll.g-chips{margin-top:16px}
.q-btn{text-align:center;margin-top:18px}
.q-hint{text-align:center;margin:14px 8px 0}
button.brand,.brand{display:none}
/* hero scales with its own width so it looks right on every screen */
.hero{container-type:inline-size}
.hero .nx{font-size:4.1cqw}
.hero .arn{font-size:17cqw}
.hero .enn{font-size:7.5cqw}
.hero .mln{font-size:4.1cqw}
.hero .cd{font-size:13.2cqw;margin-top:4.4cqw}
.hero .at{font-size:4.1cqw}

/* ---- tablet and up: side rail, no phone frame ---- */
@media (min-width:700px) and (max-height:700px){.tabs{grid-auto-rows:62px}}
@media (min-width:700px){
  .stage{padding:0;display:block}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;border:0;box-shadow:none;--sb:32px}
  .sbar{display:none}
  .tabs{top:0;right:auto;width:104px;height:auto;grid-template-columns:1fr;grid-auto-rows:78px;align-content:center;border-top:0;border-right:1px solid var(--line)}
  .tab{font-size:11.5px}
  .tab[aria-selected=true]::before{top:50%;left:-1px;width:3px;height:30px;margin-top:-15px;border-radius:0 3px 3px 0}
  button.brand,.brand{display:block;position:absolute;top:34px;left:50%;transform:translateX(-50%);width:30px;height:34px;color:var(--gold)}
  .brand svg{width:100%;height:100%;display:block}
  .screen{inset:0 0 0 104px;padding:var(--sb) max(36px,calc((100% - 680px)/2)) 56px}
  h1{font-size:40px}
  .hero{width:min(100%,380px)}
  .row{padding:13px 12px 13px 16px}
  .row time{font-size:24px}
  .reader{padding:24px 28px 28px}
  .ln .ar{font-size:34px}
  .ln .mn{font-size:16.5px}
  #s-widgets{padding-inline:max(36px,calc((100% - 600px)/2))}
  /* sheet becomes a centred dialog */
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(520px,92%);max-height:82%;border:1px solid var(--line);border-radius:28px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .banner{left:auto;right:24px;top:24px;width:400px;max-width:calc(100% - 48px)}
  .toast{bottom:32px;left:calc(50% + 52px)}
}
/* ---- wide tablet / landscape: two columns ---- */
@media (min-width:860px){
  .screen{padding-inline:max(44px,calc((100% - 1040px)/2))}
  h1{font-size:44px}
  #s-today.on{display:grid;grid-template-columns:minmax(300px,420px) minmax(340px,1fr);column-gap:64px;align-content:start}
  #s-today .th{grid-column:1/-1}
  #s-today .hero{grid-column:1;grid-row:2;width:100%;margin:18px 0 0;align-self:start}
  #s-today .list{grid-column:2;grid-row:2;margin-top:12px}
  #s-today .fine{grid-column:2;grid-row:3}
  #s-today .stk{grid-column:1;grid-row:3;margin-top:22px}

  #s-guide.on,#s-qibla.on,#s-rem.on,#s-cal.on,#s-set.on{bottom:auto;max-height:100%}
  #s-set.on{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;align-items:start;align-content:start}
  .st-head{grid-column:1/-1}
  #s-cal.on{display:grid;grid-template-columns:minmax(0,560px) minmax(300px,1fr);column-gap:56px;align-items:start;align-content:start}
  .c-head{grid-column:1/-1}
  .c-main{grid-column:1}
  .c-side{grid-column:2;margin-top:0}
  .seld{margin-top:18px}
  #s-guide.on{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr auto;grid-template-areas:"head main" "chips main" "trans main" "opts main" "fine main" ". nav";column-gap:56px;align-items:start}
  .g-head{grid-area:head}
  .chips.scroll.g-chips{grid-area:chips;flex-wrap:wrap;overflow:visible;margin:16px 0 0;padding:0}
  #reader{grid-area:main;margin-top:0}
  .g-trans{grid-area:trans;margin-top:16px}
  .g-opts{grid-area:opts;margin-top:18px}
  .g-fine{grid-area:fine}
  .gnav{grid-area:nav}

  #s-qibla.on{display:grid;grid-template-columns:minmax(0,440px) minmax(280px,1fr);grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"head head" "dial stat" "dial info" "dial btn" "dial hint";column-gap:64px;align-items:start}
  .q-head{grid-area:head}
  #qwrap{grid-area:dial;width:100%;margin:40px 0 0}
  .qstatus{grid-area:stat;text-align:start;margin-top:34px;font-size:16px}
  .qinfo{grid-area:info;margin-top:12px}
  .q-btn{grid-area:btn;text-align:start}
  .q-hint{grid-area:hint;text-align:start;margin:14px 0 0}

  #s-rem.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"head head" "perm lock" "rem lock" "lead lock" "sound lock";column-gap:64px;align-items:start}
  .r-head{grid-area:head}
  .r-perm{grid-area:perm}
  .r-rem{grid-area:rem}
  .r-lead{grid-area:lead}
  .r-sound{grid-area:sound}
  .r-lock{grid-area:lock;margin-top:22px}
}


/* ---- right-to-left (Arabic) ---- */
.hi-m,.hi-ml,.seld .l3,.up em,.up .ml,.ln .mn,.ln .tr,.t2,.row .nm span{unicode-bidi:plaintext}
html[dir="rtl"] .hi-ml{text-align:end}
html[dir="rtl"] .locrow.qloc{right:auto;left:0}
html[dir="rtl"] .opt>svg{transform:scaleX(-1)}
html[dir="rtl"] .ln .tr{direction:ltr}
html[dir="rtl"] .sw::after{left:auto;right:3px}
html[dir="rtl"] .sw[aria-checked=true]::after{left:auto;right:23px}
html[dir="rtl"] .brand svg{transform:none}
.wlc .chips{justify-content:center;margin-bottom:22px}
@media (min-width:700px){
  html[dir="rtl"] .tabs{left:auto;right:0;border-right:0;border-left:1px solid var(--line)}
  html[dir="rtl"] .screen{inset:0 104px 0 0}
  html[dir="rtl"] .tab[aria-selected=true]::before{left:auto;right:-1px;border-radius:3px 0 0 3px}
  html[dir="rtl"] .banner{right:auto;left:24px}

function sunPos(jd){

function calc(y,m,d,lat,lng,tz,mt,asrF){

  const asr=(f,t)=>{const dc=sunPos(jd+t).decl;return ang(-acot(f+tan(Math.abs(lat-dc))),t,false)};
  const adj=h=>h+tz-lng/15;
  const sunset=adj(ang(0.833,18/24,false));
  return {
    fajr:adj(ang(mt.fajr,5/24,true)),
    sunrise:adj(ang(0.833,6/24,true)),
    dhuhr:adj(mid(12/24)),
    asr:adj(asr(asrF,13/24)),

}

const fH=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric",timeZone:"UTC"});
const hc=new Map();
/* n = whole days since 1970-01-01 (local calendar day). Returns Hijri {d,m,y} with the user's day correction. */
function hij(n){
  const k=n+"|"+(S.hadj||0);let r=hc.get(k);if(r)return r;
  const parts=fH.formatToParts(new Date((n+(S.hadj||0))*864e5+432e5));
  const get=t=>{const x=parts.find(p=>p.type===t);return x?parseInt(x.value.replace(/\D/g,""),10):NaN};
  const yp=parts.find(p=>p.type==="year"||p.type==="relatedYear");
  r={d:get("day"),m:get("month"),y:yp?parseInt(yp.value.replace(/\D/g,""),10):NaN};
  hc.set(k,r);return r;
}
function dateLines(now,E){
  const shift=E.today.maghrib<=now?1:0;
  const n=Math.floor(Date.UTC(E.Y,E.M-1,E.Dd)/864e5),h=hij(n+shift);
  const gd=new Date(Date.UTC(E.Y,E.M-1,E.Dd,12));
  const gr=WDF[gd.getUTCDay()]+" "+gd.getUTCDate()+" "+GM[gd.getUTCMonth()];
  return {hj:h.d+" "+HM[h.m-1]+" "+h.y,gr,hd:h.d,hm:HM[h.m-1],hy:h.y};
}

/* ---------- mihrab arch (the signature element) ---------- */
const ARCH="M24 330V168C24 98 110 82 150 12C190 82 276 98 276 168V330";
const MEASURE=$("#measure"),ARCH_LEN=MEASURE.getTotalLength();
let uid=0;
function archSVG(o={}){
  const id=++uid,sw=o.sw||3;
  return `<svg class="arch" data-arch viewBox="0 0 300 340" aria-hidden="true">
  <defs>
    <linearGradient id="ag${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--arch-a)"/><stop offset="1" style="stop-color:var(--arch-b)"/></linearGradient>
    <pattern id="ap${id}" width="38" height="38" patternUnits="userSpaceOnUse">
      <rect x="9.500" y="9.500" width="19" height="19" fill="none" style="stroke:var(--gold)" stroke-width=".7"/>
      <rect x="9.500" y="9.500" width="19" height="19" fill="none" style="stroke:var(--gold)" stroke-width=".7" transform="rotate(45 19 19)"/>
    </pattern>
    <filter id="af${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <path d="${ARCH}" fill="url(#ag${id})"/>
  ${o.pattern===false?"":`<path d="${ARCH}" fill="url(#ap${id})" opacity=".13"/>`}
  <path d="${ARCH}" fill="none" style="stroke:var(--gold)" stroke-opacity=".28" stroke-width="${sw*.55}"/>
  ${o.inner===false?"":`<path d="${ARCH}" transform="translate(150 330) scale(.9 .93) translate(-150 -330)" fill="none" style="stroke:var(--gold)" stroke-opacity=".16" stroke-width="1.2"/>`}
  <path class="prog-glow" d="${ARCH}" fill="none" style="stroke:var(--gold)" stroke-width="${sw*2}" stroke-linecap="round" opacity=".35" filter="url(#af${id})"/>
  <path class="prog" d="${ARCH}" fill="none" style="stroke:var(--arch-prog)" stroke-width="${sw}" stroke-linecap="round"/>
  <circle class="dot-glow" r="${sw*3}" style="fill:var(--arch-prog)" opacity=".22"/>
  <circle class="dot" r="${sw*1.5}" style="fill:var(--arch-dot)"/>
</svg>`;
}
function setArch(svg,p){
  const a=ARCH_LEN*p,pt=MEASURE.getPointAtLength(a);
  const d=`${a} ${ARCH_LEN*2}`;
  $$(".prog,.prog-glow",svg).forEach(el=>el.style.strokeDasharray=d);
  $$(".dot,.dot-glow",svg).forEach(el=>{el.setAttribute("cx",pt.x);el.setAttribute("cy",pt.y)});
}

function bellBtn(k){

function renderToday(E,now){
  const N=NAMES[E.next.key],mask=maskOf(localDay()),msg=encourage(now,E);
  const rows=[["fajr"],["sunrise"],["dhuhr"],["asr"],["maghrib"],["isha"]].map(([k])=>{
    const ms=E.today[k],past=ms<=now;
    const isNext=k===E.next.key&&E.next.o===0;
    const isCur=E.prev.o===0&&E.prev.key===k||(k==="isha"&&E.prev.o===-1&&E.prev.key==="isha");
    const cls=["row",k==="sunrise"?"sun":"",past&&!isCur?"past":"",isCur?"cur":"",isNext?"nxt":""].join(" ");
    return `<div class="${cls}">${k==="sunrise"?'<span class="dt"></span>':ckBtn(k,ms<=now,!!(mask&BIT[k]))}<div class="nm"><b>${NAMES[k].p}</b><span>${S.adj[k]?` <em class="adjb">${adjTxt(S.adj[k])}</em>`:""}</span></div><span class="a">${LANG==="ar"?"":NAMES[k].ar}</span><time class="num">${fmtH(ms)}</time>${k==="sunrise"?'<span class="nob"></span>':bellBtn(k)}</div>`;
  }).join("");
  $("#s-today").innerHTML=`
  <header class="th">
    <div class="greet"><div class="hi-h">${esc(msg.h[LANG])}</div><p class="hi-m" dir="auto">${msg[LANG]}</p></div>
    <button class="qbtn" data-act="tab" data-v="qibla" aria-label="${tx("Qibla direction")}">${IC.qibla}</button>
  </header>
  <div class="hero">
    ${archSVG({})}
    <div class="hero-in">
      <div class="nx">${tx("Next prayer")}</div>
      <div class="arn">${N.ar}</div>
      ${LANG==="ar"?"":`<div class="enn">${NAMES[E.next.key][LANG]}</div>`}
      <div class="cd num b-cd">${hms(E.next.ms-now)}</div>
      <div class="at num">${tx("{0} at {1}",N.p,fmt(E.next.ms))}</div>
    </div>
  </div>
  <div class="list">${rows}</div>
  ${streakHTML(now)}
  <p class="fine" style="margin:14px 8px 0">${cn(E.L)} · ${tx(METHODS[S.method].n)} · ${tx("Asr: {0}",tx(S.asr==="hanafi"?"Hanafi":"Shafi\u2019i"))}${adjCount()?` · ${tx("{0} adjusted",adjCount())}`:""}. ${tx("Tap the bell to set a reminder.")}</p>`;
}

      NTR[p]+" mustaqbilal-qiblati adaa\u2019an lillaahi ta\u2019aalaa",
      "ഖിബ്ലക്ക് അഭിമുഖമായി, അല്ലാഹുവിനു വേണ്ടി, "+nm.ml+" ഫർള് നമസ്കാരത്തിലെ "+MLC[n]+" റക്അത്ത് ഞാൻ നിർവഹിക്കുന്നു.",

  }
  if(k==="sujud1"||k==="sujud2"){const c=Object.assign({},BASE.sujud);if(k==="sujud2"){c.tEn="Second prostration";c.tMl="രണ്ടാം സുജൂദ്";c.tAr="السجدة الثانية"}return c}
  return BASE[k];

function buildSteps(p){
  const n=RAK[p],out=[],add=(k,r,x)=>out.push(Object.assign({k,r},x||{}));
  for(let r=1;r<=n;r++){
    if(r===1){add("niyyah",1);add("takbir",1);add("iftitah",1)}
    add("fatiha",r);if(r<=2)add("surah",r);
    add("ruku",r);add("itidal",r);add("sujud1",r);add("sit",r);add("sujud2",r);
    if(r===2&&n>2)add("tashahhud",r,{first:true});
    if(r===n){add("tashahhud",r);add("salawat",r);add("salam",r)}
  }
  return out;
}

const bearingTo=(lat,lon)=>{const p1=lat*D2R,p2=KAABA.lat*D2R,dl=(KAABA.lon-lon)*D2R;const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (atan2(y,x)+360)%360};
const distKm=(lat,lon)=>{const R=6371,dp=(KAABA.lat-lat)*D2R,dl=(KAABA.lon-lon)*D2R;const a=Math.sin(dp/2)**2+Math.cos(lat*D2R)*Math.cos(KAABA.lat*D2R)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(a))};

let aligned=false;
function setHeading(h){

  st.textContent=al?tx("You are facing the Qibla"):tx(((b-heading+360)%360)<180?"Turn right {0}°":"Turn left {0}°",Math.round(diff));
  if(al&&!aligned&&navigator.vibrate){try{navigator.vibrate(30)}catch(e){}}
  aligned=al;
}
function updateQibla(){

  $("#qbear").textContent=b.toFixed(1)+"°";

  $("#qsub").textContent=tx("Face {0} ({1}°) from your location",cardinal(b),Math.round(b));
  $("#qloc").textContent=cn(L);
  setHeading(heading);
}
function startSensor(){
  if(sensorOn)return;sensorOn=true;
  const h=e=>{
    let v=null;
    if(typeof e.webkitCompassHeading==="number")v=e.webkitCompassHeading;
    else if(e.alpha!=null&&(e.absolute||e.type==="deviceorientationabsolute"))v=360-e.alpha;
    if(v==null)return;
    sensorLive=true;
    const d=((v-heading+540)%360)-180;setHeading(heading+d*.25);
    const t=$("#qhint");if(t)t.textContent=tx("Live compass on. Hold your phone flat.");
  };
  window.addEventListener("deviceorientationabsolute",h,true);
  window.addEventListener("deviceorientation",h,true);
  setTimeout(()=>{if(!sensorLive){const t=$("#qhint");if(t)t.textContent=tx("No compass signal here. Drag the dial to try it.")}},2200);
}
function enableCompass(){

  if(S.sound!=="chime")return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    [[659.25,0],[880,.28],[1318.5,.56]].forEach(([f,d])=>{

      o.type="sine";o.frequency.value=f;

}

const hStart=n=>n-(hij(n).d-1);

const dkey=n=>{const g=gparts(n);return g.y+"-"+String(g.m+1).padStart(2,"0")+"-"+String(g.d).padStart(2,"0")};

function streakNow(today){let n=isFull(today)?today:today-1,c=0;while(isFull(n)){c++;n--}return c}
function bestStreak(){
  const ds=Object.keys(S.log).filter(k=>S.log[k]===FULL).map(k=>{const [y,m,d]=k.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5}).sort((a,b)=>a-b);
  let best=0,run=0,prev=null;

}

  const today=localDay(),wd=gparts(today).w,start=today-wd;            /* week runs Sunday to Saturday */
  const cur=streakNow(today),best=Math.max(bestStreak(),cur);
  const weeks=Math.floor(cur/7),months=Math.floor(cur/30);             /* completed 7-day and 30-day blocks of the running streak */
  let cells="";
  for(let i=0;i<7;i++){
    const n=start+i,g=gparts(n),m=maskOf(n),full=m===FULL;
    if(n>today){cells+=`<div class="skd future">${ringSVG(0)}<span class="num">${g.d}</span></div>`;continue}
    cells+=`<div class="skd ${n===today?"today":""} ${full?"full":""}" role="img" aria-label="${tx("{0} {1}: {2} of 5 prayers",g.d,GM[g.m],cnt(m))}">${ringSVG(m)}<span class="num">${g.d}</span></div>`;
  }
  return `<div class="card stk">
    <div class="stk-top"><div class="stk-flame ${cur?"on":""}">${FLAME}</div>
      <div class="stk-big"><b class="num">${cur}</b><span>${tx("day streak")}</span></div>
      <div class="stk-mini"><div><b class="num">${best}</b><span>${tx("Best")}</span></div></div></div>
    <div class="stk-pills"><span class="spill ${weeks?"on":""}">${tx("Week streak")} <b class="num">${weeks}</b></span><span class="spill ${months?"on":""}">${tx("Month streak")} <b class="num">${months}</b></span></div>
    <div class="wdr" style="margin-top:14px">${WDL.map((w,i)=>`<span class="${i===5?"fri":""}">${w}</span>`).join("")}</div>
    <div class="skg">${cells}</div>
    <p class="fine" style="margin:12px 2px 0">${tx("Each ring has five parts, one for each prayer.")}</p>
  </div>`;
}
function refreshHome(){const now=Date.now(),E=getEvents(now);renderToday(E,now);tick()}
function togglePrayer(k){
  const now=Date.now(),E=getEvents(now);
  if(E.today[k]>now){toast(tx("{0} can be ticked once its time begins",NP(k)));return}
  const n=localDay(),key=dkey(n),m=S.log[key]||0,nm=m^BIT[k];
  if(nm)S.log[key]=nm;else delete S.log[key];
  save();refreshHome();
  if(navigator.vibrate){try{navigator.vibrate(12)}catch(e){}}
  toast(nm===FULL?tx("All five done. Alhamdulillah!"):(nm&BIT[k])?tx("{0} marked",NP(k)):tx("{0} unmarked",NP(k)));
}
/* ---------- welcome / profile ---------- */
const WL=$("#welcome");let wst={name:"",g:null,edit:false};
function openWelcome(edit,keep){
  const pf=S.profile||{};
  if(!keep)wst={name:pf.name||"",g:pf.g||null,edit:!!edit};
  edit=wst.edit;
  WL.innerHTML=`<div class="wlc">
    <div class="chips" role="group" aria-label="${tx("Language")}">${Object.entries(LANGS).map(([k,l])=>`<button class="chip" aria-pressed="${k===LANG}" data-act="wlang" data-v="${k}">${l.name}</button>`).join("")}</div>
    <svg class="logo" viewBox="0 0 30 34" aria-hidden="true"><path d="M3 32V17C3 10 11 8 15 2C19 8 27 10 27 17V32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="21" r="2" fill="currentColor"/></svg>
    <h1 id="wtitle">${edit?tx("Your profile"):tx("Welcome to Mihrab")}</h1>
    
    <p class="lead">${edit?tx("Update how we address you."):tx("Tell us a little about you, so we can cheer you on with every prayer.")}</p>
    <div class="fld"><label for="wname">${tx("Your name")}</label><input id="wname" type="text" maxlength="24" autocomplete="given-name" placeholder="${tx("Enter your name")}" value="${esc(wst.name)}"></div>
    <div class="fld"><div class="lbl" id="wgl">${tx("Gender")}</div>
      <div class="gq" role="radiogroup" aria-labelledby="wgl">
        <button class="gbtn" role="radio" aria-checked="${wst.g==="m"}" data-act="wgender" data-v="m"><b>${tx("Male")}</b></button>
        <button class="gbtn" role="radio" aria-checked="${wst.g==="f"}" data-act="wgender" data-v="f"><b>${tx("Female")}</b></button>
      </div></div>
    <button class="btn gold go" id="wgo" data-act="wsave">${edit?tx("Save"):tx("Continue")}</button>
    ${edit?`<button class="skip" data-act="wcancel">${tx("Cancel")}</button>`:`<p class="fine" style="margin-top:16px">${tx("Stored only on this device.")}</p>`}
  </div>`;
  WL.classList.add("on");
  const inp=$("#wname",WL);
  inp.addEventListener("input",()=>{wst.name=inp.value;wCheck()});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&wOk())$("#wgo").click()});
  wCheck();if(!keep)setTimeout(()=>{try{inp.focus()}catch(e){}},80);
}
const wOk=()=>wst.name.trim().length>0&&!!wst.g;
function wCheck(){const b=$("#wgo");if(b)b.disabled=!wOk()}
function saveWelcome(){
  if(!wOk())return;
  S.profile={name:wst.name.trim().slice(0,24),g:wst.g};save();
  WL.classList.remove("on");refreshAll();
  toast(wst.edit?tx("Profile updated"):tx("Welcome, {0}",S.profile.name));
}

function labelScreens(){
  [["today","Today"],["cal","Calendar"],["guide","Prayer guide"],["qibla","Qibla"],["rem","Reminders"],["set","Settings"],["widgets","Widgets"]].forEach(([id,k])=>{const e=$("#s-"+id);if(e)e.setAttribute("aria-label",tx(k))});
}
function buildTabs(){
  labelScreens();
$("#tabs").innerHTML='<button class="brand" data-act="about" aria-label="'+tx("About {0}",appn())+'"><svg viewBox="0 0 30 34" aria-hidden="true"><path d="M3 32V17C3 10 11 8 15 2C19 8 27 10 27 17V32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+TABS.map(([id,t],i)=>`<button class="tab" role="tab" data-act="tab" data-v="${id}" aria-selected="${i===0}">${TABICON[id]}<span>${tx(t)}</span></button>`).join("");
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===(({qibla:"today",widgets:"set"})[curTab]||curTab)));
}
function applyLang(){
  const h=document.documentElement;h.lang=LANG;h.dir=LANGS[LANG].dir;setLists();
  buildTabs();renderGuide();buildQibla();renderCal();refreshAll();
}
function setLang(v){
  if(!LANGS[v])return;
  LANG=v;S.lang=v;S.glang=v==="ml"?"ml":"en";S.translit=(v==="en");save();applyLang();
}
/* ---------- installable web app: service worker, install, updates, offline ---------- */
const CAN_PWA="serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&window.top===window.self;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let deferredInstall=null,swReg=null,updReg=null,updating=false;
function installApp(){
  if(deferredInstall){const d=deferredInstall;deferredInstall=null;d.prompt();d.userChoice.finally(()=>renderSettings());return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const steps=ios?["Tap the Share button in Safari","Choose Add to Home Screen","Tap Add"]:["Open your browser menu","Choose Install app or Add to Home screen"];
  openSheet(`<h2>${tx("Install {0}",appn())}</h2><p class="sub" style="margin-bottom:6px">${tx("Add it to your home screen for full-screen use and offline access.")}</p>
    <ol class="inst">${steps.map((t,i)=>`<li><b>${i+1}</b><span>${tx(t)}</span></li>`).join("")}</ol>
    <button class="btn gold" style="width:100%" data-act="close">${tx("Done")}</button>`);
}
function showUpdate(reg){
  updReg=reg;
  $("#upd").innerHTML=`<span>${tx("A new version is ready.")}</span><button class="btn gold" style="padding:8px 16px;font-size:13.5px" data-act="applyupd">${tx("Refresh")}</button>`;
  $("#upd").classList.add("on");
}
if(CAN_PWA){
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;renderSettings()});
  window.addEventListener("appinstalled",()=>{deferredInstall=null;toast(tx("App installed"));renderSettings()});
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      swReg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg);
      reg.addEventListener("updatefound",()=>{const nw=reg.installing;if(nw)nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller)showUpdate(reg)})});
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(updating)location.reload()});
  window.addEventListener("offline",()=>toast(tx("You\u2019re offline. Everything still works.")));
  window.addEventListener("online",()=>toast(tx("Back online")));
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}

/* ---------- init ---------- */
setLists();document.documentElement.lang=LANG;document.documentElement.dir=LANGS[LANG].dir;
buildTabs();
renderGuide();buildQibla();
document.documentElement.classList.add("no-anim");
tick(true);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove("no-anim")));
setInterval(()=>tick(false),1000);
if(!S.profile)openWelcome(false);
try{const q=new URLSearchParams(location.search).get("tab");if(q&&["today","cal","guide","rem","set","qibla","widgets"].includes(q))setTab(q)}catch(e){}
})();
</script>
